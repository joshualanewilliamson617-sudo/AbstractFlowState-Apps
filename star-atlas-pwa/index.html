<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Star Atlas">
<meta name="description" content="Point your phone at the sky. Real stars, twenty sky cultures, and constellations you draw yourself.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Star Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking. A render-blocking stylesheet from another
     origin stops the script below from running at all until it answers, so a
     slow or unreachable font server froze the whole app on a blank screen.
     The page draws immediately in the fallback faces and swaps when they land. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --ink:#05070E; --ink2:#0D1322; --ink3:#161E33; --ink4:#1F2942;
  --parch:#E9E3D5; --dim:#8D96A9;
  --brass:#D9A441; --brass-deep:#8A6620; --steel:#6F8FB8; --ember:#C1462F;
  --line:rgba(233,227,213,.09);
  --sans:'Barlow Semi Condensed','SF Pro Display',system-ui,sans-serif;
  --serif:'Spectral',Georgia,serif;
  --nav:64px;
  --sab:env(safe-area-inset-bottom);
}
body.red{
  --ink:#0A0000; --ink2:#1C0505; --ink3:#280808; --ink4:#340B0B;
  --parch:#FF8A72; --dim:#AE4E3B;
  --brass:#FF6242; --brass-deep:#8C2A18; --steel:#C4503A; --ember:#FF3B18;
  --line:rgba(255,138,114,.11);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--sans);color:var(--parch);overscroll-behavior:none;
  font-size:16px;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg{display:block;flex:none}

/* ---------- top ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;padding:12px 14px;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(to bottom,rgba(5,7,14,.85),transparent)}
#top>*{pointer-events:auto}
#where{min-width:0}
.place{font-size:16px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.sub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:2px}

/* segmented mode control */
#seg{display:flex;background:rgba(22,30,51,.82);border-radius:13px;padding:3px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 2px 14px rgba(0,0,0,.5)}
#seg button{width:40px;height:36px;border:none;background:none;border-radius:10px;
  color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:.16s}
#seg button.on{background:var(--brass);color:#0B0A06}
body.red #seg button.on{color:#1A0000}

/* ---------- floating action button ---------- */
#fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--sab) + 18px);z-index:7;
  width:56px;height:56px;border-radius:28px;border:none;cursor:pointer;
  background:rgba(22,30,51,.9);color:var(--parch);display:grid;place-items:center;
  box-shadow:0 4px 18px rgba(0,0,0,.55);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);transition:.18s}
#fab.on{background:var(--brass);color:#0B0A06;box-shadow:0 0 0 6px rgba(217,164,65,.16),0 4px 18px rgba(0,0,0,.55)}
body.red #fab.on{color:#1A0000}
#fab:active{transform:scale(.93)}
#lockbtn{position:fixed;right:22px;bottom:calc(var(--nav) + var(--sab) + 84px);z-index:7;
  width:44px;height:44px;border-radius:22px;border:none;cursor:pointer;display:none;
  place-items:center;background:rgba(22,30,51,.9);color:var(--parch);
  box-shadow:0 3px 14px rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#lockbtn.show{display:grid}
#lockbtn.on{background:var(--steel);color:#08101A}
#lockbtn:active{transform:scale(.93)}

/* ---------- bottom sheet: readout ---------- */
#readout{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + var(--sab) + 8px);z-index:8;
  background:rgba(13,19,34,.95);border-radius:20px;padding:16px 18px 15px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 6px 28px rgba(0,0,0,.6);
  transform:translateY(140%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
body.red #readout{background:rgba(28,5,5,.95)}
#readout.on{transform:translateY(0)}
#roName{font-family:var(--serif);font-size:23px;font-weight:400;line-height:1.15;padding-right:96px}
#roSub{font-size:13.5px;color:var(--dim);margin-top:6px;line-height:1.55;font-variant-numeric:tabular-nums}
#roNav{position:absolute;top:13px;right:13px;display:flex;gap:6px;align-items:center}
.rnd{width:34px;height:34px;border-radius:17px;background:var(--ink3);border:none;color:var(--parch);
  display:grid;place-items:center;cursor:pointer;font-size:17px;font-family:var(--sans)}
.rnd:active{background:var(--ink4)}
#roCount{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:26px;text-align:center}

/* ---------- bottom nav ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
  background:rgba(9,13,24,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line);padding-bottom:var(--sab);height:calc(var(--nav) + var(--sab))}
body.red #tabs{background:rgba(14,2,2,.95)}
.tab{flex:1;border:none;background:none;color:var(--dim);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.02em;
  padding:0;transition:color .15s}
.tab.on{color:var(--brass)}
.tab.draw.on{color:var(--ember)}
.tab:active{opacity:.6}

/* ---------- panel ---------- */
#scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5);opacity:0;
  pointer-events:none;transition:opacity .26s}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink2);
  border-radius:22px 22px 0 0;max-height:80vh;overflow-y:auto;
  transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(var(--nav) + var(--sab) + 12px);-webkit-overflow-scrolling:touch;
  box-shadow:0 -8px 34px rgba(0,0,0,.55)}
#panel.open{transform:translateY(0)}
#grab{position:sticky;top:0;z-index:2;background:var(--ink2);padding:9px 0 3px;
  border-radius:22px 22px 0 0;display:flex;justify-content:center}
#grab i{width:38px;height:4px;border-radius:2px;background:var(--ink4)}
.pad{padding:6px 18px 8px}
h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:10px 0 4px;letter-spacing:.005em}
h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:26px 0 3px}
.note{font-size:13.5px;color:var(--dim);line-height:1.55;margin:0 0 16px}
.row{display:flex;align-items:flex-end;gap:10px;margin:14px 0}
label.fld{font-size:12.5px;color:var(--dim);display:block;margin-bottom:6px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time]{
  width:100%;background:var(--ink3);border:none;color:var(--parch);font-family:var(--sans);
  font-size:16px;padding:13px 14px;border-radius:12px;outline:none}
input[type=text]:focus,input[type=number]:focus{box-shadow:0 0 0 2px var(--brass)}
input[type=range]{width:100%;accent-color:var(--brass);height:28px}

.btn{font-family:var(--sans);font-size:15px;font-weight:500;padding:0 18px;height:48px;
  background:var(--brass);border:none;color:#0B0A06;border-radius:13px;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
body.red .btn{color:#1A0000}
.btn:active{transform:scale(.975);filter:brightness(.92)}
.btn.ghost{background:var(--ink3);color:var(--parch)}
.btn.warn{background:var(--ember);color:#140302}
.btn.sm{height:38px;font-size:13.5px;padding:0 14px;border-radius:10px}
.btn.full{width:100%;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{font-size:13.5px;padding:9px 14px;border:none;color:var(--parch);background:var(--ink3);
  cursor:pointer;border-radius:20px;font-family:var(--sans);font-weight:500}
.chip.on{background:var(--brass);color:#0B0A06}
body.red .chip.on{color:#1A0000}

.cult{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 18px;
  border:none;background:none;cursor:pointer;font-family:var(--sans)}
.cult+.cult{box-shadow:inset 0 1px 0 var(--line)}
.cult.on{background:rgba(111,143,184,.1)}
.cult .ct{flex:1;min-width:0}
.cult .cn{font-family:var(--serif);font-size:18px;color:var(--parch);line-height:1.2}
.cult.on .cn{color:var(--steel)}
.cult .cb{font-size:12.5px;color:var(--dim);margin-top:2px}
.cult .cc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;
  background:var(--ink3);padding:4px 9px;border-radius:10px}

.item{display:flex;align-items:center;gap:10px;padding:13px 0}
.item+.item{box-shadow:inset 0 1px 0 var(--line)}
.item .mn{flex:1;min-width:0;font-family:var(--serif);font-size:17.5px;color:var(--brass);line-height:1.25}
.item .mn small{display:block;font-family:var(--sans);font-size:12px;color:var(--dim);
  margin-top:2px;font-weight:400}
.empty{font-size:14px;color:var(--dim);line-height:1.6;padding:16px 0;font-family:var(--serif)}

.tog{display:flex;justify-content:space-between;align-items:center;padding:15px 0;
  cursor:pointer;gap:14px}
.tog+.tog{box-shadow:inset 0 1px 0 var(--line)}
.tog span{font-size:15.5px;font-weight:500}
.tog span small{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;font-weight:400}
.sw{width:50px;height:30px;border-radius:15px;background:var(--ink4);position:relative;
  flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;
  background:#8D96A9;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tog.on .sw{background:var(--brass)}
.tog.on .sw::after{left:23px;background:#0B0A06}

#hint{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + var(--sab) + 8px);z-index:8;
  background:rgba(193,70,47,.94);border-radius:18px;padding:14px 16px;display:none;
  align-items:center;gap:12px;box-shadow:0 6px 26px rgba(0,0,0,.55)}
#hint.on{display:flex}
#hintTxt{flex:1;font-size:14px;line-height:1.4;color:#FFEFEA}
#hintBtn{background:#FFEFEA;color:#7A2416}

.warnbox{background:var(--ink3);border-radius:13px;padding:13px 15px;font-size:13px;
  color:var(--dim);line-height:1.55;margin:12px 0 16px}

/* ---------- welcome ---------- */
#welcome{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:0;padding:32px 28px;
  text-align:center;transition:opacity .5s}
#welcome.gone{opacity:0;pointer-events:none}
#welcome .mark{font-family:var(--serif);font-size:34px;font-weight:300;letter-spacing:.05em;margin-bottom:10px}
#welcome p{font-size:15px;color:var(--dim);line-height:1.6;max-width:23em;margin:0 0 30px}
#welcome .btn{width:100%;max-width:20em}
#skip{background:none;border:none;color:var(--dim);font-family:var(--sans);font-size:14px;
  padding:16px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#wIcon{margin-bottom:22px;opacity:.9}
/* ---------- guided tour ---------- */
#tour{position:fixed;inset:0;z-index:50;display:none}
#tour.on{display:block}
#spot{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(3,5,10,.82);
  transition:all .32s cubic-bezier(.32,.72,0,1);pointer-events:none;
  border:2px solid var(--brass)}
#spot.hidden{box-shadow:0 0 0 9999px rgba(3,5,10,.82);border-color:transparent}
#tcard{position:absolute;left:14px;right:14px;background:var(--ink2);border-radius:18px;
  padding:18px 20px 16px;box-shadow:0 8px 34px rgba(0,0,0,.6);transition:top .32s cubic-bezier(.32,.72,0,1)}
#tcard h4{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 7px}
#tcard p{font-size:14.5px;line-height:1.55;color:var(--dim);margin:0}
#tcard p b{color:var(--parch);font-weight:500}
#tfoot{display:flex;align-items:center;gap:12px;margin-top:16px}
#tdots{flex:1;display:flex;gap:6px}
#tdots i{width:6px;height:6px;border-radius:3px;background:var(--ink4);transition:.2s}
#tdots i.on{background:var(--brass);width:18px}
#tskip{background:none;border:none;color:var(--dim);font-family:var(--sans);font-size:14px;
  cursor:pointer;padding:8px 4px}
@media (min-width:720px){#tcard{left:auto;right:24px;width:380px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:720px){.pad{padding:6px 28px 8px}#panel{max-height:78vh}
  #readout{left:auto;right:16px;width:400px}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="top">
  <div id="where">
    <div class="place" id="place">Star Atlas</div>
    <div class="sub" id="clock"></div>
  </div>
  <div id="seg">
    <button data-m="look" title="Looking"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
    <button data-m="horizon" title="Whole sky"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></button>
    <button data-m="map" title="Star map"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
  </div>
</div>

<button id="fab" title="Point at the sky">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
</button>

<button id="lockbtn" title="Freeze the view">
  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
</button>

<div id="readout">
  <div id="roNav">
    <button class="rnd" id="roPrev">&lsaquo;</button><span id="roCount"></span>
    <button class="rnd" id="roNext">&rsaquo;</button><button class="rnd" id="roX">&times;</button>
  </div>
  <div id="roName"></div><div id="roSub"></div>
</div>

<div id="hint"><div id="hintTxt"></div><button class="btn sm" id="hintBtn">Finish</button></div>

<div id="scrim"></div>
<div id="panel"><div id="grab"><i></i></div><div id="panelBody"></div></div>

<div id="tabs">
  <button class="tab" data-p="sky"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg>Sky</button>
  <button class="tab" data-p="cultures"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 17 4-9 5 4 5-8"/><circle cx="5" cy="17" r="1.7" fill="currentColor"/><circle cx="9" cy="8" r="1.7" fill="currentColor"/><circle cx="14" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="4" r="1.7" fill="currentColor"/></svg>Cultures</button>
  <button class="tab draw" data-p="draw"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5 19.6 12a2.9 2.9 0 0 0-4.1-4.1L8 15.4Z"/><path d="M8 15.4 6 21l5.6-1.5"/></svg>Draw</button>
  <button class="tab" data-p="layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Layers</button>
  <button class="tab" data-p="gallery"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>Gallery</button>
</div>

<div id="tour">
  <div id="spot"></div>
  <div id="tcard">
    <h4 id="ttitle"></h4><p id="ttext"></p>
    <div id="tfoot">
      <div id="tdots"></div>
      <button id="tskip">Skip</button>
      <button class="btn sm" id="tnext">Next</button>
    </div>
  </div>
</div>

<div id="welcome">
  <div id="wIcon"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 18 4.5-10L14 13l6-9"/><circle cx="4" cy="18" r="1.4" fill="#D9A441"/><circle cx="8.5" cy="8" r="1.7" fill="#D9A441"/><circle cx="14" cy="13" r="1.4" fill="#D9A441"/><circle cx="20" cy="4" r="1.9" fill="#D9A441"/></svg></div>
  <div class="mark">Star Atlas</div>
  <p>Hold your phone up and it shows the sky you are actually pointing at. For that it needs to know where you are and which way you are facing.</p>
  <button class="btn" id="wGo">Allow and begin</button>
  <button id="skip">Not now &mdash; pick a city instead</button>
</div>

<script>
/* register the service worker so the app installs and runs offline */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});

/* ---------- astronomy ---------- */
const D2R = Math.PI/180, R2D = 180/Math.PI;

function julianDay(d){ return d.getTime()/86400000 + 2440587.5; }

function gmstDeg(jd){
  const d = jd - 2451545.0, T = d/36525;
  let g = 280.46061837 + 360.98564736629*d + 0.000387933*T*T - T*T*T/38710000;
  return ((g%360)+360)%360;
}

/* IAU precession, J2000 -> epoch of date. Matters enormously for the
   historical sky cultures: 3000 years shifts the pole by ~40 degrees. */
let precA=null, precJD=null;
function setPrecession(jd){
  if (precJD !== null && Math.abs(jd-precJD) < 30) return;
  precJD = jd;
  const T = (jd - 2451545.0)/36525, S = 1/3600*D2R;
  const z1 = (2306.2181*T + 0.30188*T*T + 0.017998*T*T*T)*S;
  const z2 = (2306.2181*T + 1.09468*T*T + 0.018203*T*T*T)*S;
  const th = (2004.3109*T - 0.42665*T*T - 0.041833*T*T*T)*S;
  const cz1=Math.cos(z1),sz1=Math.sin(z1),cz2=Math.cos(z2),sz2=Math.sin(z2),
        ct=Math.cos(th),st=Math.sin(th);
  precA = [
    cz1*ct*cz2 - sz1*sz2,  -sz1*ct*cz2 - cz1*sz2,  -st*cz2,
    cz1*ct*sz2 + sz1*cz2,  -sz1*ct*sz2 + cz1*cz2,  -st*sz2,
    cz1*st,                -sz1*st,                 ct
  ];
}
function precess(raDeg, decDeg){
  const r=raDeg*D2R, d=decDeg*D2R, cd=Math.cos(d);
  const x=cd*Math.cos(r), y=cd*Math.sin(r), z=Math.sin(d), m=precA;
  const X=m[0]*x+m[1]*y+m[2]*z, Y=m[3]*x+m[4]*y+m[5]*z, Z=m[6]*x+m[7]*y+m[8]*z;
  let ra=Math.atan2(Y,X)*R2D; if(ra<0)ra+=360;
  return [ra, Math.asin(Math.max(-1,Math.min(1,Z)))*R2D];
}

const CI_TABLE = [
  [-0.40,155,176,255],[-0.20,170,191,255],[0.00,202,215,255],
  [ 0.20,248,247,255],[ 0.40,255,244,234],[ 0.60,255,235,206],
  [ 0.80,255,215,174],[ 1.10,255,199,142],[ 1.50,255,172,120],
  [ 2.00,255,144,102]
];
function ciColour(ci){
  const t=CI_TABLE;
  if (ci<=t[0][0]) return t[0].slice(1);
  for (let i=1;i<t.length;i++){
    if (ci<=t[i][0]){
      const a=t[i-1], b=t[i], f=(ci-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
    }
  }
  return t[t.length-1].slice(1);
}
/* faint stars read as white to the eye — desaturate with magnitude */
const COLCACHE = new Map();
function starColour(ci, mag){
  const k = (Math.round(ci*8)) * 1000 + Math.round(mag*2)*2 + (S.redMode?1:0);
  let c = COLCACHE.get(k);
  if (c) return c;
  let [r,g,b] = ciColour(ci);
  const w = Math.min(0.85, Math.max(0, (mag-1.2)/5.4));
  r += (255-r)*w; g += (255-g)*w; b += (255-b)*w;
  if (S.redMode){ const L = 0.30*r + 0.59*g + 0.11*b; r = L; g = L*0.20; b = L*0.11; }
  c = 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
  COLCACHE.set(k,c); return c;

/* ---------- geometry per frame ---------- */
let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H/2;
  R = Math.min(W,H)*0.46;
  draw();
}
window.addEventListener('resize', resize);

/* ---------- projection ---------- */
let lstDeg=0, sinLat=0, cosLat=1;

function recomputeFrame(){
  const jd = julianDay(S.date);
  setPrecession(jd);
  lstDeg = (gmstDeg(jd) + S.lon + 360*10) % 360;
  sinLat = Math.sin(S.lat*D2R); cosLat = Math.cos(S.lat*D2R);
}

/* alt/az of a catalogue position at the current instant */
function altazOf(raDeg, decDeg){
  const p = precess(raDeg, decDeg);
  const Hh = (lstDeg - p[0])*D2R, d = p[1]*D2R;
  const sd=Math.sin(d), cd=Math.cos(d), sH=Math.sin(Hh), cH=Math.cos(Hh);
  const alt = Math.asin(Math.max(-1,Math.min(1, sd*sinLat + cd*cosLat*cH)));
  const az  = Math.atan2(-cd*sH, sd*cosLat - cd*sinLat*cH);
  return [alt, az];
}

/* Direct view: stereographic centred on wherever you are looking. */
function lookScale(){
  const fov = Math.max(6, Math.min(150, S.fov/S.zoom))*D2R;
  return [Math.min(W,H)/2 / (2*Math.tan(fov/4)), fov];
}
function lookProject(alt, az, slack){
  const a0 = S.viewAlt*D2R, A = az - S.viewAz*D2R;
  const sa0=Math.sin(a0), ca0=Math.cos(a0), sa=Math.sin(alt), ca=Math.cos(alt);
  const cosc = sa0*sa + ca0*ca*Math.cos(A);
  if (cosc < (slack?-0.35:-0.02)) return null;
  const k = 2/(1+cosc), sc = lookScale()[0];
  const X = k*ca*Math.sin(A);
  const Y = k*(ca0*sa - sa0*ca*Math.cos(A));
  /* roll: turn the field so screen-up follows the phone, not the zenith */
  const cr = Math.cos(S.roll), sr = Math.sin(S.roll);
  return [cx + (X*cr + Y*sr)*sc, cy - (Y*cr - X*sr)*sc];
}

/* returns [x,y,alt] */
function project(raDeg, decDeg){
  if (S.mode === 'map'){
    const p = precess(raDeg, decDeg);
    let dra = p[0] - S.mapRA;
    while (dra > 180) dra -= 360;
    while (dra < -180) dra += 360;
    const sc = (W/360)*S.zoom*2.4;
    const x = cx - dra*sc, y = cy - (p[1] - S.mapDec)*sc;
    if (x<-60||x>W+60||y<-60||y>H+60) return null;
    return [x,y,1];
  }
  const aa = altazOf(raDeg, decDeg), alt = aa[0], az = aa[1];
  if (S.mode === 'look'){
    if (!S.seeThrough && alt < -0.30) return null;
    const p = lookProject(alt, az, false);
    if (!p || p[0]<-60 || p[0]>W+60 || p[1]<-60 || p[1]>H+60) return null;
    return [p[0], p[1], alt];
  }
  /* Dome. Stereographic covers one hemisphere and diverges at the nadir, so
     seeing through the Earth needs an equidistant projection instead: the
     horizon lands on the same circle, and the whole underside unrolls into
     the ring beyond it. */
  const z = Math.PI/2 - alt;
  let r;
  if (S.seeThrough) r = R*S.zoom*(z/(Math.PI/2));
  else { if (alt < -0.28) return null; r = R*S.zoom*Math.tan(z/2); }
  const x = cx + S.panX - r*Math.sin(az);          /* dome: north up, east left */
  const y = cy + S.panY - r*Math.cos(az);
  if (x<-60||x>W+60||y<-60||y>H+60) return null;
  return [x,y,alt];
}

/* Fill-safe projection: keeps points past the edge so filled shapes close;
   the canvas clip trims the overhang. */
function projectFill(raDeg, decDeg){
  if (S.mode === 'map'){
    const p = precess(raDeg, decDeg);
    let dra = p[0] - S.mapRA;
    while (dra > 180) dra -= 360;
    while (dra < -180) dra += 360;
    const sc = (W/360)*S.zoom*2.4;
    return [cx - dra*sc, cy - (p[1] - S.mapDec)*sc];
  }
  const aa = altazOf(raDeg, decDeg);
  if (S.mode === 'look') return lookProject(aa[0], aa[1], true);
  const z = Math.PI/2 - aa[0];
  let r;
  if (S.seeThrough) r = R*S.zoom*(z/(Math.PI/2));
  else { if (aa[0] < -0.42) return null; r = R*S.zoom*Math.tan(z/2); }
  return [cx + S.panX - r*Math.sin(aa[1]), cy + S.panY - r*Math.cos(aa[1])];
}

/* theme-aware line colours */
function hue(kind){
  if (S.redMode) return {steel:'#C4503A', brass:'#FF6242', ember:'#FF3B18',
                         parch:'#FF8A72', dso:'#A8402F', mw:'255,90,60'}[kind];
  return {steel:'#6F8FB8', brass:'#D9A441', ember:'#C1462F',
          parch:'#E9E3D5', dso:'#7FB0A0', mw:'150,175,225'}[kind];
}

/* ============================================================
   Magnetic declination — World Magnetic Model 2020, degree 12.
   A phone compass reports MAGNETIC north; the sky needs TRUE
   north. The gap exceeds 20 degrees in some places, and it is
   most of why naive sky apps aim at the wrong constellation.
   ============================================================ */
function magneticDeclination(latDeg, lonDeg, year){
  const a = 6371.2, A = 6378.137, F = 1/298.257223563, B = A*(1-F), N = WMM_N;
  const dt = Math.max(-8, Math.min(14, year - WMM_EPOCH));

  const g = [], h = [];
  for (let n=0;n<=N;n++){ g.push(new Float64Array(N+1)); h.push(new Float64Array(N+1)); }
  let k = 0;
  for (let n=1;n<=N;n++) for (let m=0;m<=n;m++){
    g[n][m] = WMM_C[k] + dt*WMM_C[k+2];
    h[n][m] = WMM_C[k+1] + dt*WMM_C[k+3];
    k += 4;
  }

  /* geodetic -> geocentric (sea level) */
  const rlat = latDeg*Math.PI/180, rlon = lonDeg*Math.PI/180;
  const sp = Math.sin(rlat), cp = Math.cos(rlat);
  const A2=A*A, B2=B*B, C2=A2-B2, A4=A2*A2, B4=B2*B2, C4=A4-B4;
  const q  = Math.sqrt(A2 - C2*sp*sp);
  const q2 = Math.pow(A2/B2, 2);
  const ct = sp/Math.sqrt(q2*cp*cp + sp*sp);
  const st = Math.sqrt(1 - ct*ct);
  const r  = Math.sqrt((A4 - C4*sp*sp)/(q*q));

  /* Schmidt semi-normalised Legendre functions and theta-derivatives */
  const P = [], dP = [];
  for (let n=0;n<=N;n++){ P.push(new Float64Array(N+1)); dP.push(new Float64Array(N+1)); }
  P[0][0] = 1; dP[0][0] = 0;
  for (let n=1;n<=N;n++){
    for (let m=0;m<=n;m++){
      if (m === n){
        if (n === 1){ P[1][1] = st; dP[1][1] = ct; }      /* Schmidt P(1,1) = sin(theta) */
        else {
          const f = Math.sqrt((2*n-1)/(2*n));
          P[n][n]  = f*st*P[n-1][n-1];
          dP[n][n] = f*(st*dP[n-1][n-1] + ct*P[n-1][n-1]);
        }
      } else {
        const d = Math.sqrt(n*n - m*m), c1 = (2*n-1)/d;
        const c2 = Math.sqrt((n-1)*(n-1) - m*m)/d;
        const Pm2  = (n-2 >= m) ? P[n-2][m]  : 0;
        const dPm2 = (n-2 >= m) ? dP[n-2][m] : 0;
        P[n][m]  = c1*ct*P[n-1][m] - c2*Pm2;
        dP[n][m] = c1*(ct*dP[n-1][m] - st*P[n-1][m]) - c2*dPm2;
      }
    }
  }

  let X=0, Y=0, Z=0;
  const cm = new Float64Array(N+1), sm = new Float64Array(N+1);
  for (let m=0;m<=N;m++){ cm[m]=Math.cos(m*rlon); sm[m]=Math.sin(m*rlon); }
  for (let n=1;n<=N;n++){
    const ar = Math.pow(a/r, n+2);
    for (let m=0;m<=n;m++){
      const gc = g[n][m]*cm[m] + h[n][m]*sm[m];
      const gs = g[n][m]*sm[m] - h[n][m]*cm[m];
      X += ar * gc * dP[n][m];
      Z -= ar * (n+1) * gc * P[n][m];
      if (st > 1e-10) Y += ar * m * gs * P[n][m] / st;
    }
  }
  /* rotate the spherical components into the geodetic frame */
  const psi = (Math.PI/2 - Math.acos(ct)) - rlat;
  const Xg = X*Math.cos(psi) - Z*Math.sin(psi);
  return {dec: Math.atan2(Y, Xg)*180/Math.PI,
          field: Math.sqrt(Xg*Xg + Y*Y + Z*Z)};
}

/* ============================================================
   Solar system. Sun and Moon after Meeus (Astronomical
   Algorithms); planets from JPL osculating elements with
   centennial rates. Sun ~0.01 deg, Moon ~0.05 deg, planets
   ~1 arcmin across 1800-2050 and progressively rougher outside.
   ============================================================ */

function obliquity(T){                       /* Laskar, good over +/- 10000 yr */
  const U = T/100;
  let e = 23.43929111
    - U*(4680.93 + U*(1.55 - U*(1999.25 - U*(51.38 + U*(249.67 + U*(39.05
      - U*(7.12 + U*(27.87 + U*(5.79 + U*2.45)))))))))/3600;
  return e;
}
const sin=Math.sin, cos=Math.cos, atan2=Math.atan2, asin=Math.asin, sqrt=Math.sqrt;
const rad = d => d*D2R;
const norm360 = d => ((d%360)+360)%360;

function eclToEq(lam, bet, T){
  const e = rad(obliquity(T)), l = rad(lam), b = rad(bet);
  const ra = atan2(sin(l)*cos(e) - Math.tan(b)*sin(e), cos(l));
  const dec = asin(sin(b)*cos(e) + cos(b)*sin(e)*sin(l));
  return [norm360(ra*R2D), dec*R2D];
}

/* ---------- Sun ---------- */
function sunPos(jd){
  const T = (jd-2451545.0)/36525;
  const L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  const M  = rad(357.52911 + 35999.05029*T - 0.0001537*T*T);
  const e  = 0.016708634 - 0.000042037*T - 0.0000001267*T*T;
  const C  = (1.914602 - 0.004817*T - 0.000014*T*T)*sin(M)
           + (0.019993 - 0.000101*T)*sin(2*M) + 0.000289*sin(3*M);
  const tru = L0 + C, v = M + rad(C);
  const Rau = 1.000001018*(1-e*e)/(1+e*cos(v));
  const Om = rad(125.04 - 1934.136*T);
  const lam = tru - 0.00569 - 0.00478*sin(Om);
  const eq = eclToEq(norm360(lam), 0, T);
  return {ra:eq[0], dec:eq[1], lam:norm360(lam), dist:Rau,
          size:1919.26/Rau/3600*2, mag:-26.7, name:'Sun', kind:'sun'};
}

const ML=[[0,0,1,0,6288774,-20905355],[2,0,-1,0,1274027,-3699111],[2,0,0,0,658314,-2955968],

[2,0,0,2,-1595,0],[4,-1,-1,0,1215,-3958],[0,0,2,2,-1110,0],[3,0,-1,0,-892,3258]];
const MB=[[0,0,0,1,5128122],[0,0,1,1,280602],[0,0,1,-1,277693],[2,0,0,-1,173237],
[2,0,-1,1,55413],[2,0,-1,-1,46271],[2,0,0,1,32573],[0,0,2,1,17198],
[2,0,1,-1,9266],[0,0,2,-1,8822],[2,-1,0,-1,8216],[2,0,-2,-1,4324],
[2,0,1,1,4200],[2,1,0,-1,-3359],[2,-1,-1,1,2463],[2,-1,0,1,2211],
[2,-1,-1,-1,2065],[0,1,-1,-1,-1870],[4,0,-1,-1,1828],[0,1,0,1,-1794],
[0,0,0,3,-1749],[0,1,-1,1,-1565],[1,0,0,1,-1491],[0,1,1,1,-1475],
[0,1,1,-1,-1410],[0,1,0,-1,-1344],[1,0,0,-1,-1335],[0,0,3,1,1107],
[4,0,0,-1,1021],[4,0,-1,1,833]];

function moonPos(jd){
  const T=(jd-2451545.0)/36525;
  const Lp = norm360(218.3164477 + 481267.88123421*T - 0.0015786*T*T + T*T*T/538841 - T*T*T*T/65194000);
  const D  = norm360(297.8501921 + 445267.1114034*T - 0.0018819*T*T + T*T*T/545868 - T*T*T*T/113065000);
  const M  = norm360(357.5291092 + 35999.0502909*T - 0.0001536*T*T + T*T*T/24490000);
  const Mp = norm360(134.9633964 + 477198.8675055*T + 0.0087414*T*T + T*T*T/69699 - T*T*T*T/14712000);
  const F  = norm360(93.2720950 + 483202.0175233*T - 0.0036539*T*T - T*T*T/3526000 + T*T*T*T/863310000);
  const E = 1 - 0.002516*T - 0.0000074*T*T;
  let sl=0, sr=0, sb=0;
  for (const t of ML){
    const a = rad(t[0]*D + t[1]*M + t[2]*Mp + t[3]*F);
    let f=1; if (Math.abs(t[1])===1) f=E; else if (Math.abs(t[1])===2) f=E*E;
    sl += t[4]*f*sin(a); sr += t[5]*f*cos(a);
  }
  for (const t of MB){
    const a = rad(t[0]*D + t[1]*M + t[2]*Mp + t[3]*F);
    let f=1; if (Math.abs(t[1])===1) f=E; else if (Math.abs(t[1])===2) f=E*E;
    sb += t[4]*f*sin(a);
  }
  const A1=rad(norm360(119.75+131.849*T)), A2=rad(norm360(53.09+479264.290*T)), A3=rad(norm360(313.45+481266.484*T));
  sl += 3958*sin(A1) + 1962*sin(rad(Lp-F)) + 318*sin(A2);
  sb += -2235*sin(rad(Lp)) + 382*sin(A3) + 175*sin(A1-rad(F)) + 175*sin(A1+rad(F))
      + 127*sin(rad(Lp-Mp)) - 115*sin(rad(Lp+Mp));
  const lam = norm360(Lp + sl/1e6), bet = sb/1e6;
  const distKm = 385000.56 + sr/1000;
  const eq = eclToEq(lam, bet, T);
  const s = sunPos(jd);
  let elong = Math.acos(cos(rad(bet))*cos(rad(lam - s.lam)))*R2D;
  const phase = (1 - cos(rad(elong)))/2;
  const waxing = norm360(lam - s.lam) < 180;
  return {ra:eq[0], dec:eq[1], lam:lam, dist:distKm, illum:phase, waxing:waxing,
          elong:elong, size:2*Math.atan(1737.4/distKm)*R2D, mag:-12.7+0.026*0,
          name:'Moon', kind:'moon'};
}

            0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664,-6.9,'#7FA5D8']
];
const EARTH = [1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0,
               0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0];

function helio(el, T){
  const a = el[0]+el[6]*T, e = el[1]+el[7]*T, I = rad(el[2]+el[8]*T);
  const L = el[3]+el[9]*T, wb = el[4]+el[10]*T, Om = rad(el[5]+el[11]*T);
  const w = rad(wb) - Om;
  let M = rad(norm360(L - wb));
  if (M > Math.PI) M -= 2*Math.PI;
  let E = M + e*sin(M);
  for (let i=0;i<8;i++){ E -= (E - e*sin(E) - M)/(1 - e*cos(E)); }
  const xv = a*(cos(E)-e), yv = a*sqrt(1-e*e)*sin(E);
  const cw=cos(w), sw=sin(w), cO=cos(Om), sO=sin(Om), cI=cos(I), sI=sin(I);
  return [ (cw*cO - sw*sO*cI)*xv + (-sw*cO - cw*sO*cI)*yv,
           (cw*sO + sw*cO*cI)*xv + (-sw*sO + cw*cO*cI)*yv,
           (sw*sI)*xv + (cw*sI)*yv ];
}

function planetPos(i, jd){
  const T = (jd-2451545.0)/36525;
  const p = helio(PL[i].slice(1), T), e = helio(EARTH, T);
  const x=p[0]-e[0], y=p[1]-e[1], z=p[2]-e[2];
  const dist = sqrt(x*x+y*y+z*z);
  const lam = norm360(atan2(y,x)*R2D), bet = asin(z/dist)*R2D;
  const eq = eclToEq(lam, bet, T);
  const rSun = sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]);
  const rE = sqrt(e[0]*e[0]+e[1]*e[1]+e[2]*e[2]);
  let ph = (rSun*rSun + dist*dist - rE*rE)/(2*rSun*dist);
  ph = Math.max(-1, Math.min(1, ph));
  const phAng = Math.acos(ph)*R2D;
  let mag = PL[i][13] + 5*Math.log10(rSun*dist);
  if (i===0) mag += 0.0380*phAng - 0.000273*phAng*phAng + 2e-6*phAng*phAng*phAng;
  if (i===1) mag += 0.0009*phAng + 0.000239*phAng*phAng - 6.5e-7*phAng*phAng*phAng;
  if (i===2) mag += 0.016*phAng;
  return {ra:eq[0], dec:eq[1], lam:lam, dist:dist, mag:mag, phase:phAng,
          rSun:rSun, name:PL[i][0], colour:PL[i][14], kind:'planet'};
}

function solarSystem(jd){
  const out = [sunPos(jd), moonPos(jd)];
  for (let i=0;i<PL.length;i++) out.push(planetPos(i, jd));
  return out;
}

/* ---------- main render ---------- */
let SS = [], ssJD = -1;

function draw(){
  recomputeFrame();
  ctx.clearRect(0,0,W,H);

  if (S.mode === 'horizon'){
    const g = ctx.createRadialGradient(cx+S.panX, cy+S.panY, 0, cx+S.panX, cy+S.panY, R*S.zoom*1.05);
    if (S.redMode){ g.addColorStop(0,'#120202'); g.addColorStop(1,'#080000'); }
    else { g.addColorStop(0,'#070B16'); g.addColorStop(0.72,'#060911'); g.addColorStop(1,'#04060C'); }
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle = S.redMode ? '#080000' : '#04060C'; ctx.fillRect(0,0,W,H);
  }

  ctx.save();
  if (S.mode === 'horizon'){
    ctx.beginPath(); ctx.arc(cx+S.panX, cy+S.panY, R*S.zoom, 0, 6.2832); ctx.clip();
  }
  if (S.showMW) drawMilkyWay();
  ctx.restore();

  if (S.showGrid) drawGrid();

  const lim = S.magLimit;
  for (let i=0;i<STARS.length;i++){
    const s = STARS[i];
    if (s.mag > lim){ s.vis=false; continue; }
    const p = project(s.ra, s.dec);
    if (!p){ s.vis=false; continue; }
    s.x=p[0]; s.y=p[1]; s.alt=p[2]; s.vis=true;
  }

  if (S.showHorizon && S.mode!=='map'){ S.mode==='look' ? drawHorizonLine() : drawHorizon(); }
  if (S.showCulture) drawCultureLines();
  if (S.showMine) drawMine();
  if (S.showDSO) drawDSO();

  drawStars();
  drawEarth();

  const jd = julianDay(S.date);
  if (S.showPlanets){
    if (Math.abs(jd - ssJD) > 0.0007){ SS = solarSystem(jd); ssJD = jd; }
    drawSolarSystem();
  }
  if (S.showShowers) drawShowers(jd);

  if (S.showLabels && S.reveal>0.9) drawStarNames();
  if (S.drawing) drawPending();
  if (!S.drawing && S.picks.length) ringPick();
  drawInset();
  if (S.mode==='look' && (S.gyro || S.calibrating)) reticle();
}

function drawStars(){
  /* two passes so the alpha is set once, not ten thousand times:
     what is under the Earth first and faint, what is up second */
  if (S.seeThrough && S.mode !== 'map'){
    ctx.globalAlpha = 0.34;
    starPass(true);
    ctx.globalAlpha = 1;
    starPass(false);
  } else {
    starPass(null);
  }
}
function starPass(below){
  const zs = Math.max(0.75, Math.min(2.6, Math.sqrt(S.zoom))), rev = S.reveal;
  for (let i=0;i<STARS.length;i++){
    const s = STARS[i];
    if (!s.vis) continue;
    if (below !== null && (s.alt < 0) !== below) continue;
    if (rev < 1 && s.mag > -2 + rev*9.2) continue;
    const r = (0.62 + 2.35*Math.pow(0.615, s.mag)) * zs;
    ctx.fillStyle = starColour(s.ci, s.mag);
    if (r < 1.15){ ctx.fillRect(s.x-r, s.y-r, r*2, r*2); }
    else {
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
      if (s.mag < 1.6){
        ctx.globalAlpha = 0.16;
        ctx.beginPath(); ctx.arc(s.x, s.y, r*3.1, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
}

/* ---------- Milky Way ---------- */
const MW_ALPHA = [0.030, 0.038, 0.046, 0.055, 0.070];
function drawMilkyWay(){
  const a = Math.min(1, S.reveal*1.4);
  for (let L=0; L<MW.length; L++){
    ctx.fillStyle = 'rgba('+hue('mw')+','+(MW_ALPHA[L]*a)+')';
    for (const ring of MW[L]){
      ctx.beginPath();
      let started = false, px = 0;
      for (let i=0;i<ring.length;i+=2){
        const p = projectFill(ring[i], ring[i+1]);
        if (!p){ started = false; continue; }
        if (started && Math.abs(p[0]-px) > W*0.55){ started = false; continue; }
        if (!started){ ctx.moveTo(p[0],p[1]); started = true; }
        else ctx.lineTo(p[0],p[1]);
        px = p[0];
      }
      ctx.closePath(); ctx.fill();
    }
  }
}

/* ---------- grid & horizon ---------- */
function drawGrid(){
  ctx.strokeStyle = S.redMode ? 'rgba(196,80,58,.16)' : 'rgba(111,143,184,.13)';
  ctx.lineWidth = 1;
  const run = (fn)=>{ ctx.beginPath(); fn(); ctx.stroke(); };
  for (let d=-60; d<=60; d+=30) run(()=>{
    let st=false;
    for (let a=0;a<=360;a+=3){ const p=project(a,d);
      if(!p){st=false;continue} if(!st){ctx.moveTo(p[0],p[1]);st=true}else ctx.lineTo(p[0],p[1]); }
  });
  for (let a=0;a<360;a+=30) run(()=>{
    let st=false;
    for (let d=-85;d<=85;d+=3){ const p=project(a,d);
      if(!p){st=false;continue} if(!st){ctx.moveTo(p[0],p[1]);st=true}else ctx.lineTo(p[0],p[1]); }
  });
}

function drawHorizon(){
  const r = R*S.zoom, ox = cx+S.panX, oy = cy+S.panY;
  if (S.seeThrough){
    /* shade the ring that lies beyond the horizon: this is the far side */
    ctx.save();
    ctx.beginPath(); ctx.arc(ox,oy,r*2,0,6.2832);
    ctx.arc(ox,oy,r,0,6.2832,true);
    ctx.fillStyle = S.redMode ? 'rgba(60,8,4,.45)' : 'rgba(10,14,26,.5)';
    ctx.fill('evenodd'); ctx.restore();
    ctx.strokeStyle = S.redMode ? 'rgba(255,138,114,.14)' : 'rgba(233,227,213,.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ox,oy,r*2,0,6.2832); ctx.stroke();
    ctx.font='500 11px "Barlow Semi Condensed",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = S.redMode?'rgba(255,138,114,.4)':'rgba(233,227,213,.32)';
    let downLabel = 'straight down';
    if (S.showEarth){
      earthFrame();
      const ex = earthExit(-90, 0), np = nearPlace(ex[0], ex[1]);
      downLabel = 'straight down \u00B7 ' + (np.km < 200 ? np.city.name
        : np.km < 3000 ? Math.round(np.km).toLocaleString()+' km from '+np.city.name
        : 'the far side of the world');
    }
    ctx.fillText(downLabel, ox, oy - r*2 - 12);
  }
  ctx.strokeStyle = S.redMode ? 'rgba(255,138,114,.34)' : 'rgba(233,227,213,.3)';
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(ox,oy,r,0,6.2832); ctx.stroke();
  ctx.font='500 12px "Barlow Semi Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = S.redMode ? 'rgba(255,138,114,.55)' : 'rgba(233,227,213,.5)';
  [['N',0],['E',90],['S',180],['W',270]].forEach(([t,az])=>{
    const A=az*D2R, rr=r+15;
    ctx.fillText(t, ox - rr*Math.sin(A), oy - rr*Math.cos(A));
  });
}

/* ---------- constellations ---------- */
function drawCultureLines(){
  const c = CULT[S.culture]; if (!c) return;
  const a = Math.min(1, Math.max(0,(S.reveal-0.45)/0.55)); if (a<=0) return;
  ctx.strokeStyle = hue('steel'); ctx.lineWidth = 1.15;
  ctx.globalAlpha = 0.5*a; ctx.lineCap='round'; ctx.beginPath();
  for (const con of c.c) for (const seg of con.l){
    let prev = null;
    for (const h of seg){
      const idx = HIP.get(h), s = (idx===undefined)?null:STARS[idx];
      if (s && s.vis && prev){ ctx.moveTo(prev.x,prev.y); ctx.lineTo(s.x,s.y); }
      prev = (s && s.vis) ? s : null;
    }
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  if (!S.showLabels) return;
  ctx.font='300 13.5px Spectral,Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = S.redMode ? 'rgba(196,80,58,'+(0.9*a)+')' : 'rgba(111,143,184,'+(0.78*a)+')';
  for (const con of c.c){
    let sx=0, sy=0, n=0;
    for (const seg of con.l) for (const h of seg){
      const i=HIP.get(h); if(i===undefined) continue;
      const s=STARS[i]; if(!s.vis) continue;
      sx+=s.x; sy+=s.y; n++;
    }
    if (n>2) ctx.fillText(con.n, sx/n, sy/n);
  }
}

function drawMine(){
  for (const f of S.mine){
    ctx.strokeStyle=hue('brass'); ctx.lineWidth=1.7; ctx.globalAlpha=0.85; ctx.lineCap='round';
    ctx.beginPath();
    for (const [a,b] of f.segs){
      const A=STARS[a], B=STARS[b];
      if (A&&B&&A.vis&&B.vis){ ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
    }
    ctx.stroke(); ctx.globalAlpha=1;
    if (S.showLabels){
      let sx=0,sy=0,n=0;
      for (const [a,b] of f.segs) for (const i of [a,b]){
        const s=STARS[i]; if(s&&s.vis){sx+=s.x;sy+=s.y;n++} }
      if (n>1){
        ctx.font='400 14px Spectral,Georgia,serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=hue('brass');
        ctx.fillText(f.name + (f.from?' \u00B7 '+f.from:''), sx/n, sy/n);
      }
    }
  }
}

function drawPending(){
  ctx.strokeStyle=hue('ember'); ctx.lineWidth=1.9; ctx.lineCap='round'; ctx.beginPath();
  for (const [a,b] of S.pending){
    const A=STARS[a], B=STARS[b];
    if (A&&B&&A.vis&&B.vis){ ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
  }
  ctx.stroke();
  if (S.anchor>=0){
    const s=STARS[S.anchor];
    if (s&&s.vis){ ctx.strokeStyle=hue('ember'); ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(s.x,s.y,9,0,6.2832); ctx.stroke(); }
  }
}

function pickPos(p){
  if (p.kind==='star'){ const s=STARS[p.i]; return (s&&s.vis)?[s.x,s.y]:null; }
  if (p.kind==='body'){ const b=SS.find(o=>o.name===p.i); return (b&&b.px!=null)?[b.px,b.py]:null; }
  if (p.kind==='dso'){ const d=DSO[p.i]; return (d&&d.px!=null)?[d.px,d.py]:null; }
  return null;
}
function ringPick(){
  const pos = pickPos(S.picks[S.pickIdx]); if (!pos) return;
  ctx.strokeStyle=hue('brass'); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(pos[0],pos[1],11,0,6.2832); ctx.stroke();
}

function drawStarNames(){
  ctx.font='300 13px Spectral,Georgia,serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle = S.redMode ? 'rgba(255,138,114,.75)' : 'rgba(233,227,213,.72)';
  const cut = Math.min(3.0, S.magLimit);
  for (const s of STARS){
    if (!s.vis || !s.name || s.mag>cut) continue;
    ctx.fillText(s.name, s.x+7, s.y-6);
  }
}

/* horizon in direct-view mode: the ground, the skyline, the compass */
function drawHorizonLine(){
  const pts = [];
  for (let a=0;a<=360;a+=2){
    const p = lookProject(0, a*D2R, true);
    if (p && p[0]>-W && p[0]<W*2 && Math.abs(p[1])<H*4) pts.push(p); else pts.push(null);
  }
  ctx.strokeStyle = S.redMode?'rgba(255,138,114,.32)':'rgba(233,227,213,.26)';
  ctx.lineWidth = 1.2; ctx.beginPath();
  let st=false;
  for (const p of pts){
    if(!p){st=false;continue}
    if(!st){ctx.moveTo(p[0],p[1]);st=true} else ctx.lineTo(p[0],p[1]);
  }
  ctx.stroke();

  /* ground haze below the skyline */
  const below = lookProject(-40*D2R, S.viewAz*D2R, true);
  if (below && S.viewAlt < 60){
    ctx.save(); ctx.globalAlpha = S.seeThrough ? 0.34 : 0.72;
    ctx.fillStyle = S.redMode?'#0A0000':'#03050A';
    ctx.beginPath(); st=false;
    for (const p of pts){ if(!p){continue}
      if(!st){ctx.moveTo(p[0],p[1]);st=true} else ctx.lineTo(p[0],p[1]); }
    if (st){
      const last = pts.filter(Boolean).pop(), first = pts.filter(Boolean)[0];
      ctx.lineTo(last[0], H+80); ctx.lineTo(first[0], H+80); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  ctx.font='500 13px "Barlow Semi Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = S.redMode?'rgba(255,138,114,.66)':'rgba(233,227,213,.55)';
  [['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]].forEach(([t,az])=>{
    const p = lookProject(0, az*D2R, false);
    if (p && p[0]>10 && p[0]<W-10) ctx.fillText(t, p[0], p[1]+16);
  });
}

/* centre reticle: shows exactly where the phone is aimed */
function reticle(){
  const big = S.calibrating, r = big ? 26 : 15;
  ctx.strokeStyle = big ? hue('brass') : (S.redMode?'rgba(255,138,114,.42)':'rgba(233,227,213,.34)');
  ctx.lineWidth = big ? 1.6 : 1.1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-r-9, cy); ctx.lineTo(cx-r+4, cy);
  ctx.moveTo(cx+r-4, cy); ctx.lineTo(cx+r+9, cy);
  ctx.moveTo(cx, cy-r-9); ctx.lineTo(cx, cy-r+4);
  ctx.moveTo(cx, cy+r-4); ctx.lineTo(cx, cy+r+9);
  ctx.stroke();
}

/* ---------- deep sky ---------- */
function drawDSO(){
  const a = Math.min(1, Math.max(0,(S.reveal-0.6)/0.4)); if (a<=0) return;
  const col = hue('dso');
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.72*a;
  ctx.font='300 12px Spectral,Georgia,serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  for (const d of DSO){
    if (d[2] > S.magLimit + 3.2) continue;
    const p = project(d[0], d[1]); if (!p) continue;
    d.px = p[0]; d.py = p[1]; d.alt = p[2];
    ctx.globalAlpha = (S.seeThrough && S.mode!=='map' && p[2] < 0) ? 0.28*a : 0.72*a;
    const x=p[0], y=p[1], r = 4.2;
    ctx.beginPath();
    switch (d[3]){
      case 'galaxy': case 'galaxy group':
        ctx.ellipse(x, y, r*1.5, r*0.75, 0.5, 0, 6.2832); ctx.stroke(); break;
      case 'globular cluster':
        ctx.arc(x,y,r,0,6.2832); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y);
        ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke(); break;
      case 'open cluster':
        ctx.setLineDash([2,2.4]); ctx.arc(x,y,r,0,6.2832); ctx.stroke(); ctx.setLineDash([]); break;
      case 'planetary nebula':
        ctx.arc(x,y,r*0.68,0,6.2832); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-r*1.4,y); ctx.lineTo(x-r*0.8,y);
        ctx.moveTo(x+r*0.8,y); ctx.lineTo(x+r*1.4,y); ctx.stroke(); break;
      case 'supernova remnant':
        ctx.setLineDash([1.5,2]); ctx.arc(x,y,r*1.15,0,6.2832); ctx.stroke(); ctx.setLineDash([]); break;
      default:
        ctx.strokeRect(x-r, y-r, r*2, r*2);
    }
    if (S.showLabels && (d[2] < 7.5 || S.zoom > 2.2))
      ctx.fillText(d[4], x + r + 4, y - r - 1);
  }
  ctx.globalAlpha = 1;
}

/* ---------- Sun, Moon, planets ---------- */
function drawSolarSystem(){
  const a = Math.min(1, Math.max(0,(S.reveal-0.3)/0.7)); if (a<=0) return;
  ctx.globalAlpha = a;
  for (const b of SS){
    const p = project(b.ra, b.dec); if (!p) continue;
    b.px = p[0]; b.py = p[1]; b.alt = p[2];
    const x = p[0], y = p[1];
    ctx.globalAlpha = (S.seeThrough && S.mode!=='map' && p[2] < 0) ? a*0.4 : a;

    if (b.kind === 'sun'){
      const rr = Math.max(9, R*S.zoom*b.size/90);
      const g = ctx.createRadialGradient(x,y,0,x,y,rr*4);
      g.addColorStop(0, S.redMode?'rgba(255,150,120,.95)':'rgba(255,246,214,.95)');
      g.addColorStop(0.28, S.redMode?'rgba(255,90,60,.5)':'rgba(255,226,150,.5)');
      g.addColorStop(1,'rgba(255,200,90,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr*4,0,6.2832); ctx.fill();
      ctx.fillStyle = S.redMode?'#FFB49E':'#FFF6D6';
      ctx.beginPath(); ctx.arc(x,y,rr,0,6.2832); ctx.fill();
      label(x, y, rr, 'Sun'); continue;
    }

    if (b.kind === 'moon'){
      const rr = Math.max(8, R*S.zoom*b.size/90);
      ctx.fillStyle = S.redMode?'rgba(120,30,20,.85)':'rgba(52,58,74,.85)';
      ctx.beginPath(); ctx.arc(x,y,rr,0,6.2832); ctx.fill();
      ctx.save(); ctx.translate(x,y); if (!b.waxing) ctx.scale(-1,1);
      ctx.fillStyle = S.redMode?'#FFB09A':'#EFEAE0';
      ctx.beginPath();
      ctx.arc(0,0,rr,-Math.PI/2,Math.PI/2,false);
      ctx.ellipse(0,0, rr*Math.abs(1-2*b.illum), rr, 0, Math.PI/2, -Math.PI/2, b.illum<0.5);
      ctx.closePath(); ctx.fill(); ctx.restore();
      label(x, y, rr, 'Moon'); continue;
    }

    const bright = Math.max(2.2, 5.2 - b.mag*0.9) * Math.max(0.8, Math.min(2.2, Math.sqrt(S.zoom)));
    ctx.fillStyle = S.redMode ? '#FF7A5C' : b.colour;
    ctx.globalAlpha = 0.2*a;
    ctx.beginPath(); ctx.arc(x,y,bright*2.6,0,6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(x,y,bright,0,6.2832); ctx.fill();
    label(x, y, bright, b.name);
  }
  ctx.globalAlpha = 1;

  function label(x,y,r,txt){
    if (!S.showLabels) return;
    ctx.font='400 13px Spectral,Georgia,serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = S.redMode?'rgba(255,138,114,.9)':'rgba(233,227,213,.86)';
    ctx.fillText(txt, x + r + 5, y - r - 2);
  }
}

/* ---------- meteor showers ---------- */
function dayOfYear(d){
  return Math.floor((Date.UTC(2001, d.getMonth(), d.getDate()) - Date.UTC(2001,0,1))/86400000);
}
function showerActivity(sh, date){
  const peak = Math.floor((Date.UTC(2001, sh[3]-1, sh[4]) - Date.UTC(2001,0,1))/86400000);
  let diff = dayOfYear(date) - peak;
  if (diff > 182) diff -= 365; if (diff < -182) diff += 365;
  const w = 14;
  if (Math.abs(diff) > w) return 0;
  return Math.exp(-(diff*diff)/(2*(w/2.6)*(w/2.6)));
}

let METEORS = [];
function drawShowers(jd){
  const now = S.date;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  for (const sh of SHOWERS){
    const act = showerActivity(sh, now);
    if (act < 0.06) continue;
    const p = project(sh[1], sh[2]); if (!p) continue;
    sh.px = p[0]; sh.py = p[1]; sh.act = act;
    const x=p[0], y=p[1];
    ctx.strokeStyle = hue('ember'); ctx.globalAlpha = 0.35 + 0.5*act; ctx.lineWidth = 1.2;
    for (let k=0;k<8;k++){
      const A = k*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(A)*5, y+Math.sin(A)*5);
      ctx.lineTo(x+Math.cos(A)*10, y+Math.sin(A)*10);
      ctx.stroke();
    }
    if (S.showLabels){
      ctx.font='400 12.5px Spectral,Georgia,serif';
      ctx.fillStyle = hue('ember');
      ctx.fillText(sh[0], x+14, y);
    }
    ctx.globalAlpha = 1;
    if (act > 0.55 && Math.random() < act*sh[5]/2600) spawnMeteor(x, y);
  }
  paintMeteors();
}
function spawnMeteor(rx, ry){
  const A = Math.random()*6.2832, d = 60 + Math.random()*Math.max(W,H)*0.55;
  METEORS.push({x:rx+Math.cos(A)*40, y:ry+Math.sin(A)*40,
                vx:Math.cos(A)*d/38, vy:Math.sin(A)*d/38, life:1});
  if (METEORS.length > 26) METEORS.shift();
}
function paintMeteors(){
  if (!METEORS.length) return;
  ctx.lineCap='round';
  for (let i=METEORS.length-1;i>=0;i--){
    const m = METEORS[i];
    m.x += m.vx; m.y += m.vy; m.life -= 0.028;
    if (m.life <= 0){ METEORS.splice(i,1); continue; }
    const g = ctx.createLinearGradient(m.x, m.y, m.x-m.vx*8, m.y-m.vy*8);
    const c = S.redMode ? '255,120,90' : '255,240,220';
    g.addColorStop(0,'rgba('+c+','+m.life+')');
    g.addColorStop(1,'rgba('+c+',0)');
    ctx.strokeStyle=g; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*8, m.y-m.vy*8); ctx.stroke();
  }
}

/* ---------- storage: Claude artifact storage, else localStorage ---------- */
const HAS_CLOUD = typeof window.storage !== 'undefined' && !!window.storage;
const DB = {
  shared: HAS_CLOUD || !!(CONFIG.supabaseUrl && CONFIG.supabaseKey),
  async get(k, sh){
    if (HAS_CLOUD) return window.storage.get(k, sh);
    const v = localStorage.getItem(k);
    return v === null ? null : {key:k, value:v};
  },
  async set(k, v, sh){
    if (HAS_CLOUD) return window.storage.set(k, v, sh);
    localStorage.setItem(k, v); return {key:k, value:v};
  },
  async list(p, sh){
    if (HAS_CLOUD) return window.storage.list(p, sh);
    const keys = [];
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i); if (k.startsWith(p)) keys.push(k);
    }
    return {keys};
  }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

let toastT=null;

/* ---------- status strip ---------- */
const fmtLat = v => Math.abs(v).toFixed(2)+'\u00B0'+(v<0?'S':'N');
const fmtLon = v => Math.abs(v).toFixed(2)+'\u00B0'+(v<0?'W':'E');
const yearLabel = d => { const y=d.getFullYear(); return y<=0 ? (1-y)+' BC' : (y<1000?'AD '+y:''+y); };
const MODE_NAME = {horizon:'Whole sky', look:'Looking', map:'Star map'};

function updateStrip(){
  document.getElementById('place').textContent = S.placeName;
  const d = S.date;
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  let line = fmtLat(S.lat)+'  '+fmtLon(S.lon)+'  \u00B7  '+mon+' '+d.getDate()+' '+yearLabel(d)+'  '+hh+':'+mm;
  if (S.mode === 'look'){
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    const d8 = dirs[Math.round(((S.viewAz%360)+360)%360/22.5)%16];
    line += '  \u00B7  ' + d8 + ' ' + (S.viewAlt >= 0
      ? Math.round(S.viewAlt)+'\u00B0 up'
      : Math.round(-S.viewAlt)+'\u00B0 down');
  }
  document.getElementById('clock').textContent = line;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.m===S.mode));
  document.getElementById('fab').classList.toggle('on', S.gyro);
  const lb = document.getElementById('lockbtn');
  lb.classList.toggle('show', S.gyro); lb.classList.toggle('on', S.freeze);
}

/* ---------- loop ---------- */
let dirty = true, lastT = performance.now(), revealStart = 0;
const needsDraw = () => { dirty = true; };
function loop(t){
  const dt = (t - lastT)/1000; lastT = t;
  if (S.reveal < 1){ S.reveal = Math.min(1,(t-revealStart)/1500); dirty = true; }
  if (S.live){ S.date = new Date(); dirty = true; }
  else if (S.rate !== 0){ S.date = new Date(S.date.getTime() + S.rate*dt*1000); dirty = true; }
  if (METEORS.length) dirty = true;
  if (dirty){ draw(); updateStrip(); dirty = false; }
  requestAnimationFrame(loop);
}

/* ---------- pointer ---------- */
let ptrs = new Map(), dragged=false, startPinch=0, startZoom=1, downT=0, downPt=null;

cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1){ dragged=false; downT=performance.now(); downPt={x:e.clientX,y:e.clientY}; }
  if (ptrs.size===2){
    const a=[...ptrs.values()];
    startPinch = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); startZoom = S.zoom; dragged=true;
  }
});
cv.addEventListener('pointermove', e=>{
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size===2){
    const a=[...ptrs.values()], d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    if (startPinch>0) S.zoom = Math.max(0.5, Math.min(20, startZoom*d/startPinch));
    needsDraw(); return;
  }
  if (Math.abs(dx)+Math.abs(dy) > 2) dragged = true;
  if (S.mode==='horizon'){ S.panX += dx; S.panY += dy; }
  else if (S.mode==='look'){
    if (S.gyro) { setGyro(false); toast('Tracking off \u2014 you took the wheel'); }
    const degPerPx = (S.fov/S.zoom)/Math.min(W,H) * 1.15;
    S.viewAz = (((S.viewAz - dx*degPerPx) % 360) + 360) % 360;
    S.viewAlt = Math.max(-30, Math.min(89, S.viewAlt + dy*degPerPx));
  } else {
    const sc = (W/360)*S.zoom*2.4;
    S.mapRA = ((S.mapRA + dx/sc)%360+360)%360;
    S.mapDec = Math.max(-88, Math.min(88, S.mapDec + dy/sc));
  }
  needsDraw();
});
function endPtr(e){
  const single = ptrs.size===1;
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) startPinch = 0;
  if (single && !dragged && downPt && performance.now()-downT < 600) tap(downPt.x, downPt.y);
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  S.zoom = Math.max(0.5, Math.min(20, S.zoom*(e.deltaY<0?1.13:0.885)));
  needsDraw();
}, {passive:false});

/* ---------- picking: everything under the fingertip ---------- */
function gather(x, y, radius){
  const out = [];
  for (let i=0;i<STARS.length;i++){
    const s = STARS[i]; if (!s.vis) continue;
    const d = Math.hypot(s.x-x, s.y-y);
    if (d <= radius) out.push({kind:'star', i:i, d:d - (7-Math.min(7,s.mag))*1.4});
  }
  if (S.showPlanets) for (const b of SS){
    if (b.px==null) continue;
    const d = Math.hypot(b.px-x, b.py-y);
    if (d <= radius+6) out.push({kind:'body', i:b.name, d:d-14});
  }
  if (S.showDSO) for (let i=0;i<DSO.length;i++){
    const dd = DSO[i]; if (dd.px==null) continue;
    const d = Math.hypot(dd.px-x, dd.py-y);
    if (d <= radius) out.push({kind:'dso', i:i, d:d-3});
  }
  out.sort((a,b)=>a.d-b.d);
  return out.slice(0, 12);
}

function tap(px, py){
  const rect = cv.getBoundingClientRect();
  const x = px-rect.left, y = py-rect.top;
  if (S.drawing){
    const st = gather(x, y, 26).filter(p=>p.kind==='star');
    if (!st.length) return;
    const i = st[0].i;
    if (S.anchor < 0) S.anchor = i;
    else if (S.anchor !== i){ S.pending.push([S.anchor, i]); S.anchor = i; }
    buzz(9); updateHint(); needsDraw(); return;
  }
  const hits = gather(x, y, 24);
  if (!hits.length){ S.picks = []; hideReadout(); needsDraw(); return; }
  S.picks = hits; S.pickIdx = 0;
  showReadout(); needsDraw();
}

/* ---------- device orientation ---------- */
let onRel = null, onAbs = null, gyroSeen = 0, relSeen = false;
function setGyro(on){
  S.gyro = on;
  if (!on){
    if (onRel) window.removeEventListener('deviceorientation', onRel, true);
    if (onAbs) window.removeEventListener('deviceorientationabsolute', onAbs, true);
    onRel = onAbs = null; S.roll = 0; S.calibrating = false; S.freeze = false;
    updateHint(); updateStrip(); needsDraw(); return;
  }
  S.mode = 'look'; S.live = true; S.rate = 0;
  resetFilters(); gyroSeen = 0; relSeen = false; S.freeze = false;

  /* The compass and the gyroscope arrive on different streams. Motion always
     comes from the smoothest one available; the compass only ever corrects
     the heading, slowly. */
  onRel = ev => {
    gyroSeen++;
    if (typeof ev.webkitCompassHeading === 'number' || ev.absolute === true) handleCompass(ev);
    if (ev.absolute === true){ if (!relSeen) handleOrientation(ev); return; }
    relSeen = true; handleOrientation(ev);
  };
  onAbs = ev => { gyroSeen++; handleCompass(ev); if (!relSeen) handleOrientation(ev); };

  if ('ondeviceorientationabsolute' in window)
    window.addEventListener('deviceorientationabsolute', onAbs, true);
  window.addEventListener('deviceorientation', onRel, true);
  setTimeout(()=>{ if (S.gyro && gyroSeen === 0)
    toast('No orientation readings \u2014 drag to look around instead'); }, 2200);
  updateStrip(); needsDraw();
}
function toggleFreeze(){
  S.freeze = !S.freeze; buzz(10); updateStrip(); needsDraw();
  toast(S.freeze ? 'View frozen \u2014 the sky still turns, your aim does not'
                 : 'Following the phone again');
}

/* ---------- compass calibration against a real object ---------- */
function calibrationCandidates(){
  const out = [];
  if (S.showPlanets) for (const b of SS){
    if (b.kind === 'sun') continue;
    const aa = altazOf(b.ra, b.dec);
    if (aa[0] < 8*D2R) continue;
    out.push({name:b.name, mag:(b.kind==='moon'?-12:b.mag), alt:aa[0]*R2D, az:aa[1]*R2D});
  }
  for (const st of STARS){
    if (!st.name || st.mag > 1.6) continue;
    const aa = altazOf(st.ra, st.dec);
    if (aa[0] < 12*D2R) continue;
    out.push({name:st.name, mag:st.mag, alt:aa[0]*R2D, az:aa[1]*R2D});
  }
  out.sort((a,b)=>a.mag-b.mag);
  return out.slice(0, 8);
}
function applyCalibration(c){
  let d = c.az - S.viewAz;
  while (d > 180) d -= 360; while (d < -180) d += 360;
  S.calAz  = (((S.calAz + d) % 360) + 360) % 360;
  S.calAlt = Math.max(-25, Math.min(25, S.calAlt + (c.alt - S.viewAlt)));
  S.calibrating = false;
  savePrefs(); buzz(16); updateHint(); needsDraw();
  toast('Aligned on ' + c.name + ' \u2014 off by ' + Math.abs(d).toFixed(0) + '\u00B0');
}
function clearCalibration(){
  S.calAz = 0; S.calAlt = 0; savePrefs(); needsDraw();
  toast('Manual alignment cleared');
}

async function toggleGyro(){
  if (S.gyro){ setGyro(false); toast('Tracking off'); return; }
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function'){
      const res = await DOE.requestPermission();
      if (res !== 'granted'){ toast('Motion access denied \u2014 drag to look around instead'); return; }
    } else if (!DOE){
      toast('This device has no orientation sensor \u2014 drag to look around');
      S.mode='look'; savePrefs(); needsDraw(); return;
    }
  } catch(e){ toast('Motion access unavailable \u2014 drag to look around'); return; }
  setGyro(true); buzz(12);
  toast('Hold the phone up and aim it at the sky');
}

/* ---------- readout ---------- */
const roEl = document.getElementById('readout');
function fmtRA(ra){ const h=ra/15, hh=Math.floor(h), m=(h-hh)*60;
  return hh+'h '+String(Math.floor(m)).padStart(2,'0')+'m'; }
function fmtDec(dec){ const s=dec<0?'\u2212':'+', a=Math.abs(dec), d=Math.floor(a);
  return s+d+'\u00B0 '+String(Math.round((a-d)*60)).padStart(2,'0')+"'"; }
const GREEK = {Alp:'Alpha',Bet:'Beta',Gam:'Gamma',Del:'Delta',Eps:'Epsilon',Zet:'Zeta',Eta:'Eta',
  The:'Theta',Iot:'Iota',Kap:'Kappa',Lam:'Lambda',Mu:'Mu',Nu:'Nu',Xi:'Xi',Omi:'Omicron',Pi:'Pi',
  Rho:'Rho',Sig:'Sigma',Tau:'Tau',Ups:'Upsilon',Phi:'Phi',Chi:'Chi',Psi:'Psi',Ome:'Omega'};
const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const bearing = az => COMPASS[Math.round((((az%360)+360)%360)/22.5)%16];
/* where to turn, and whether it is over your head or under your feet */
function placeLine(ra, dec){
  const aa = altazOf(ra, dec);
  const alt = aa[0]*R2D, az = (((aa[1]*R2D)%360)+360)%360;
  const dir = bearing(az)+' '+Math.round(az)+'\u00B0';
  return alt >= 0
    ? dir+'  \u00B7  '+alt.toFixed(1)+'\u00B0 up'
    : dir+'  \u00B7  '+Math.abs(alt).toFixed(1)+'\u00B0 down, through the Earth'
          + throughLine(alt, az);
}
/* what the line of sight passes out through on the far side */
function throughLine(alt, az){
  if (typeof earthExit !== 'function' || !S.showEarth) return '';
  earthFrame();
  const ex = earthExit(alt, az);
  const n = nearPlace(ex[0], ex[1]);
  const where = n.km < 220 ? n.city.name
    : Math.round(n.km).toLocaleString() + ' km from ' + n.city.name;
  return '<br>out through the ground near ' + where;
}
const MOON_PHASE = k => k<0.02?'new':k<0.24?'crescent':k<0.28?'quarter':k<0.72?'gibbous':k<0.98?'gibbous':'full';

function showReadout(){
  const p = S.picks[S.pickIdx]; if (!p) return hideReadout();
  let title='', lines=[];
  if (p.kind === 'star'){
    const s = STARS[p.i];
    title = s.name || (s.bayer ? (GREEK[s.bayer]||s.bayer) : (s.hip?'HIP '+s.hip:'Unnamed star'));
    lines.push('magnitude '+s.mag.toFixed(2));
    lines.push(placeLine(s.ra, s.dec));
    lines.push('RA '+fmtRA(s.ra)+'  Dec '+fmtDec(s.dec)+' (J2000)'+(s.hip?'  \u00B7  HIP '+s.hip:''));
  } else if (p.kind === 'body'){
    const b = SS.find(o=>o.name===p.i); if (!b) return hideReadout();
    title = b.name;
    if (b.kind==='moon'){
      lines.push((b.illum*100).toFixed(0)+'% lit, '+(b.waxing?'waxing':'waning')+' '+MOON_PHASE(b.illum));
      lines.push(Math.round(b.dist).toLocaleString()+' km away');
    } else if (b.kind==='sun'){
      lines.push('the daytime sky \u2014 never look at it directly');
      lines.push(b.dist.toFixed(4)+' AU away');
    } else {
      lines.push('magnitude '+b.mag.toFixed(1)+'  \u00B7  phase '+b.phase.toFixed(0)+'\u00B0');
      lines.push(b.dist.toFixed(3)+' AU from Earth, '+b.rSun.toFixed(3)+' AU from the Sun');
    }
    lines.push(placeLine(b.ra, b.dec));
  } else {
    const d = DSO[p.i];
    title = d[5] || d[4];
    lines.push(d[3] + (d[2]<50?'  \u00B7  magnitude '+d[2]:''));
    lines.push(placeLine(d[0], d[1]));
    lines.push([d[4], d[6], d[7]?d[7]+"'":''].filter(Boolean).join('  \u00B7  '));
  }
  document.getElementById('roName').textContent = title;
  document.getElementById('roSub').innerHTML = lines.join('<br>');
  const many = S.picks.length > 1;
  document.getElementById('roPrev').style.display = many?'':'none';
  document.getElementById('roNext').style.display = many?'':'none';
  document.getElementById('roCount').textContent = many ? (S.pickIdx+1)+'/'+S.picks.length : '';
  roEl.classList.add('on');
}
function hideReadout(){ roEl.classList.remove('on'); S.picks=[]; needsDraw(); }
document.getElementById('roX').onclick = hideReadout;
document.getElementById('roPrev').onclick = ()=>{
  S.pickIdx = (S.pickIdx - 1 + S.picks.length) % S.picks.length; showReadout(); needsDraw(); };
document.getElementById('roNext').onclick = ()=>{
  S.pickIdx = (S.pickIdx + 1) % S.picks.length; showReadout(); needsDraw(); };

/* ---------- drawing ---------- */
const hintEl = document.getElementById('hint'), hintTxt = document.getElementById('hintTxt');
function updateHint(){
  if (S.calibrating){
    hintEl.classList.add('on');
    const cand = calibrationCandidates();
    hintTxt.innerHTML = cand.length
      ? 'Put the crosshair on one of these, then tap its name.<div class="chips" style="margin:9px 0 0">'
        + cand.map((c,i)=>`<button class="chip" data-cal="${i}">${c.name}</button>`).join('') + '</div>'
      : 'Nothing bright enough is up right now. Try again after dark.';
    hintEl.querySelectorAll('[data-cal]').forEach(b=>{
      b.onclick = ()=> applyCalibration(calibrationCandidates()[+b.dataset.cal]);
    });
    document.getElementById('hintBtn').textContent = 'Cancel';
    return;
  }
  if (!S.drawing){ hintEl.classList.remove('on'); return; }
  hintEl.classList.add('on');
  const n = S.pending.length;
  hintTxt.innerHTML = n===0
    ? (S.anchor<0 ? 'Tap a star to begin. Every tap after that draws a line.'
                  : 'First star set. Tap the next one.')
    : '<b>'+n+'</b> line'+(n===1?'':'s')+'. Keep tapping, or finish and name it.';
  document.getElementById('hintBtn').textContent = n>0 ? 'Name it' : 'Cancel';
}
function startDrawing(){
  S.drawing=true; S.anchor=-1; S.pending=[]; hideReadout(); closePanel(); setTab(null);
  document.querySelector('.tab.draw').classList.add('on'); updateHint(); needsDraw();
}
function stopDrawing(){
  S.drawing=false; S.anchor=-1; S.pending=[];
  document.querySelector('.tab.draw').classList.remove('on'); updateHint(); needsDraw();
}
document.getElementById('hintBtn').onclick = async ()=>{
  if (S.calibrating){ S.calibrating = false; updateHint(); needsDraw(); return; }
  if (!S.pending.length){ stopDrawing(); return; }
  const name = prompt('Name your constellation', '');
  if (name === null) return;
  S.mine.push({name:(name.trim()||'Untitled'), segs:S.pending.slice(), made:Date.now()});
  const ok = await saveMine();
  if (ok) toast('Saved \u2014 it will keep its place in the sky');
  stopDrawing();
};

/* ---------- panel plumbing ---------- */

const scrim = document.getElementById('scrim');
const closePanel = () => { panel.classList.remove('open'); scrim.classList.remove('on'); };

  document.querySelectorAll('.tab').forEach(t=>{

  });

}

/* ============================================================
   Orientation tracking.

   A phone has three sensors and only one of them is any good
   for this. The gyroscope is fast and smooth but drifts. The
   accelerometer feels gravity, so up and down is dependable.
   The magnetometer knows which way is north but is noisy and
   slow, and metal ruins it.

   So: the gyroscope drives the view frame by frame, and the
   compass is fed in underneath as a slow correction to the
   heading. Fast motion comes from the gyro, long-term truth
   from the compass, and the compass's noise is averaged away
   instead of being shown to you sixty times a second.
   ============================================================ */

/* --- W3C device rotation: R = Rz(alpha) . Rx(beta) . Ry(gamma) ---
   World frame is east / north / up. Device frame is right / top /
   out-of-screen. R maps device vectors into the world. */
function deviceRotation(alpha, beta, gamma){
  const ca=Math.cos(alpha), sa=Math.sin(alpha);
  const cb=Math.cos(beta),  sb=Math.sin(beta);
  const cg=Math.cos(gamma), sg=Math.sin(gamma);
  return [
    ca*cg - sa*sb*sg,  -sa*cb,  ca*sg + sa*sb*cg,
    sa*cg + ca*sb*sg,   ca*cb,  sa*sg - ca*sb*cg,
       -cb*sg,             sb,          cb*cg
  ];
}
function mRot(m, v){
  return [ m[0]*v[0] + m[1]*v[1] + m[2]*v[2],
           m[3]*v[0] + m[4]*v[1] + m[5]*v[2],
           m[6]*v[0] + m[7]*v[1] + m[8]*v[2] ];
}
const dot3 = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function norm3(v){ const m=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/m,v[1]/m,v[2]/m]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
const wrap180 = d => { d = ((d + 180) % 360 + 360) % 360 - 180; return d; };

/* --- One Euro filter: heavy smoothing when still, opens up when you swing --- */
function OneEuro(minCut, beta, dCut){
  let xPrev=null, dxPrev=0;
  const alpha = (cut, dt) => { const tau = 1/(2*Math.PI*cut); return 1/(1 + tau/dt); };
  return function(x, dt){
    if (xPrev === null){ xPrev = x; return x; }
    if (!(dt > 0)) return xPrev;
    const dx = (x - xPrev)/dt;
    dxPrev = dxPrev + alpha(dCut, dt)*(dx - dxPrev);
    xPrev = xPrev + alpha(minCut + beta*Math.abs(dxPrev), dt)*(x - xPrev);
    return xPrev;
  };
}

/* minCut  — how hard it smooths while you hold still
   beta    — how quickly it lets go when you actually move
   dead    — degrees of tremor to swallow before anything shifts
   gain    — how much of the compass leaks in per reading */
const STEADY = {
  locked:   {minCut:0.22, beta:3.2, dead:0.34, gain:0.0016},
  balanced: {minCut:0.55, beta:2.6, dead:0.16, gain:0.0040},
  quick:    {minCut:1.20, beta:2.0, dead:0.04, gain:0.0110}
};
const tune = () => STEADY[S.steady] || STEADY.locked;

let fx,fy,fz,fr,fi,lastEv;
function resetFilters(){
  const t = tune();
  fx=OneEuro(t.minCut,t.beta,1.2); fy=OneEuro(t.minCut,t.beta,1.2); fz=OneEuro(t.minCut,t.beta,1.2);
  fr=OneEuro(0.7,1.6,1.0); fi=OneEuro(0.7,1.6,1.0);
  lastEv=0; S.headOff=null; S.headSeen=false; S.headLocked=false; S.settleT=0; compassRaw=null;
}

function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}

/* declination is recomputed only when you move a meaningful distance */
function currentDeclination(){
  if (!S.useDecl) return 0;
  const key = Math.round(S.lat*4)+'/'+Math.round(S.lon*4);
  if (S.declAt !== key){
    const y = S.date.getFullYear() + S.date.getMonth()/12;
    try { S.decl = magneticDeclination(S.lat, S.lon, y).dec; } catch(e){ S.decl = 0; }
    S.declAt = key;
  }
  return S.decl;
}

/* soft deadband: swallow tremor, pass real movement, no staircase edge */
function easeDelta(d, dead){
  const a = Math.abs(d);
  if (a >= dead) return d;
  const k = a/dead;
  return d * k * k;
}

/* ---------- the compass stream: heading only, and only slowly ---------- */
let compassRaw = null;
function handleCompass(ev){
  if (S.nativeHost) return;
  let az = null;
  if (typeof ev.webkitCompassHeading === 'number'){
    az = ev.webkitCompassHeading + currentDeclination();
  } else if (ev.absolute === true && ev.alpha != null){
    const Rm = deviceRotation(ev.alpha*D2R, (ev.beta||0)*D2R, (ev.gamma||0)*D2R);
    const f = norm3(mRot(Rm, [0,0,-1]));
    if (Math.abs(f[2]) > 0.985) return;          /* aimed at the zenith: heading is meaningless */
    az = Math.atan2(f[0], f[1])*R2D + currentDeclination();
  }
  if (az === null) return;
  compassRaw = ((az % 360) + 360) % 360;
  S.headSeen = true;
}

/* ============================================================
   Native host bridge.

   Inside a React Native / Expo shell the host can read the RAW
   gyroscope and magnetometer and fuse them properly, which the
   browser will not expose. When a host claims the page, the
   browser sensor path switches off and aim arrives from native.
   ============================================================ */
window.__skyNative = {
  claim(){
    S.nativeHost = true;
    if (typeof setGyro === 'function') setGyro(false);
    S.gyro = true; S.mode = 'look'; S.live = true; S.rate = 0;
    if (typeof updateStrip === 'function') updateStrip();
    needsDraw();
    return {ok:true, protocol:1};
  },
  /* alt and az in degrees, az clockwise from north, roll in degrees.
     frame 'magnetic' lets the page apply its own WMM declination so the
     model lives in exactly one place. */
  aim(alt, az, roll, frame){
    if (!S.nativeHost || S.freeze) return;
    if (frame === 'magnetic') az += currentDeclination();
    S.viewAlt = Math.max(-89.5, Math.min(89.5, alt + S.calAlt));
    S.viewAz  = (((az + S.calAz) % 360) + 360) % 360;
    if (typeof roll === 'number') S.roll = roll*D2R;
    needsDraw();
  },
  place(lat, lon, name){
    S.lat = lat; S.lon = lon; S.placeName = name || 'My sky';
    S.declAt = null; savePrefs(); needsDraw();
  },
  set(key, value){ if (key in S){ S[key] = value; savePrefs(); needsDraw(); } },
  state(){
    return {alt:S.viewAlt, az:S.viewAz, roll:S.roll*R2D, lat:S.lat, lon:S.lon,
            mode:S.mode, frozen:S.freeze, declination:currentDeclination(),
            calAz:S.calAz, calAlt:S.calAlt, drawings:S.mine.length};
  },
  release(){ S.nativeHost = false; S.gyro = false; S.roll = 0; needsDraw(); }
};
/* tell the host the page is ready for orientation */
try {
  if (window.ReactNativeWebView)
    window.ReactNativeWebView.postMessage(JSON.stringify({type:'ready', protocol:1}));
} catch(e){}

/* ---------- the motion stream: gyroscope, every frame ---------- */
function handleOrientation(ev){
  if (S.freeze || S.nativeHost) return;        /* the native host is driving */
  if (ev.alpha == null && ev.beta == null) return;
  const now = performance.now();
  const dt = lastEv ? Math.min(0.25, (now - lastEv)/1000) : 1/60;
  lastEv = now;
  const t = tune();

  const Rm = deviceRotation((ev.alpha||0)*D2R, (ev.beta||0)*D2R, (ev.gamma||0)*D2R);
  const f = norm3(mRot(Rm, [0,0,-1]));                      /* the phone's back: east, north, up */
  const sa = screenAngle()*D2R;
  const up = norm3(mRot(Rm, [-Math.sin(sa), Math.cos(sa), 0]));   /* up ON SCREEN */

  const F = norm3([fx(f[0],dt), fy(f[1],dt), fz(f[2],dt)]);

  /* roll, filtered as a vector so it never jumps across the wrap */
  const right = cross3(F, up);
  let zp = [ -F[0]*F[2], -F[1]*F[2], 1 - F[2]*F[2] ];
  if (Math.hypot(zp[0],zp[1],zp[2]) > 0.02){
    zp = norm3(zp);
    const raw = Math.atan2(dot3(zp, right), dot3(zp, up));
    S.roll = Math.atan2(fi(Math.sin(raw), dt), fr(Math.cos(raw), dt));
  }

  const alt = Math.asin(Math.max(-1, Math.min(1, F[2])))*R2D;
  const rawAz = Math.atan2(F[0], F[1])*R2D;

  /* The gyroscope's zero is arbitrary, so snap it to the compass the
     instant a heading arrives. After that the compass is only allowed to
     pull a fraction at a time, which averages its noise away. A brief
     high-gain settle right after lock-on stops it crawling into place. */
  if (S.headOff === null) S.headOff = 0;
  if (!S.headLocked && compassRaw !== null){
    S.headOff = wrap180(compassRaw - rawAz);
    S.headLocked = true; S.settleT = now;
  } else if (S.driftFix && compassRaw !== null && Math.abs(alt) < 82){
    const settling = (now - S.settleT) < 2500;
    const err = wrap180(compassRaw - (rawAz + S.headOff));
    S.headOff += err * (settling ? 0.02 : t.gain);
  }

  const target = ((rawAz + S.headOff + S.calAz) % 360 + 360) % 360;
  const tgtAlt = Math.max(-89.5, Math.min(89.5, alt + S.calAlt));

  S.viewAz  = ((S.viewAz + easeDelta(wrap180(target - S.viewAz), t.dead)) % 360 + 360) % 360;
  S.viewAlt = S.viewAlt + easeDelta(tgtAlt - S.viewAlt, t.dead);
  needsDraw();
}

/* ============================================================
   Guided tour. Runs once on first launch, replayable from the
   Sky panel. Each step can spotlight a real control, so you

   ============================================================ */
