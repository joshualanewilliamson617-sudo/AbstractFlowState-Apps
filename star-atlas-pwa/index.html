let tourAt = -1;
const tourEl = document.getElementById('tour');
const spot = document.getElementById('spot');
const tcard = document.getElementById('tcard');

function startTour(){
  tourAt = -1;
  document.getElementById('tdots').innerHTML = TOUR.map(()=>'<i></i>').join('');
  tourEl.classList.add('on');
  nextTour();
}
function endTour(){
  tourEl.classList.remove('on');
  DB.set('atlas:tour','1').catch(()=>{});
}
function nextTour(){
  tourAt++;
  if (tourAt >= TOUR.length){ endTour(); toast('That is the whole thing. Go outside.'); return; }
  const step = TOUR[tourAt];
  document.getElementById('ttitle').innerHTML = step.title;
  document.getElementById('ttext').innerHTML = step.text;
  document.getElementById('tnext').textContent = (tourAt === TOUR.length-1) ? 'Done' : 'Next';
  document.querySelectorAll('#tdots i').forEach((d,i)=>d.classList.toggle('on', i===tourAt));

  const target = step.el ? document.querySelector(step.el) : null;
  if (target){
    const r = target.getBoundingClientRect(), pad = 8;
    spot.classList.remove('hidden');
    spot.style.left   = (r.left - pad) + 'px';
    spot.style.top    = (r.top - pad) + 'px';
    spot.style.width  = (r.width + pad*2) + 'px';
    spot.style.height = (r.height + pad*2) + 'px';
    spot.style.borderRadius = (r.width > 70 ? 16 : r.width/2 + pad) + 'px';
  } else {
    spot.classList.add('hidden');
    spot.style.left='50%'; spot.style.top='50%'; spot.style.width='0'; spot.style.height='0';
  }

  /* keep the card clear of whatever is being highlighted */
  const h = tcard.offsetHeight || 190;
  let top;
  if (!target) top = Math.max(70, (window.innerHeight - h)/2);
  else {
    const r = target.getBoundingClientRect();
    top = (r.top > window.innerHeight*0.5) ? (r.top - h - 26) : (r.bottom + 26);
    top = Math.max(70, Math.min(window.innerHeight - h - 20, top));
  }
  tcard.style.top = top + 'px';
  buzz(6);
}
document.getElementById('tnext').onclick = nextTour;
document.getElementById('tskip').onclick = ()=>{ endTour(); toast('Tutorial is under Sky if you want it later'); };

/* ---------- gallery (shared between everyone using this atlas) ---------- */
let GAL = null, galBusy = false;
const SB = () => CONFIG.supabaseUrl && CONFIG.supabaseKey;
function sbHeaders(){ return {apikey:CONFIG.supabaseKey,
  Authorization:'Bearer '+CONFIG.supabaseKey, 'Content-Type':'application/json'}; }

async function loadGallery(){
  galBusy = true;
  try {
    if (SB()){
      const r = await fetch(CONFIG.supabaseUrl+'/rest/v1/constellations?select=*&order=created_at.desc&limit=60',
        {headers:sbHeaders()});
      const rows = await r.json();
      GAL = (Array.isArray(rows)?rows:[]).map(o=>({name:o.name, by:o.author,
        segs:typeof o.segs==='string'?JSON.parse(o.segs):o.segs, when:o.created_at}));
    } else {
      const r = await DB.list('gal:', true);
      const keys = (r && r.keys ? r.keys : []).slice(-40).reverse();
      const out = [];
      for (const k of keys){
        try { const v = await DB.get(k, true);
              if (v && v.value){ const o = JSON.parse(v.value); o.key = k; out.push(o); } } catch(e){}
      }
      GAL = out;
    }
  } catch(e){ GAL = []; }
  galBusy = false;
}

async function publish(i){
  const f = S.mine[i];
  const who = (S.author||'').trim();
  if (!who) return toast('Add a name to sign it with first');
  try {
    if (SB()){
      const r = await fetch(CONFIG.supabaseUrl+'/rest/v1/constellations',
        {method:'POST', headers:sbHeaders(),
         body:JSON.stringify({name:f.name, author:who, segs:f.segs})});
      if (!r.ok) throw new Error('rejected');
    } else {
      const key = 'gal:'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
      await DB.set(key, JSON.stringify({name:f.name, segs:f.segs, by:who, when:Date.now()}), true);
    }
    f.published = true; await saveMine();
    GAL = null; buzz(14);
    toast(DB.shared ? 'Published \u2014 others can find it in the gallery'
                    : 'Saved to your gallery on this device');
    renderPanel('gallery');
  } catch(e){ toast('Could not publish \u2014 check the gallery setup'); }
}

          <small>by ${esc(g.by)} \u00B7 ${g.segs.length} line${g.segs.length===1?'':'s'}</small></div>
          <button class="btn ghost" data-add="${i}">Add to my sky</button></div>`).join('')}
    </div><div style="height:20px"></div>
  </div>`;
  if (GAL === null && !galBusy) loadGallery().then(()=>{ if (openTab==='gallery') renderPanel('gallery'); });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- wiring ---------- */
function setDateParts(fn){
  S.live=false; S.rate=0;
  const d = new Date(S.date.getTime()); fn(d); S.date = d; needsDraw();
}

function wire(p){
  body.querySelectorAll('.tog').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.t; S[k] = !S[k];
      el.classList.toggle('on', S[k]);
      if (k==='redMode') document.body.classList.toggle('red', S.redMode);
      savePrefs(); needsDraw();
    };
  });

  if (p==='sky'){
    document.getElementById('geo').onclick = ()=>{
      if (!navigator.geolocation) return toast('This browser has no location service');
      toast('Asking for your location\u2026');
      navigator.geolocation.getCurrentPosition(pos=>{
        S.lat=pos.coords.latitude; S.lon=pos.coords.longitude; S.placeName='My sky';
        S.live=true; S.rate=0; savePrefs(); renderPanel('sky'); needsDraw();
        toast('Showing the sky above you, right now');
      }, ()=>toast('Location denied \u2014 pick a city or type coordinates'));
    };
    document.getElementById('gyro2').onclick = ()=>{ closePanel(); setTab(null); toggleGyro(); };
    document.getElementById('showTour').onclick = ()=>{ closePanel(); setTab(null); startTour(); };
    document.getElementById('steadyChips').onclick = e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      S.steady = b.dataset.s; resetFilters(); savePrefs(); renderPanel('sky'); needsDraw();
    };
    document.getElementById('calib').onclick = async ()=>{
      closePanel(); setTab(null);
      if (S.mode!=='look') setMode('look');
      if (!S.gyro) await toggleGyro();
      S.calibrating = true; updateHint(); needsDraw();
    };
    const cc = document.getElementById('calclr');
    if (cc) cc.onclick = ()=>{ clearCalibration(); renderPanel('sky'); };
    document.getElementById('cityChips').onclick = e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      const c = CITIES[+b.dataset.i];
      S.placeName=c[0]; S.lat=c[1]; S.lon=c[2];
      savePrefs(); renderPanel('sky'); needsDraw();
    };
    document.getElementById('ilat').onchange = e=>{
      S.lat=Math.max(-90,Math.min(90,+e.target.value||0)); S.placeName='Custom'; savePrefs(); needsDraw(); };
    document.getElementById('ilon').onchange = e=>{
      S.lon=Math.max(-180,Math.min(180,+e.target.value||0)); S.placeName='Custom'; savePrefs(); needsDraw(); };
    document.getElementById('idate').onchange = e=>{
      const [y,m,dd] = e.target.value.split('-').map(Number);
      if (y) setDateParts(d=>d.setFullYear(y,m-1,dd));
    };
    document.getElementById('itime').onchange = e=>{
      const [h,mi] = e.target.value.split(':').map(Number);
      setDateParts(d=>d.setHours(h,mi,0,0));
    };
    document.getElementById('iyear').onchange = e=>{
      const y = parseInt(e.target.value,10);
      if (!isNaN(y) && y>-20000 && y<20000) setDateParts(d=>d.setFullYear(y));
    };
    document.getElementById('now').onclick = ()=>{
      S.live=true; S.rate=0; S.date=new Date(); renderPanel('sky'); needsDraw(); };
    const rc = document.getElementById('rateChips');
    const mark = ()=> rc.querySelectorAll('.chip').forEach(c=>{
      const r=c.dataset.r; c.classList.toggle('on',(r==='live'&&S.live)||(!S.live&&+r===S.rate)); });
    mark();
    rc.onclick = e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.r==='live'){ S.live=true; S.rate=0; S.date=new Date(); }
      else { S.live=false; S.rate=+b.dataset.r; }
      mark(); needsDraw();
    };
    document.getElementById('showerList').onclick = e=>{
      const b = e.target.closest('[data-jump]'); if (!b) return;
      const sh = SHOWERS.find(x=>x[0]===b.dataset.jump);
      setDateParts(d=>{ d.setMonth(sh[3]-1, sh[4]); d.setHours(2,30,0,0); });
      S.showShowers = true;
      if (S.mode!=='map'){ S.mode='look'; const aa=altazOf(sh[1],sh[2]);
        S.viewAlt=Math.max(10,aa[0]*R2D); S.viewAz=aa[1]*R2D; }
      closePanel(); setTab(null);
      toast(sh[0]+' at its peak \u2014 radiant marked, meteors incoming');
    };
  }

  if (p==='cultures'){
    document.getElementById('cultList').onclick = e=>{
      const b = e.target.closest('.cult'); if (!b) return;
      S.culture = b.dataset.c; S.showCulture = true;
      savePrefs(); renderPanel('cultures'); needsDraw(); panel.scrollTop = 0;
    };
    const era = document.getElementById('era');
    if (era) era.onclick = ()=>{
      const y = ERA[S.culture];
      setDateParts(d=>{ d.setFullYear(y,6,15); d.setHours(22,0,0,0); });
      toast('Sky set to '+(y<0?(-y)+' BC':'AD '+y)+' \u2014 watch where the pole has moved');
      closePanel(); setTab(null);
    };
  }

  if (p==='layers'){
    const mg = document.getElementById('mag');
    mg.oninput = ()=>{ S.magLimit = +mg.value; needsDraw(); };
    mg.onchange = ()=>{ savePrefs(); renderPanel('layers'); };
  }

  if (p==='gallery'){
    const au = document.getElementById('author');
    au.onchange = ()=>{ S.author = au.value; DB.set('atlas:author', S.author).catch(()=>{}); };
    document.getElementById('mineList').onclick = async e=>{
      const pub = e.target.closest('[data-pub]'), del = e.target.closest('[data-del]');
      if (pub){ S.author = document.getElementById('author').value; await publish(+pub.dataset.pub); return; }
      if (del){
        const i = +del.dataset.del;
        if (confirm('Delete "'+S.mine[i].name+'"?')){
          S.mine.splice(i,1); await saveMine(); renderPanel('gallery'); needsDraw();
        }
      }
    };
    document.getElementById('galList').onclick = async e=>{
      const b = e.target.closest('[data-add]'); if (!b) return;
      const g = GAL[+b.dataset.add];
      S.mine.push({name:g.name, from:g.by, segs:g.segs, made:Date.now()});
      await saveMine(); renderPanel('gallery'); needsDraw();
      toast('Added to your sky');
    };
  }
}

  S.mode = m; S.zoom = 1; buzz(8);
  if (m === 'horizon'){ S.panX = 0; S.panY = 0; if (S.gyro) setGyro(false); }
  if (m === 'map'){ S.mapDec = 0; S.mapRA = ((lstDeg%360)+360)%360; if (S.gyro) setGyro(false); }
  savePrefs(); needsDraw();
}

};

});

/* ============================================================
   THE EARTH UNDER YOUR FEET

   You are standing on the surface, so the planet fills the whole
   lower half of your view. Where exactly does a given place sit?

   Observer at P = R*p, target at Q = R*q, separated by angle t.
     up component  = R(cos t - 1) = -2R sin^2(t/2)
     horizontal    = R sin t      =  2R sin(t/2) cos(t/2)
     altitude      = atan2(up, horizontal) = -t/2

   So the dip to any place is exactly HALF its great-circle
   distance. Somewhere 90 degrees away sits 45 degrees below your
   horizon; the antipode is straight down. Every coastline here is
   drawn from that one relation.
   ============================================================ */

const CITIES_E = CITY_BLOB.split('~').map(r=>{
  const f = r.split(',');
  return {name:f[0], lat:+f[1], lon:+f[2]};
});

let obsLat = null, obsSin = 0, obsCos = 1;
function earthFrame(){
  if (obsLat === S.lat) return;
  obsLat = S.lat;
  obsSin = Math.sin(S.lat*D2R);
  obsCos = Math.cos(S.lat*D2R);
}

/* a point on the globe -> where you must look to see it, in degrees */
function earthLook(latDeg, lonDeg){
  const la = latDeg*D2R, dl = (lonDeg - S.lon)*D2R;
  const sla = Math.sin(la), cla = Math.cos(la), cdl = Math.cos(dl), sdl = Math.sin(dl);
  let c = obsSin*sla + obsCos*cla*cdl;
  c = c > 1 ? 1 : (c < -1 ? -1 : c);
  const t = Math.acos(c);                       /* great-circle separation */
  const az = Math.atan2(sdl*cla, obsCos*sla - obsSin*cla*cdl);
  return [-(t*R2D)/2, ((az*R2D % 360) + 360) % 360, t*R2D];
}

/* and the reverse: look this way, come out of the ground where? */
function earthExit(altDeg, azDeg){
  const t = Math.max(0, Math.min(Math.PI, -2*altDeg*D2R));
  const a = azDeg*D2R, st = Math.sin(t), ct = Math.cos(t);
  const sla = obsSin*ct + obsCos*st*Math.cos(a);
  const lat = Math.asin(Math.max(-1, Math.min(1, sla)))*R2D;
  const lon = S.lon + Math.atan2(Math.sin(a)*st*obsCos, ct - obsSin*sla)*R2D;
  return [lat, ((lon + 540) % 360) - 180];
}

const EARTH_KM = 6371;
function angularKm(deg){ return deg*D2R*EARTH_KM; }

/* nearest named place, and how far off it is */
function nearPlace(lat, lon){
  const la = lat*D2R, sl = Math.sin(la), cl = Math.cos(la);
  let best = null, bd = 1e9;
  for (const c of CITIES_E){
    const cla = c.lat*D2R;
    let d = sl*Math.sin(cla) + cl*Math.cos(cla)*Math.cos((c.lon - lon)*D2R);
    d = Math.acos(d > 1 ? 1 : (d < -1 ? -1 : d))*R2D;
    if (d < bd){ bd = d; best = c; }
  }
  return {city:best, deg:bd, km:angularKm(bd)};
}

/* where the Sun stands overhead right now */
function subsolar(jd){
  const s = sunPos(jd);
  let lon = s.ra - gmstDeg(jd);
  return [s.dec, ((lon % 360) + 540) % 360 - 180];
}
function sunlit(lat, lon, sub){
  const a = lat*D2R, b = sub[0]*D2R;
  return Math.sin(a)*Math.sin(b) +
         Math.cos(a)*Math.cos(b)*Math.cos((lon - sub[1])*D2R) > 0;
}

/* ---------- projection for a horizontal direction ---------- */
/* mirrors project(), minus the celestial step */
function projectAltAz(altDeg, azDeg, slack){
  const alt = altDeg*D2R, az = azDeg*D2R;
  if (S.mode === 'look'){
    const p = lookProject(alt, az, !!slack);
    if (!p) return null;
    if (!slack && (p[0]<-80 || p[0]>W+80 || p[1]<-80 || p[1]>H+80)) return null;
    return p;
  }
  if (S.mode !== 'horizon') return null;          /* star map has no observer */
  const z = Math.PI/2 - alt;
  const r = S.seeThrough ? R*S.zoom*(z/(Math.PI/2)) : R*S.zoom*Math.tan(z/2);
  const x = cx + S.panX - r*Math.sin(az);
  const y = cy + S.panY - r*Math.cos(az);
  if (!slack && (x<-80||x>W+80||y<-80||y>H+80)) return null;
  return [x,y];
}

/* ---------- the x-ray globe ---------- */
function drawEarth(){
  if (!S.showEarth || !S.seeThrough) return;
  if (S.mode !== 'look' && S.mode !== 'horizon') return;
  const a = Math.min(1, Math.max(0, (S.reveal - 0.5)/0.5));
  if (a <= 0) return;
  earthFrame();

  const warm = S.redMode ? '255,120,90' : '214,176,120';
  const cool = S.redMode ? '196,80,58'  : '110,132,170';
  /* the dome packs the whole far hemisphere into a narrow ring, where fine
     detail only fights the star names. There it is texture, not a map. */
  const k = S.mode === 'horizon' ? 0.42 : 1;

  if (S.mode === 'look'){
    ctx.strokeStyle = 'rgba('+cool+','+(0.20*a)+')';
    ctx.lineWidth = 1;
    for (let la=-60; la<=60; la+=30) traceEarth((i)=>[la, -180 + i*5], 73);
    for (let lo=-180; lo<180; lo+=30) traceEarth((i)=>[-85 + i*5, lo], 35);
  }

  /* coastlines */
  ctx.strokeStyle = 'rgba('+warm+','+(0.72*a*k)+')';
  ctx.lineWidth = S.mode === 'look' ? 1.3 : 1.05;
  ctx.lineJoin = 'round';
  for (const ring of EARTH_RINGS){
    ctx.beginPath();
    let started = false, px = 0, py = 0;
    for (let i=0;i<ring.length;i+=2){
      const L = earthLook(ring[i+1], ring[i]);
      const p = projectAltAz(L[0], L[1], false);
      if (!p){ started = false; continue; }
      /* a long jump means the line went round the far side */
      if (started && Math.hypot(p[0]-px, p[1]-py) > Math.min(W,H)*0.55){ started = false; }
      if (!started){ ctx.moveTo(p[0], p[1]); started = true; }
      else ctx.lineTo(p[0], p[1]);
      px = p[0]; py = p[1];
    }
    ctx.stroke();
  }

  /* the antipode: straight down, and the far end of everything */
  const anti = earthExit(-90, 0);
  const near = nearPlace(anti[0], anti[1]);
  const p = projectAltAz(-89.4, S.mode==='look' ? S.viewAz : 180, false);
  if (p && S.showLabels){
    ctx.fillStyle = 'rgba('+warm+','+(0.85*a)+')';
    ctx.font = '400 12.5px Spectral,Georgia,serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = near.km < 200 ? near.city.name
      : near.km < 3000 ? Math.round(near.km).toLocaleString()+' km from '+near.city.name
      : 'the far side of the world';
    /* the little globe sits bottom left; do not write across it */
    let clear = true;
    if (S.showEarth && S.mode !== 'map'){
      const ic = insetCentre();
      if (Math.hypot(p[0]-ic[0], p[1]-ic[1]) < INSET_R + 86) clear = false;
    }
    if (S.mode === 'look' && clear){
      ctx.beginPath();
      ctx.arc(p[0], p[1], 5, 0, 6.2832);
      ctx.strokeStyle = 'rgba('+warm+','+(0.8*a)+')';
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillText('straight down · ' + label, p[0], p[1] + 17);
    }
  }
}

/* walk a path across the globe, breaking it where it leaves the view */
function traceEarth(fn, n){
  ctx.beginPath();
  let started = false, px = 0, py = 0;
  for (let i=0;i<n;i++){
    const q = fn(i);
    const L = earthLook(q[0], q[1]);
    const p = projectAltAz(L[0], L[1], false);
    if (!p){ started = false; continue; }
    if (started && Math.hypot(p[0]-px, p[1]-py) > Math.min(W,H)*0.55){ started = false; }
    if (!started){ ctx.moveTo(p[0], p[1]); started = true; }
    else ctx.lineTo(p[0], p[1]);
    px = p[0]; py = p[1];
  }
  ctx.stroke();
}

/* ============================================================
   THE LITTLE GLOBE

   The x-ray view above is geometrically honest but it is drawn
   from inside, which makes it hard to see yourself in it. So:
   a small Earth seen from outside, turned so you are facing the
   viewer. You are the dot in the middle. The night side is
   shaded, which also tells you at a glance why the sky looks
   the way it does.
   ============================================================ */

const INSET_R = 52;
function insetCentre(){
  return [16 + INSET_R, H - INSET_R - 92];
}

/* orthographic, centred on the observer: you sit dead centre */
function orthoPoint(latDeg, lonDeg, ox, oy, r){
  const la = latDeg*D2R, dl = (lonDeg - S.lon)*D2R;
  const sla = Math.sin(la), cla = Math.cos(la);
  if (obsSin*sla + obsCos*cla*Math.cos(dl) < 0) return null;   /* round the back */
  return [ox + (cla*Math.sin(dl))*r,
          oy - (obsCos*sla - obsSin*cla*Math.cos(dl))*r];
}
/* and back again, for shading pixel by pixel */
function orthoInverse(X, Y){
  const Z = Math.sqrt(Math.max(0, 1 - X*X - Y*Y));
  return [ Math.asin(Math.max(-1,Math.min(1, obsSin*Z + Y*obsCos)))*R2D,
           S.lon + Math.atan2(X, obsCos*Z - Y*obsSin)*R2D ];
}

function drawInset(){
  if (!S.showEarth || S.mode === 'map') return;
  if (roEl && roEl.classList.contains('on')) return;   /* the readout needs the room */
  if (hintEl && hintEl.classList.contains('on')) return;
  const a = Math.min(1, Math.max(0, (S.reveal - 0.6)/0.4));
  if (a <= 0) return;
  earthFrame();

  const c = insetCentre(), ox = c[0], oy = c[1], r = INSET_R;
  const warm = S.redMode ? '255,120,90' : '216,180,128';
  const sub  = subsolar(julianDay(S.date));

  ctx.save();
  ctx.globalAlpha = a;

  /* a dark backing so star names behind it do not tangle with the globe */
  ctx.beginPath(); ctx.arc(ox, oy, r + 7, 0, 6.2832);
  ctx.fillStyle = S.redMode ? 'rgba(10,0,0,.80)' : 'rgba(5,7,14,.80)';
  ctx.fill();

  /* the ocean */
  ctx.beginPath(); ctx.arc(ox, oy, r, 0, 6.2832);
  ctx.fillStyle = S.redMode ? 'rgba(44,8,8,.95)' : 'rgba(16,26,46,.95)';
  ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(ox, oy, r, 0, 6.2832); ctx.clip();

  /* land, drawn bright; the night shade then falls across it */
  ctx.strokeStyle = 'rgba('+warm+',.95)';
  ctx.lineWidth = 1; ctx.lineJoin = 'round';
  for (const ring of EARTH_RINGS){
    ctx.beginPath();
    let st = false;
    for (let i=0;i<ring.length;i+=2){
      const p = orthoPoint(ring[i+1], ring[i], ox, oy, r);
      if (!p){ st = false; continue; }
      if (!st){ ctx.moveTo(p[0],p[1]); st = true; } else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();
  }

  /* night: shade whatever the Sun cannot see, land included */
  ctx.fillStyle = S.redMode ? 'rgba(0,0,0,.66)' : 'rgba(2,4,10,.70)';
  const STEP = 2;
  for (let sy=-r; sy<=r; sy+=STEP){
    let run = null;
    for (let sx=-r; sx<=r+STEP; sx+=STEP){
      let dark = false;
      if (sx*sx + sy*sy <= r*r){
        const q = orthoInverse(sx/r, -sy/r);
        dark = !sunlit(q[0], q[1], sub);
      }
      if (dark && run === null) run = sx;
      else if (!dark && run !== null){ ctx.fillRect(ox+run, oy+sy, sx-run, STEP); run = null; }
    }
    if (run !== null) ctx.fillRect(ox+run, oy+sy, r-run+STEP, STEP);
  }

  /* the terminator itself: the line where the Sun is on the horizon */
  ctx.strokeStyle = S.redMode ? 'rgba(255,170,130,.55)' : 'rgba(255,216,154,.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  {
    const sb = sub[0]*D2R, sl = sub[1]*D2R;
    const n = [Math.cos(sb)*Math.cos(sl), Math.cos(sb)*Math.sin(sl), Math.sin(sb)];
    /* two vectors spanning the plane perpendicular to the subsolar direction */
    const u = [-Math.sin(sl), Math.cos(sl), 0];
    const v = [-Math.sin(sb)*Math.cos(sl), -Math.sin(sb)*Math.sin(sl), Math.cos(sb)];
    let st = false;
    for (let i=0;i<=120;i++){
      const t = (i/120)*2*Math.PI, ct = Math.cos(t), stt = Math.sin(t);
      const x = u[0]*ct + v[0]*stt, y = u[1]*ct + v[1]*stt, z = u[2]*ct + v[2]*stt;
      const p = orthoPoint(Math.asin(Math.max(-1,Math.min(1,z)))*R2D,
                           Math.atan2(y,x)*R2D, ox, oy, r);
      if (!p){ st = false; continue; }
      if (!st){ ctx.moveTo(p[0],p[1]); st = true; } else ctx.lineTo(p[0],p[1]);
    }
  }
  ctx.stroke();
  ctx.restore();

  /* rim */
  ctx.beginPath(); ctx.arc(ox, oy, r, 0, 6.2832);
  ctx.strokeStyle = 'rgba('+warm+',.42)'; ctx.lineWidth = 1; ctx.stroke();

  /* the way you are facing, drawn out from your own feet */
  if (S.mode === 'look'){
    const ang = S.viewAz*D2R;
    const len = 15 + 20*Math.max(0, Math.min(1, -S.viewAlt/90));
    ctx.strokeStyle = S.redMode ? '#FF6242' : '#D9A441';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.sin(ang)*len, oy - Math.cos(ang)*len);
    ctx.stroke();
    /* aiming below the horizon means aiming into the planet */
    if (S.viewAlt < -2){
      const ex = earthExit(S.viewAlt, S.viewAz);
      const q = orthoPoint(ex[0], ex[1], ox, oy, r);
      if (q){
        ctx.setLineDash([2,3]); ctx.globalAlpha = a*0.6; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(q[0], q[1]); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = a;
        ctx.fillStyle = S.redMode ? '#FF6242' : '#D9A441';
        ctx.beginPath(); ctx.arc(q[0], q[1], 2.2, 0, 6.2832); ctx.fill();
      }
    }
  }

  /* you */
  ctx.fillStyle = S.redMode ? '#FF6242' : '#D9A441';
  ctx.beginPath(); ctx.arc(ox, oy, 3.2, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = S.redMode ? 'rgba(255,98,66,.5)' : 'rgba(217,164,65,.5)';
  ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(ox, oy, 7, 0, 6.2832); ctx.stroke();

  ctx.restore();
}

/* ---------- boot ---------- */
(async function init(){
  await loadSaved();
  try { const r = await DB.get('atlas:author'); if (r&&r.value) S.author = r.value; } catch(e){}
  let seen = false;
  try { const r = await DB.get('atlas:seen'); seen = !!(r&&r.value); } catch(e){}
  resize(); updateStrip(); updateHint();
  requestAnimationFrame(t=>{ lastT=t; revealStart=t; loop(t); });
  if (seen){
    welcome.classList.add('gone');
    setTimeout(()=>welcome.style.display='none', 600);
    /* iOS needs a tap before it will hand over the compass; Android does not */
    const needsTap = window.DeviceOrientationEvent &&
      typeof window.DeviceOrientationEvent.requestPermission === 'function';
    if (S.mode==='look' && !S.gyro && !needsTap) setTimeout(()=>toggleGyro(), 400);
    else if (S.mode==='look' && needsTap) setTimeout(()=>toast('Tap the target button to aim at the sky'), 1400);
  }
  if (seen){
    let tourDone = false;
    try { const r = await DB.get('atlas:tour'); tourDone = !!(r&&r.value); } catch(e){}
    if (!tourDone) setTimeout(startTour, 900);
    else setTimeout(()=>{ if (!S.mine.length)
      toast('Tap anything to identify it \u00B7 pinch to zoom'); }, 3200);
  }
})();
</script>
