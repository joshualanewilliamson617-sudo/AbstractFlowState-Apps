<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lattice Cipher Field</title>
<style>:root{
  --void:#06060c;
  --deep:#0a0b14;
  --field:#0e1020;
  --panel:rgba(18,20,36,.82);
  --line:rgba(150,170,220,.13);
  --line-2:rgba(150,170,220,.07);
  --ink:#e8ecf8;
  --ink-2:rgba(232,236,248,.62);
  --ink-3:rgba(232,236,248,.34);
  --sealed:#3fd2d8;      /* encrypted state */
  --revealed:#ffc95c;    /* decoded state  */
  --key:#a98bfa;         /* key / rotor    */
  --reject:#ff5f7e;      /* auth failure   */
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(150,170,220,.16);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(150,170,220,.3)}

/* ---------- frame ---------- */
#app{position:fixed;inset:0;display:grid;
  grid-template-columns:196px 1fr 372px;
  grid-template-rows:1fr 104px;
  grid-template-areas:"rail stage inspect" "rail tape tape";
}
#rail{grid-area:rail;border-right:1px solid var(--line);background:var(--deep);
  display:flex;flex-direction:column;min-height:0}
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--void)}
#inspect{grid-area:inspect;border-left:1px solid var(--line);background:var(--deep);
  overflow-y:auto;overflow-x:hidden;min-height:0}
#tapebar{grid-area:tape;border-top:1px solid var(--line);background:var(--deep);
  display:flex;flex-direction:column;min-width:0}

/* ---------- rail ---------- */
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.brand h1 em{font-style:normal;color:var(--sealed)}
.brand p{margin-top:5px;font-size:11px;color:var(--ink-3);line-height:1.45}
.modes{padding:10px;display:flex;flex-direction:column;gap:3px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:9px;
  border:1px solid transparent;text-align:left;transition:background .15s,border-color .15s}
.mode:hover{background:rgba(150,170,220,.05)}
.mode[aria-selected="true"]{background:rgba(63,210,216,.09);border-color:rgba(63,210,216,.28)}
.mode .gl{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;
  border-radius:6px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;
  color:var(--ink-3)}
.mode[aria-selected="true"] .gl{color:var(--sealed);border-color:rgba(63,210,216,.4)}
.mode b{display:block;font-size:12.5px;font-weight:600}
.mode span{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.railfoot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink-3);line-height:1.5}
.railfoot b{color:var(--ink-2);font-weight:500}

/* ---------- stage ---------- */
#gl{position:absolute;inset:0;display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.02em}
#hud-tl{top:14px;left:16px;display:flex;flex-direction:column;gap:4px}
#hud-br{right:16px;bottom:14px;text-align:right;line-height:1.7}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:rgba(6,6,12,.6);backdrop-filter:blur(6px)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--sealed)}
.dot.gold{background:var(--revealed)}
.dot.key{background:var(--key)}
#stagetools{position:absolute;top:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;
  justify-content:flex-end;max-width:60%}
.tool{pointer-events:auto;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,11,20,.72);backdrop-filter:blur(8px);font-size:11px;color:var(--ink-2);
  transition:border-color .15s,color .15s,background .15s}
.tool:hover{color:var(--ink);border-color:rgba(150,170,220,.3)}
.tool[aria-pressed="true"]{color:var(--sealed);border-color:rgba(63,210,216,.45);
  background:rgba(63,210,216,.1)}
#nodecard{position:absolute;left:16px;bottom:16px;pointer-events:none;
  border:1px solid var(--line);background:rgba(10,11,20,.8);backdrop-filter:blur(10px);
  border-radius:12px;padding:11px 13px;display:none;min-width:186px}
#nodecard.on{display:block}
#nodecard .g{font-family:var(--mono);font-size:30px;line-height:1;font-weight:700}
#nodecard .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:6px}

/* ---------- inspector ---------- */
.sec{padding:16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h2{font-size:13px;font-weight:600;letter-spacing:-.005em}
.sec h2 + p{margin-top:4px;font-size:11.5px;color:var(--ink-3);line-height:1.5;max-width:62ch}
.fld{margin-top:12px}
.fld label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:5px}
.fld .hint{font-size:10.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;background:#080911;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:12.5px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:66px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(63,210,216,.5);
  box-shadow:0 0 0 3px rgba(63,210,216,.09)}
input.mono,textarea.mono{font-family:var(--mono);font-size:12px}
input.bad{border-color:rgba(255,95,126,.6);box-shadow:0 0 0 3px rgba(255,95,126,.09)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.btn{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:rgba(150,170,220,.06);font-size:12.5px;font-weight:500;
  transition:background .15s,border-color .15s,color .15s}
.btn:hover:not(:disabled){background:rgba(150,170,220,.12);border-color:rgba(150,170,220,.3)}
.btn:disabled{opacity:.36;cursor:not-allowed}
.btn.primary{background:rgba(63,210,216,.14);border-color:rgba(63,210,216,.4);color:#b9f6f8}
.btn.primary:hover:not(:disabled){background:rgba(63,210,216,.22)}
.btn.gold{background:rgba(255,201,92,.13);border-color:rgba(255,201,92,.38);color:#ffdfa1}
.btn.gold:hover:not(:disabled){background:rgba(255,201,92,.2)}
.btn.key{background:rgba(169,139,250,.13);border-color:rgba(169,139,250,.4);color:#d6c8ff}
.btn.key:hover:not(:disabled){background:rgba(169,139,250,.2)}
.btn.sm{padding:7px 10px;font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-2);font-size:11.5px}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--ink-3)}
.kv dd{font-family:var(--mono);color:var(--ink);text-align:right;word-break:break-all}
.num{font-family:var(--mono);font-size:11px;line-height:1.6;word-break:break-all;
  background:#080911;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
  color:var(--ink-2);max-height:120px;overflow:auto}
.num b{color:var(--ink);font-weight:500}
.num .tail{color:var(--sealed)}
.note{border-radius:9px;padding:10px 11px;font-size:11.5px;line-height:1.5}
.note.ok{background:rgba(63,210,216,.08);border:1px solid rgba(63,210,216,.26);color:#b9f6f8}
.note.gold{background:rgba(255,201,92,.08);border:1px solid rgba(255,201,92,.26);color:#ffdfa1}
.note.bad{background:rgba(255,95,126,.08);border:1px solid rgba(255,95,126,.3);color:#ffc2ce}
.note.quiet{background:rgba(150,170,220,.045);border:1px solid var(--line);color:var(--ink-3)}
.swap{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;
  background:#080911}
.swap button{padding:5px 13px;border-radius:999px;font-size:11.5px;color:var(--ink-3);
  transition:background .15s,color .15s}
.swap button[aria-pressed="true"]{background:var(--ink);color:#06060c;font-weight:600}

/* ---------- rotor dials ---------- */
.dials{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.dial{border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center;
  background:#080911}
.dial .nm{font-size:10px;color:var(--ink-3)}
.dial .vv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--key);
  margin:5px 0;line-height:1}
.dial .arr{display:flex;gap:5px;justify-content:center}
.dial .arr button{width:26px;height:24px;border-radius:7px;border:1px solid var(--line);
  font-size:12px;color:var(--ink-2);transition:background .15s}
.dial .arr button:hover{background:rgba(169,139,250,.16)}
.readout{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:14px;
  text-align:center;background:#080911}
.readout .lbl{font-size:10.5px;color:var(--ink-3)}
.readout .gl{font-family:var(--mono);font-size:52px;font-weight:700;line-height:1.05;margin:6px 0}
.readout .st{font-size:11px}

/* ---------- tape ---------- */
.tapehead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 16px 6px;flex-wrap:wrap}
.tapehead .t{font-size:11.5px;color:var(--ink-2)}
.tapehead .t b{color:var(--ink);font-weight:600}
.tapehead .r{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3)}
#tape{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:0 16px 12px;
  display:flex;gap:3px;align-items:center}
.cell{flex:0 0 auto;width:23px;height:30px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--line);
  background:rgba(63,210,216,.07);color:var(--sealed);cursor:pointer;
  transition:transform .12s,background .15s,color .15s,border-color .15s}
.cell:hover{transform:translateY(-2px)}
.cell.rev{background:rgba(255,201,92,.13);border-color:rgba(255,201,92,.4);color:var(--revealed)}
.cell.guess{background:rgba(169,139,250,.13);border-color:rgba(169,139,250,.42);color:var(--key)}
.cell.cur{box-shadow:0 0 0 2px var(--key);transform:translateY(-2px)}
.tape-empty{font-size:11.5px;color:var(--ink-3);padding:6px 2px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  #app{grid-template-columns:64px 1fr 330px}
  .brand p,.mode b,.mode span,.railfoot{display:none}
  .brand{padding:14px 0;text-align:center}
  .brand h1{font-size:0}
  .brand h1::after{content:"◈";font-size:17px;color:var(--sealed)}
  .modes{padding:8px 0;align-items:center}
  .mode{padding:9px;justify-content:center}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 96px;
    grid-template-areas:"rail" "stage" "inspect" "tape"}
  #rail{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);
    align-items:center;overflow-x:auto}
  .brand{border-bottom:none;border-right:1px solid var(--line);padding:12px 14px}
  .modes{flex-direction:row;padding:8px}
  #inspect{border-left:none;border-top:1px solid var(--line);max-height:42vh}
  #stage{min-height:38vh}
  #stagetools{max-width:none;left:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;
  display:none;max-width:min(520px,76%);backdrop-filter:blur(10px);
  background:rgba(10,11,20,.92)!important;pointer-events:none}

#crashcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
  display:none;width:min(560px,90%);max-height:78%;overflow:auto;padding:18px 20px;
  border:1px solid rgba(255,95,126,.45);border-radius:14px;
  background:rgba(12,8,14,.96);backdrop-filter:blur(14px);
  box-shadow:0 18px 60px rgba(0,0,0,.6)}
#crashcard h3{font-size:14px;font-weight:600;color:var(--reject);margin-bottom:9px}
#crashcard pre{font-family:var(--mono);font-size:10.5px;line-height:1.55;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;background:#0a0710;border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;margin-bottom:9px;max-height:210px;overflow:auto}
#crashcard pre:empty{display:none}
#crashcard p{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.crashrow{display:flex;gap:7px;flex-wrap:wrap}
.crashrow .btn{width:auto;flex:1 1 auto}

#crashcard.info{border-color:rgba(63,210,216,.4)}
#crashcard.info h3{color:var(--sealed)}
#crashcard.info pre{max-height:320px;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app">

  <aside id="rail">
    <div class="brand">
      <h1>Lattice <em>Cipher</em> Field</h1>
      <p>A message hidden in a vector equilibrium, read one node at a time.</p>
    </div>
    <div class="modes" id="rail-modes" role="tablist"></div>
    <div class="railfoot">
      <b>AES-256-GCM</b> with PBKDF2-SHA256, 600k iterations. The geometry hides and indexes the ciphertext; it does not replace it. Built to learn on.
    </div>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>

    <div class="hud" id="hud-tl">
      <span class="pill" id="hud-key"><span class="dot"></span>no key</span>
      <span class="pill" id="hud-shell">shell 4</span>
    </div>
    <div class="hud" id="hud-br"></div>

    <div id="stagetools">
      <button class="tool" data-show="thread" aria-pressed="true">thread</button>
      <button class="tool" data-show="shells" aria-pressed="true">struts</button>
      <button class="tool" data-show="dust" aria-pressed="true">dust</button>
      <button class="tool" id="t-recentre">recentre</button>
      <button class="tool" id="t-safe" aria-pressed="false" title="Draw the field as plain dots instead of characters">safe mode</button>
      <button class="tool" id="t-diag" title="What this machine reports">diagnostics</button>
    </div>

    <div id="nodecard"></div>
    <div id="toast" class="note ok"></div>
    <div id="crashcard" role="alert"></div>
  </main>

  <aside id="inspect"></aside>

  <section id="tapebar">
    <div class="tapehead">
      <div class="t">Payload tape <span id="tape-count"></span></div>
      <div class="r">
        <span class="pill"><span class="dot"></span>sealed</span>
        <span class="pill"><span class="dot gold"></span>read</span>
        <span id="tape-note"></span>
      </div>
    </div>
    <div id="tape"></div>
  </section>
