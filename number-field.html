let raf = 0, last = 0, noteAcc = 0, nextBeat = 0;
function tick(t){
  if(!S.anim.on) return;
  const dt = Math.min(0.05, (t-last)/1000 || 0.016);
  last = t;

  if(S.anim.mode === "sweep" || S.anim.mode === "both"){
    const key = S.anim.target === "auto" ? autoTarget() : S.anim.target;
    const sp = SWEEPS[key];
    if(sp){
      if(sp.spin){
        S.ry += 0.4*S.anim.speed*dt;
        if(S.view === "hyper") S.rw += 0.18*S.anim.speed*dt;
      } else {
        let v = sp.get() + S.anim.dir*sp.rate*S.anim.speed*dt;
        if(sp.wrap){
          if(v >= sp.max) v = sp.min;        // loop the cycle rather than run it backwards
          if(v <= sp.min) v = sp.min;
        } else {
          if(v >= sp.max){ v = sp.max; S.anim.dir = -1; }
          if(v <= sp.min){ v = sp.min; S.anim.dir = 1; }
        }
        sp.set(v);
        syncHud();
      }
    }
  }

  if(S.anim.mode === "notes" || S.anim.mode === "both"){
    const top = playheadMax();
    if(S.quantise){
      // schedule a little ahead against the audio clock, so the beat does not
      // drift with the frame rate the way a per-frame counter does
      const ac = S.sound ? audioCtx() : null;
      const nowA = ac ? ac.currentTime : (performance.now()/1000);
      const step = beatLen()/Math.max(0.1, S.anim.speed);
      if(nextBeat === 0 || nextBeat < nowA - 0.4) nextBeat = nowA + 0.05;
      let guard = 0;
      while(nextBeat < nowA + 0.18 && guard++ < 64){
        S.playN = S.playN + 1;
        if(S.playN > top) S.playN = 1;
        const m = mk(S.playN);
        if(m.pass && S.sound){
          const hits = evaluate(S.playN).hits;
          const idx = hits.indexOf(true);
          note(S.playN, idx < 0 ? 0 : idx, nextBeat);
        }
        nextBeat += step;
      }
    } else {
      noteAcc += dt * S.tempo * S.anim.speed;
      while(noteAcc >= 1){
        noteAcc -= 1;
        S.playN = S.playN + 1;
        if(S.playN > top) S.playN = 1;
        const m = mk(S.playN);
        if(m.pass && S.sound){
          const hits = evaluate(S.playN).hits;
          const idx = hits.indexOf(true);
          note(S.playN, idx < 0 ? 0 : idx);
        }
      }
    }

  draw();
  raf = requestAnimationFrame(tick);
}
function setPlay(on){

  b.innerHTML = on ? "&#10074;&#10074;" : "&#9654;";

  nextBeat = 0;
  if(on){ last = performance.now(); raf = requestAnimationFrame(tick); }
}
document.getElementById("play").onclick = function(){ setPlay(!S.anim.on); };
document.getElementById("snd").onclick = function(){

};

/* ---------- hud ---------- */
function hudSpec(){
  if(S.view === "tri") return [["Rows",4,4000,1,S.triRows,function(v){S.triRows=v;},true]];
  if(S.view === "ulam") return [["How many",25,2000000,1,S.count,function(v){S.count=v;},true]];
  if(S.view === "tunnel") return [["Rings",2,600,1,S.tunRings,function(v){S.tunRings=v;},true],
                                  ["Ring slots",2,200,1,S.tunBase,function(v){S.tunBase=v;},true]];
  if(S.view === "grid")
    return S.source === "seq"
      ? [["Row width",3,400,1,S.cols,function(v){S.cols=v;}],
         ["Count to",50,5000000,1,S.count,function(v){S.count=v;},true]]
      : [["Table size",4,400,1,S.tableSize,function(v){S.tableSize=v;}]];
  if(S.view === "wheel") return [["Points",6,200000,1,S.mod,function(v){S.mod=v;},true],["Times",2,500,1,S.mul,function(v){S.mul=v;}]];
  if(S.view === "spiral") return [["Arms",0,120,1,S.arms,function(v){S.arms=v;}],["How many",50,2000000,1,S.count,function(v){S.count=v;},true]];
  if(S.view === "zero") return S.zeroMode === "spiral"
      ? [["Depth",6,20000,1,S.depth,function(v){S.depth=v;},true],["Shrink",.5,.99,.005,S.ratio,function(v){S.ratio=v;}]]
      : [["Depth",6,S.zeroMode === "fan" ? 100000 : 2000000,1,S.depth,function(v){S.depth=v;},true]];
  if(S.view === "sphere") return [["How many",50,1000000,1,S.count,function(v){S.count=v;},true],["Shells",1,60,1,S.shells,function(v){S.shells=v;}]];
  if(S.view === "cube") return [["How many",50,2000000,1,S.count,function(v){S.count=v;},true],["Peel",0,30,1,S.peel,function(v){S.peel=v;}]];
  return [["How many",50,1000000,1,S.count,function(v){S.count=v;},true]];
}
function fmt(v){
  if(v % 1 !== 0) return v.toFixed(3);
  if(v >= 1000000) return (v/1000000).toFixed(v % 1000000 ? 1 : 0)+"M";
  if(v >= 10000) return Math.round(v/1000)+"k";
  return String(v);
}
// log-scale ranges: the slider carries 0-1000 and maps onto min..max exponentially
function logToVal(pos,min,max){ return min*Math.pow(max/min, pos/1000); }
function valToPos(v,min,max){ return Math.round(1000*Math.log(clamp(v,min,max)/min)/Math.log(max/min)); }
let hudRefs = [];
function buildHud(){
  const box = document.getElementById("hudsliders");
  box.innerHTML = ""; hudRefs = [];
  const spec = hudSpec();
  for(let idx = 0; idx < spec.length; idx++){
    const item = spec[idx];
    const isLog = item[6] === true;
    const row = document.createElement("div"); row.className = "hs";
    const s = document.createElement("span"); s.textContent = item[0];
    const i = document.createElement("input");
    i.type = "range";
    if(isLog){ i.min = 0; i.max = 1000; i.step = 1; i.value = valToPos(item[4], item[1], item[2]); }
    else { i.min = item[1]; i.max = item[2]; i.step = item[3]; i.value = item[4]; }
    const b = document.createElement("b");
    const field = document.createElement("input");
    field.type = "number"; field.value = item[4]; field.min = item[1]; field.max = item[2];
    b.appendChild(field);
    (function(fn, inp, fld, lo, hi, lg, stp){
      inp.oninput = function(){
        let v = lg ? logToVal(parseFloat(inp.value), lo, hi) : parseFloat(inp.value);
        if(stp >= 1) v = Math.round(v);
        fld.value = (v % 1 === 0) ? v : Math.round(v*1000)/1000;
        fn(v); requestDraw(true);
      };
      fld.onchange = function(){
        let v = parseFloat(fld.value);
        if(isNaN(v)) return;
        v = clamp(v, lo, hi);
        fld.value = v;
        inp.value = lg ? valToPos(v,lo,hi) : v;
        fn(v); if(typeof buildPanel === "function") buildPanel();
        draw();
      };
    })(item[5], i, field, item[1], item[2], isLog, item[3]);
    row.appendChild(s); row.appendChild(i); row.appendChild(b);
    box.appendChild(row);
    hudRefs.push({ i:i, b:b, log:isLog, lo:item[1], hi:item[2] });
  }
}
function syncHud(){
  const spec = hudSpec();
  for(let idx = 0; idx < hudRefs.length && idx < spec.length; idx++){
    const ref = hudRefs[idx], v = spec[idx][4];
    const want = ref.log ? valToPos(v, ref.lo, ref.hi) : v;
    if(parseFloat(ref.i.value) !== want){
      ref.i.value = want;
      const f = ref.b.firstChild;
      if(f && f.tagName === "INPUT") f.value = (v % 1 === 0) ? v : Math.round(v*1000)/1000;
      else ref.b.textContent = fmt(v);
    }
  }
}

function group(title){ const g = h("div","grp"); if(title) g.appendChild(h("h3",null,title)); return g; }
let LIVEC = [];
function slider(label,min,max,step,val,fn,isLog,live){
  const wrap = h("div","ctlwrap");
  const cap = h("div","cap");
  cap.appendChild(h("span",null,label));
  const rangeNote = h("em",null, fmt(min)+" \u2013 "+fmt(max));
  cap.appendChild(rangeNote);
  wrap.appendChild(cap);

  const box = h("div","ctl");
  const dec = document.createElement("button"); dec.className = "step"; dec.innerHTML = "&minus;";
  const inc = document.createElement("button"); inc.className = "step"; inc.innerHTML = "+";
  const rng = document.createElement("input");
  rng.type = "range";
  const num = document.createElement("input");
  num.type = "number"; num.className = "numbox";
  num.min = min; num.max = max; num.step = step;

  let cur = val;
  function paint(){
    if(isLog) rng.value = valToPos(cur,min,max);
    else rng.value = cur;
    num.value = (cur % 1 === 0) ? cur : Math.round(cur*1000)/1000;
  }
  function commit(v, redraw){
    cur = clamp(v, min, max);
    if(step >= 1) cur = Math.round(cur);
    paint(); fn(cur); syncHud();
    if(redraw !== false) requestDraw(true);
  }
  if(isLog){ rng.min = 0; rng.max = 1000; rng.step = 1; }
  else { rng.min = min; rng.max = max; rng.step = step; }
  paint();

  rng.oninput = function(){
    commit(isLog ? logToVal(parseFloat(rng.value),min,max) : parseFloat(rng.value));
  };
  num.onchange = function(){
    const v = parseFloat(num.value);
    commit(isNaN(v) ? cur : v);
  };
  function nudge(dir){
    // proportional on log scales, fixed elsewhere, so both ends stay usable
    const amt = isLog ? Math.max(step, cur*0.06) : step;
    commit(cur + dir*amt);
  }
  dec.onclick = function(){ nudge(-1); };
  inc.onclick = function(){ nudge(1); };
  // press and hold to run
  [[dec,-1],[inc,1]].forEach(function(pair){
    let t = 0, iv = 0;
    pair[0].addEventListener("pointerdown", function(){
      t = setTimeout(function(){ iv = setInterval(function(){ nudge(pair[1]); }, 70); }, 420);
    });
    const stop = function(){ clearTimeout(t); clearInterval(iv); };
    pair[0].addEventListener("pointerup", stop);
    pair[0].addEventListener("pointerleave", stop);
    pair[0].addEventListener("pointercancel", stop);
  });

  box.appendChild(dec); box.appendChild(rng); box.appendChild(num); box.appendChild(inc);
  wrap.appendChild(box);
  if(live) LIVEC.push({ live:live, set:function(v){ cur = clamp(v,min,max); paint(); } });
  return wrap;
}
// keep open panel controls in step with pinch-zoom and other gestures
function syncLive(){
  if(!panel.classList.contains("open") && window.innerWidth < 900) return;
  for(let i = 0; i < LIVEC.length; i++){
    const c = LIVEC[i], v = c.live();
    c.set(v);
  }
}

/* ---------- export ---------- */
// A web page cannot write to Photos directly. The share sheet can: it offers
// "Save to Photos" / "Save image" among the targets. Needs https and a real tap.
function canShareFiles(f){
  try{ return !!(navigator.canShare && navigator.canShare({ files:[f] }) && navigator.share); }
  catch(e){ return false; }
}
let LASTFILE = null;
function deliver(blob, filename, label){
  const f = new File([blob], filename, { type: blob.type });
  LASTFILE = f;
  if(canShareFiles(f)){
    navigator.share({ files:[f], title:"Number Field" })
      .then(function(){ toast("Shared \u2014 pick Save to Photos to keep it"); })
      .catch(function(err){
        if(err && err.name === "AbortError") return;      // they closed the sheet
        download(blob, filename, label);
      });
    return;
  }
  download(blob, filename, label);
  if(location.protocol !== "https:" && location.protocol !== "http:")
    toast("Saved to Downloads \u2014 host it online and this can go straight to Photos");
}
function download(blob, filename, label){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 6000);
  if(label) toast(label);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function setClean(on){
  document.body.classList.toggle("clean", on);
  S.clean = on;
  resize();
}
document.getElementById("btnFull").onclick = function(){
  const el = document.documentElement;
  if(!document.fullscreenElement && el.requestFullscreen){
    el.requestFullscreen().catch(function(){});
  }
  setClean(true);
  toast("Controls hidden \u2014 tap the cross to bring them back");
};

document.getElementById("btnShot").onclick = function(){
  const scale = 3, oldW = W, oldH = H;
  cv.width = Math.round(W*scale); cv.height = Math.round(H*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle = cssv("--ground"); ctx.fillRect(0,0,W,H);
  draw();
  cv.toBlob(function(bl){
    W = oldW; H = oldH; resize();
    deliver(bl, "number-field-"+S.view+".png",
            "Saved at "+Math.round(oldW*scale)+" \u00d7 "+Math.round(oldH*scale));
  });
};
let rec = null, chunks = [];
document.getElementById("btnRec").onclick = function(){
  const btn = document.getElementById("btnRec");
  if(rec && rec.state === "recording"){ rec.stop(); return; }
  if(typeof MediaRecorder === "undefined" || !cv.captureStream){ toast("This browser can't record video"); return; }
  try{
    const stream = cv.captureStream(30);
    // mp4 first: Photos and most galleries reject webm outright
    const types = ["video/mp4;codecs=avc1.42E01E","video/mp4",
                   "video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
    let mt = null;
    for(let i = 0; i < types.length; i++) if(MediaRecorder.isTypeSupported(types[i])){ mt = types[i]; break; }
    rec = new MediaRecorder(stream, mt ? { mimeType:mt, videoBitsPerSecond:8000000 } : undefined);
    chunks = [];
    rec.ondataavailable = function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      btn.classList.remove("on"); btn.innerHTML = "&#9679;";
      const mime = (rec.mimeType || "video/webm").split(";")[0];
      const ext = mime.indexOf("mp4") !== -1 ? "mp4" : "webm";
      const bl = new Blob(chunks, { type:mime });
      deliver(bl, "number-field-"+S.view+"."+ext,
              ext === "mp4" ? "Clip saved as MP4" : "Clip saved as WebM \u2014 this browser cannot record MP4");
    };
    rec.start();
    btn.classList.add("on"); btn.innerHTML = "&#9632;";
    toast("Recording \u2014 tap the square to stop");
    if(!S.anim.on) setPlay(true);
  }catch(err){ toast("Recording failed on this browser"); }
};

let step = 0;
const tut = document.getElementById("tut");
function renderTut(){
  document.getElementById("tuttitle").textContent = STEPS[step].t;
  document.getElementById("tutstep").textContent = "Step "+(step+1)+" of "+STEPS.length;
  document.getElementById("tutbody").innerHTML = STEPS[step].b;
  document.getElementById("tutbody").scrollTop = 0;
  const dots = document.getElementById("tutdots");
  dots.innerHTML = "";
  for(let i = 0; i < STEPS.length; i++){
    const d = document.createElement("i");
    if(i === step) d.className = "on";
    dots.appendChild(d);
  }
  document.getElementById("tutback").textContent = step === 0 ? "Skip" : "Back";
  document.getElementById("tutnext").textContent = step === STEPS.length-1 ? "Start" : "Next";
}
document.getElementById("tutnext").onclick = function(){ if(step === STEPS.length-1) tut.classList.remove("show"); else { step++; renderTut(); } };
document.getElementById("tutback").onclick = function(){ if(step === 0) tut.classList.remove("show"); else { step--; renderTut(); } };
document.getElementById("btnHelp").onclick = function(){ step = 0; renderTut(); tut.classList.add("show"); };

// one flat list, with each step remembering which chapter it came from
let TOUR = [];
function buildTour(only){
  TOUR = [];
  for(let i = 0; i < CHAPTERS.length; i++){
    if(only !== null && only !== undefined && i !== only) continue;
    for(let j = 0; j < CHAPTERS[i].steps.length; j++){
      const st = CHAPTERS[i].steps[j];
      TOUR.push({ c:st.c, t:st.t, run:st.run, tween:st.tween, ch:CHAPTERS[i].name, first:j === 0 });
    }
  }
}
buildTour(null);

const cap = document.getElementById("cap");
let tour = { on:false, i:0, t0:0, raf:0 };
function tourStep(i){
  const st = TOUR[i];
  document.getElementById("capnum").innerHTML = (i+1)+"/"+TOUR.length +
    '<br><span style="opacity:.75">'+st.ch+'</span>';
  document.getElementById("captxt").textContent = st.c;
  if(st.run) st.run();
}
function tourLoop(now){
  if(!tour.on) return;
  const st = TOUR[tour.i];
  const p = clamp((now - tour.t0)/st.t, 0, 1);
  if(st.tween) st.tween(p);
  document.getElementById("capbar").style.width = (p*100).toFixed(1)+"%";
  draw();
  if(p >= 1){
    tour.i++;
    if(tour.i >= TOUR.length){ stopTour(); return; }
    tour.t0 = now;
    tourStep(tour.i);
  }
  tour.raf = requestAnimationFrame(tourLoop);
}
function startTour(only){
  stopTour();
  buildTour(only);
  if(!TOUR.length) return;
  setPlay(false);
  setPanel(false);
  tut.classList.remove("show");
  tour.on = true; tour.i = 0;
  cap.classList.add("show");
  tourStep(0);
  tour.t0 = performance.now();
  tour.raf = requestAnimationFrame(tourLoop);
}
function stopTour(){
  tour.on = false;
  cancelAnimationFrame(tour.raf);
  cap.classList.remove("show");
  refresh(); draw();
}
// skip straight to the next chapter
function tourNextChapter(){
  if(!tour.on) return;
  for(let i = tour.i + 1; i < TOUR.length; i++){
    if(TOUR[i].first){ tour.i = i; tour.t0 = performance.now(); tourStep(i); return; }
  }
  stopTour();
}
function tourRunLength(only){
  let ms = 0;
  for(let i = 0; i < CHAPTERS.length; i++){
    if(only !== null && only !== undefined && i !== only) continue;
    for(let j = 0; j < CHAPTERS[i].steps.length; j++) ms += CHAPTERS[i].steps[j].t;
  }
  const sec = Math.round(ms/1000);
  if(sec < 60) return sec + "s";
  const m = Math.floor(sec/60), r = sec % 60;
  return r < 8 ? (m + " min") : (m + "m " + r + "s");
}
const chapBox = document.getElementById("chapters");
function openTourMenu(){
  const list = document.getElementById("chaplist");
  list.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chaprow chapall";
  all.innerHTML = "<b>Everything</b><span>" + tourRunLength(null) + "</span>";
  all.onclick = function(){ chapBox.classList.remove("show"); startTour(null); };
  list.appendChild(all);
  for(let i = 0; i < CHAPTERS.length; i++){
    (function(idx){
      const b = document.createElement("button");
      b.className = "chaprow";
      b.innerHTML = "<b>" + CHAPTERS[idx].name + "</b><span>" + tourRunLength(idx) + "</span>";
      b.onclick = function(){ chapBox.classList.remove("show"); startTour(idx); };
      list.appendChild(b);
    })(i);
  }
  chapBox.classList.add("show");
}
chapBox.addEventListener("click", function(e){ if(e.target === chapBox) chapBox.classList.remove("show"); });
document.getElementById("btnTour").onclick = function(){ openTourMenu(); };
document.getElementById("capstop").onclick = function(){ stopTour(); };
document.getElementById("capnext").onclick = function(){ tourNextChapter(); };

function applyPreset(P){
  for(const key in P.st) S[key] = JSON.parse(JSON.stringify(P.st[key]));
  S.cam = {x:0,y:0,k:1}; S.sel = null;
  insp.classList.remove("show");
  syncTabs(); buildPanel(); buildHud(); draw(); writeHash();
}
const HKEYS = ["view","source","count","cols","tableSize","negatives","rules","combine","palette",
  "dimOthers","mod","mul","chords","arms","zeroMode","depth","logx","ratio","endless",
  "sphereLayout","bandMod","shells","peel","links","wire","triRows","triFaint","pins","tunRings","tunBase","tunOffset","tunDir","tunFlow","tunFunnel","tunGuides","nodeOn","nodePos","nodeWidth","ttOn","ttRow","ttCol","ttMode","ttSize","ttSlots","frame","svgBg","svgOnly","key","scale","bpm","div","quantise","wave","tempo"];
function encodeState(){
  const o = {};
  for(let i = 0; i < HKEYS.length; i++) o[HKEYS[i]] = S[HKEYS[i]];
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");
  }catch(e){ return ""; }
}
function decodeState(str){
  try{
    const pad = str + "===".slice((str.length + 3) % 4);
    const o = JSON.parse(decodeURIComponent(escape(atob(pad))));
    for(let i = 0; i < HKEYS.length; i++) if(o[HKEYS[i]] !== undefined) S[HKEYS[i]] = o[HKEYS[i]];
    if(!S.rules || !S.rules.length) S.rules = [{ on:true, type:"div", k:7, r:0, c:0 }];
    return true;
  }catch(e){ return false; }
}
let hashTimer = 0;
const CAN_HASH = (location.protocol === "http:" || location.protocol === "https:") && !!history.replaceState;
function shareURL(){ return location.href.split("#")[0] + "#" + encodeState(); }
function writeHash(){
  if(!CAN_HASH) return;
  clearTimeout(hashTimer);
  hashTimer = setTimeout(function(){
    try{
      const enc = encodeState();
      if(enc) history.replaceState(null, "", "#" + enc);
    }catch(e){}
  }, 400);
}

/* ---------- boot ---------- */
window.onerror = function(msg, src, line){
  const t = document.getElementById("toast");
  if(t){
    t.textContent = String(msg).slice(0,120) + " (line " + line + ")";
    t.style.borderColor = "#ff5fa2";
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); t.style.borderColor = ""; }, 9000);
  }
  return false;
};
let booted = false;
if(location.hash.length > 2 && decodeState(location.hash.slice(1))) booted = true;
syncTabs(); buildPanel(); buildHud(); resize();
if(!booted){ renderTut(); tut.classList.add("show"); }

const _draw = draw;
draw = function(){ _draw(); if(!S.anim.on) writeHash(); };
