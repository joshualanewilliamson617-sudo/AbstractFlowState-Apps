<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stone Yard Dock Master</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen cab console. HUD strip on top, the yard board fit to the middle, touch pedals docked below on phones. */
:root{
  --ink:#14120e; --panel:#1f1c16; --panel-2:#2a261e; --line:#3d3629;
  --text:#efe5cf; --muted:#a5967a; --signal:#f2b705; --cab:#c8372d;
  --good:#6cc070; --bad:#e5573f; --ghost:#7fd4f0;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--mono);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.id h1{font-family:var(--display);font-weight:900;font-size:26px;line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin:0}
.id h1 span{color:var(--signal)}
.id p{margin:3px 0 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px 5px;min-width:58px}
.stat span{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat b{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;color:var(--muted);font-size:12px}
.stat.warn b{color:var(--bad)}
.stat.gear b{display:inline-block;min-width:20px;text-align:center;border-radius:3px;padding:0 4px}
.stat.gear.rev b{background:var(--signal);color:var(--ink)}
.meter{width:64px;height:7px;margin-top:5px;background:var(--ink);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter div{height:100%;width:0;background:var(--good)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tools button:hover{border-color:var(--muted)}
.tools button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(165,150,122,.6)}

#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#board{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 0 0 4px #2a2419,0 18px 50px rgba(0,0,0,.55);touch-action:none}
#game{display:block;width:100%;height:100%}

.ov{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(16,13,9,.6)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:400px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);margin:0}
.card h2{font-family:var(--display);font-weight:900;font-size:40px;line-height:.92;text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.tip{font-size:13px;line-height:1.55;color:var(--text);margin:0 0 12px}
.best{font-size:11px;color:var(--muted);margin:0 0 14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11px;color:var(--muted);margin:0 0 16px}
.keys kbd{font-family:var(--mono);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px}
.row{display:flex;gap:8px}
.btn{flex:1;height:44px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.btn.go{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn:hover{filter:brightness(1.1)}

.starsBig{display:flex;gap:8px;margin:4px 0 12px}
.starsBig span{font-size:38px;line-height:1;color:#3d3629;transform:scale(.6);opacity:.6;transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .2s,opacity .2s}
.starsBig span.on{color:var(--signal);transform:scale(1);opacity:1}
.crit{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;font-size:12px}
.crit li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:6px;background:var(--ink);border:1px solid var(--line)}
.crit li::before{content:"✕";color:var(--bad);margin-right:8px;font-weight:600}
.crit li.ok::before{content:"✓";color:var(--good)}
.crit li span{flex:1}
.crit li b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.newbest{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.14em;color:var(--ink);background:var(--good);border-radius:3px;padding:1px 6px;vertical-align:middle}

#menu{position:absolute;inset:0;background:var(--ink);overflow:auto;padding:4px 2px 20px;z-index:5}
.menuHead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin:6px 0 14px}
.menuHead h2{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;text-transform:uppercase;margin:0}
.menuHead p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.total{font-family:var(--display);font-weight:800;font-size:28px;color:var(--signal)}
.total small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.chap{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:8px;border-top:1px solid var(--line);padding-top:12px}
.chap h3{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0;color:var(--signal)}
.chap p{margin:0;font-size:11px;color:var(--muted)}
.lv{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.lv:hover:not(:disabled){border-color:var(--signal)}
.lv canvas{width:100%;height:auto;aspect-ratio:4/3;border-radius:4px;display:block;max-width:100%}
.lv .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lv .n{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.lv .n em{font-style:normal;color:var(--muted);margin-right:6px}
.lv .s{color:var(--signal);letter-spacing:2px;font-size:13px}
.lv .s .off{color:#4a4233}
.lv .m{font-size:10px;color:var(--muted);letter-spacing:.06em}
.lv:disabled{opacity:.45;cursor:not-allowed}
.lv:disabled canvas{filter:grayscale(1) brightness(.6)}

.pad{display:none;gap:12px;align-items:stretch;padding-bottom:4px;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.wheel{flex:1;position:relative;height:74px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.wheel::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:var(--line)}
.wheel span{position:absolute;left:10px;top:8px;font-size:9px;letter-spacing:.18em;color:var(--muted)}
.knob{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#4a4234,#26221b);border:2px solid var(--muted)}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:14px;margin-left:-1.5px;background:var(--signal);border-radius:2px}
.pedals{display:flex;gap:8px}
.pedals button{width:78px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:13px;letter-spacing:.14em}
.pedals #gas{background:var(--text);color:var(--ink)}
.pedals button.down{filter:brightness(1.35);transform:scale(.97)}
@media (max-width:600px){
  .id h1{font-size:21px}
  .stat{padding:3px 7px;min-width:0}
  .stat b{font-size:13px}
  .tools button{padding:6px 8px;font-size:10px}
  .card h2{font-size:32px}
  .menuHead h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){.starsBig span{transition:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="id"><h1>Stone <span>Yard</span></h1><p id="lvlLabel">Yard 01 · Back It In</p></div>
    <div class="stats">
      <div class="stat" id="sMoves"><span>Moves</span><b id="hMoves">0</b> <i>/ <em id="hPar">3</em></i></div>
      <div class="stat"><span>Time</span><b id="hTime">0:00.0</b></div>
      <div class="stat" id="sScr"><span>Scrapes</span><b id="hScr">0</b></div>
      <div class="stat" id="sCone"><span>Cones</span><b id="hCone">0</b></div>
      <div class="stat"><span>Drops</span><b id="hDock">0/1</b></div>
      <div class="stat gear" id="sGear"><span>Gear</span><b id="hGear">D</b></div>
      <div class="stat"><span>Hitch</span><div class="meter"><div id="hArt"></div></div></div>
    </div>
    <nav class="tools">
      <button id="bYards">Yards</button>
      <button id="bRetry">Retry</button>
      <button id="bGuide" aria-pressed="true">Guide</button>
      <button id="bGhost" aria-pressed="true">Ghost</button>
      <button id="bSound" aria-pressed="true">Sound</button>
    </nav>
  </header>

  <div id="stage">
    <div id="board">
      <canvas id="game" width="768" height="576"></canvas>
      <div class="ov" id="intro" hidden></div>
      <div class="ov" id="win" hidden></div>
      <div class="ov" id="fail" hidden></div>
    </div>
    <div id="menu" hidden></div>
  </div>

  <div class="pad" id="pad">
    <div class="wheel" id="wheel"><span>STEER</span><div class="knob" id="knob"></div></div>
    <div class="pedals"><button id="rev">REV</button><button id="gas">GAS</button></div>
  </div>
</div>

<script>
(()=>{
const T=48,COLS=16,ROWS=12,W=T*COLS,H=T*ROWS,D2R=Math.PI/180;
const RIG={L1:30,L2:56,d:6,maxSteer:27*D2R,cabBack:10,cabFront:36,cabW:22,trFront:8,trBack:66,trW:24,vF:110,vR:48,jack:85*D2R};
const ANG={E:0,S:Math.PI/2,W:Math.PI,N:-Math.PI/2};
const UNLOAD=0.9, ALIGN=12*D2R;
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};

const OPEN=[
"################","#..............#","#..............#","#..............#","#..............#",
"#..............#","#..............#","#..............#","#..............#","#..............#"];
const LEVELS=[

 map:["################","#......1.......#",...OPEN.slice(2),"#..S...........E","################"]},
{name:"The Slot",par:3,head:"E",docks:{1:"S"},tip:"Stone on both sides of the bay. Square the trailer up before the slot, and watch the amber guide line.",
 map:["################","#######1########",...OPEN.slice(2),"#..S...........E","################"]},
{name:"Cone Alley",par:3,head:"E",docks:{1:"W"},tip:"The bay faces west, so you have to come around. Knocked cones cost you the clean-run star.",

{name:"Double Drop",par:5,head:"E",docks:{1:"S",2:"S"},tip:"Two bays, in number order. The exit gate only lifts after the last drop.",
 map:["################","#...1......2...#","#..............#","#..............#","#......##......#","#......##......#","#..............#","#..............#","#..............#","#..............#","#..S...........#","#######EE#######"]},
{name:"Chicane",par:5,head:"E",docks:{1:"S"},tip:"Thread the zig-zag. Before you reach the top, decide which way you need to be facing.",
 map:["################","#.........###1##","#..............#","#..............#","#..............#","#########......#","#..............#","#..............#","#......#########","#..............#","#..S...........#","#############E##"]},
{name:"Deep Slot",par:3,head:"E",docks:{1:"S"},tip:"Two tiles deep. Get the trailer dead straight before it enters; corrections inside become scrapes.",

{name:"Crate Stacks",par:4,head:"W",docks:{1:"E"},tip:"The bay is on the west wall. Find the loop through the pallets that leaves you facing east.",
 map:["################","#.....x........#","#.....x....xx..#","##.............#","#1.............#","##.....xx......#","#......xx......#","#..............#","#...xx.....x...#","#..........x...#","#..........x.S.#","##E#############"]},
{name:"Triple Haul",par:7,head:"E",docks:{1:"S",2:"S",3:"W"},tip:"Three drops. Plan the turn after the next one, not just the next one.",
 map:["################","#..1.......2...#","#..............#","#..............#","#.....####....##","#.....####....3#","#.............##","#..............#","#..............#","#..............#","#..S...........#","#######E########"]},
{name:"The Squeeze",par:4,head:"E",docks:{1:"S"},tip:"A two-wide corridor ends in a slot on its left side. Hug the left wall all the way up.",
 map:["################","#1##############","#..#...........#","#..#...........#","#..#....###....#","#..#....###....#","#..#...........#","#..#...........#","#..............#","#..............#","#.........S....#","############E###"]},
{name:"Inner Bay",par:3,head:"E",docks:{1:"S"},tip:"The bay sits inside the stone block. Swing wide on the approach so you reverse in straight.",
 map:["################","#..............#","#...########...#","#...########...#","#...########...#","#...###1.###...#","#...###..###...#","#...###..###...#","#..............#","#..............#","#..S...........#","##############E#"]},
{name:"Switchback",par:6,head:"E",docks:{1:"W",2:"E"},tip:"Bays on opposite walls with a divider between them. The exit is up top on the left.",
 map:["###E############","#.......#......#","#.......#.....##","#.......#.....1#","#.......#.....##","#.......#......#","##.............#","#2.............#","##.............#","#..............#","#.......S......#","################"]},
{name:"Dock Master",par:8,head:"W",docks:{1:"S",2:"S",3:"E"},tip:"Three drops, two slots, cones in the lanes. One clean run earns the title.",
 map:["################","#1#....c....#2##","#......c.......#","#..............#","#....######....#","#....######....#","#..............#","##.....c.......#","#3.............#","##.............#","#.....c...S....#","###########E####"]},
{name:"Gatekeeper",par:3,head:"E",docks:{1:"S"},tip:"New: pressure plates. Roll any axle over the plate to lift its matching shutter. The bay is straight above the gate, so think about which way you face before you go through.",
 map:["################","#......1.......#","#..............#","#..............#","######PP########","#..............#","#..............#","#..........p...#","#..............#","#..............#","#..S...........#","#############E##"]},
{name:"Back Plate",par:4,head:"E",docks:{1:"S"},tip:"The plate sits in a dead-end slot behind you. The trailer's wheels can press it too.",
 map:["################","#......1.......#","#..............#","#..............#","######PPP#######","#..............#","#..............#","#..............#","##.............#","#p.............#","##..S..........#","#############E##"]},
{name:"Island Loop",par:5,head:"E",docks:{1:"W",2:"E"},tip:"Both bays are cut into the stone island, facing opposite ways. Choose the loop direction that sets up both.",
 map:["################","#..............#","#..............#","#..............#","#.....####.....#","#....1####2....#","#.....####.....#","#.....####.....#","#..............#","#..............#","#..S...........#","#######E########"]},
{name:"Cone Field",par:3,head:"E",docks:{1:"S"},tip:"Fifteen cones on a grid. The lanes are wide enough, but only if you pick them before you turn.",
 map:["################","#.c..c..1..c..c#","#..............#","#c..c..c..c..c.#","#..............#","#.c..c....c..c.#","#..............#","#c..c..c..c..c.#","#..............#","#..............#","#..S...........E","################"]},
{name:"Two Keys",par:6,head:"E",docks:{1:"S",2:"W"},tip:"Two plates on your side of the wall: one lifts the middle shutter, one lifts the exit shutter. The exit counts if the cab or the trailer crosses it.",
 map:["################","#......1#......#","#.......#......#","#.......#......#","#.......P......#","#.......P......#","#.......#.....##","#..q....#.....2#","#.......#.....##","#.......#......#","#..S...p#..#QQ##","############EE##"]},
{name:"Shutter Run",par:6,head:"E",docks:{1:"S"},tip:"Plate in the corner slot, then up through two shutters and a band only two tiles tall.",
 map:["################","#..1...........#","#..............#","#..............#","##########QQ####","#..............#","#...q..........#","####PP##########","#..............#","#.............##","#..S..........p#","##E#############"]},
{name:"Crossroads",par:7,head:"E",docks:{1:"S",2:"W",3:"E"},tip:"Three bays facing three directions around a stone block. Every drop leaves you pointed somewhere new.",
 map:["################","#......1.......#","#..............#","#..............#","#.....####.....#","#3....####....2#","#.....####.....#","#..............#","#...c......c...#","#..............#","#..S...........#","#######E########"]},
{name:"Pallet Maze",par:6,head:"E",docks:{1:"S",2:"S"},tip:"Bays in both top corners, pallets everywhere else. Two exits; either one counts.",
 map:["################","#1....x....x..2#","#.....x....x...#","#..............#","#..xx....xx....#","#..xx....xx....#","#..............#","#......xx......#","#x.....xx.....x#","#..............#","#......S.......#","#####E####E#####"]},
{name:"Locked Rooms",par:9,head:"E",docks:{1:"S",2:"S"},tip:"Three rooms, four tiles wide. Each room's plate opens the next shutter. You will need three-point turns.",
 map:["################","#....#.1..#..2.#","#....#....#....#","#....#....#....#","#.p..#....#....#","#....#....#....#","#....#..q.#....#","#....#....#....#","#....P....Q....#","#....P....Q....#","#..S.#....#....#","############E###"]},
{name:"The Needle",par:3,head:"E",docks:{1:"S"},tip:"A bay three tiles deep and one tile wide. The whole rig ends up inside it, so it has to go in dead straight.",
 map:["################","######1#########","######.#########","######.#########","#..............#","#..............#","#...c.....c....#","#..............#","#..............#","#..............#","#..S...........#","###########E####"]},
{name:"Long Way Back",par:3,head:"E",docks:{1:"E"},tip:"The bay is at the far end of the top lane. The only way in is backwards, around a corner, the whole way.",
 map:["################","#1.............#","#..............#","#..............#","###########....#","###########....#","###########....#","#..............#","#..............#","#..............#","#..S...........#","#E##############"]},
{name:"Yard Boss",par:10,head:"W",docks:{1:"S",2:"S",3:"E"},tip:"Three drops, two shutters. The plate for the left shutter is in the top-right room. Plan the whole route before you roll.",
 map:["################","#1#.....#....2.#","#.......#..q...#","#.......P......#","#.......P......#","###QQ######..###","#..............#","#..............#","##.............#","#3.......p.....#","##...c....S....#","##########E#####"]}
];

/* ---------- storage ---------- */
const KEY="stone-yard-dock-master-v1";
let PROG={},SET={guide:true,ghost:true,sound:true};
try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");PROG=d.prog||{};Object.assign(SET,d.set||{})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({prog:PROG,set:SET}))}catch(e){}}
const unlocked=i=>i===0||((PROG[i-1]||{}).stars||0)>=1||(i===12&&LEVELS.slice(0,12).reduce((s,_,k)=>s+((PROG[k]||{}).stars||0),0)>=15);
const totalStars=()=>LEVELS.reduce((s,_,i)=>s+((PROG[i]||{}).stars||0),0);

/* ---------- dom ---------- */
const $=id=>document.getElementById(id);
const cv=$("game"),ctx=cv.getContext("2d"),board=$("board"),stage=$("stage");
const bg=document.createElement("canvas");bg.width=W*2;bg.height=H*2;
const marks=document.createElement("canvas");marks.width=W*2;marks.height=H*2;
const mctx=marks.getContext("2d");mctx.setTransform(2,0,0,2,0,0);
let DPR=1,SCALE=1;
function fit(){
  const r=stage.getBoundingClientRect();const s=Math.max(.1,Math.min(r.width/W,r.height/H));
  const cw=Math.floor(W*s),ch=Math.floor(H*s);board.style.width=cw+"px";board.style.height=ch+"px";
  DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);SCALE=cw/W*DPR;
}
new ResizeObserver(fit).observe(stage);

/* ---------- geometry ---------- */
function rectPoly(cx,cy,a,front,back,hw){

const hitch=st=>({x:st.x+Math.cos(st.th)*RIG.d,y:st.y+Math.sin(st.th)*RIG.d});

const solidAtRaw=(r,c)=>r<0||r>=ROWS||c<0||c>=COLS||L.grid[r][c]==="#"||L.grid[r][c]==="x";

/* ---------- audio ---------- */
const AU={c:null,
  init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=this.c=new C();
    this.m=c.createGain();this.m.gain.value=SET.sound?1:0;this.m.connect(c.destination);
    const o=this.eo=c.createOscillator();o.type="sawtooth";o.frequency.value=42;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;
    this.eg=c.createGain();this.eg.gain.value=0;o.connect(lp);lp.connect(this.eg);this.eg.connect(this.m);o.start();
    const b=c.createOscillator();b.type="square";b.frequency.value=1040;this.bg=c.createGain();this.bg.gain.value=0;b.connect(this.bg);this.bg.connect(this.m);b.start();
  }catch(e){this.c=null}},
  mute(on){if(this.m)this.m.gain.value=on?1:0},
  tick(dt,v,live){if(!this.c)return;const t=this.c.currentTime;
    if(this.c.state==="suspended")this.c.resume();
    this.eo.frequency.setTargetAtTime(38+Math.abs(v)*.45,t,.08);
    this.eg.gain.setTargetAtTime(live?.05+Math.abs(v)*.0006:0,t,.1);
    this.bt=(this.bt||0)+dt;const on=live&&v<-2&&(this.bt%0.8)<0.4;this.bg.gain.setTargetAtTime(on?.025:0,t,.005)},
  blip(f,d,type="sine",vol=.12,f2){if(!this.c)return;const c=this.c,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.02)},
  thud(){if(!this.c)return;const c=this.c,n=c.sampleRate*.25|0,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=600;const g=c.createGain();g.gain.value=.5;s.connect(f);f.connect(g);g.connect(this.m);s.start();

  ding(){this.blip(880,.35,"sine",.14);setTimeout(()=>this.blip(1320,.5,"sine",.12),110)},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.blip(f,.4,"triangle",.12),i*110))}

/* ---------- state ---------- */
let cur=0,L=null;
const S={};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function parse(def){
  const grid=[],cones=[],docks=[],exits=[],pads=[];let start={x:T*3.5,y:T*10.5};
  for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++){const ch=def.map[r][c]||"#";let t=".";
    if(ch==="#"||ch==="x")t=ch;
    else if(ch==="E"){t="E";exits.push({r,c,out:r===0?"N":r===ROWS-1?"S":c===0?"W":"E"})}
    else if("PQR".includes(ch))t=ch;
    else if("pqr".includes(ch))pads.push({r,c,g:ch.toUpperCase(),on:false});
    else if(ch==="c")cones.push({x:c*T+T/2,y:r*T+T/2,hit:false,vx:0,vy:0,rot:0,spin:0});
    else if(ch==="S")start={x:c*T+T/2,y:r*T+T/2};
    else if(/[1-9]/.test(ch))docks.push({n:+ch,r,c,dir:def.docks[ch]});
    row.push(t)}grid.push(row)}

}
function load(i,showIntro){
  cur=i;L=parse(LEVELS[i]);const a=ANG[LEVELS[i].head];
  Object.assign(S,{t:{x:L.start.x,y:L.start.y,th:a,ph:a,v:0,steer:0},gear:1,moves:0,lastDir:0,time:0,started:false,
    scrapes:0,cones:0,lastHit:-9,dockIdx:0,unload:0,exitOpen:false,phase:showIntro?"intro":"play",rec:[],recAcc:0,
    shake:0,parts:[],toasts:[],clock:0,flash:0,open:{}});

  $("win").hidden=true;$("fail").hidden=true;$("menu").hidden=true;

const retry=()=>load(cur,false);
function toast(text,col){S.toasts.push({text,col,t:0})}
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return m+":"+(s<10?"0":"")+s.toFixed(1)};

/* ---------- update ---------- */
const keys={up:0,down:0,left:0,right:0},touch={gas:0,rev:0,steer:0,on:false};
function update(dt){
  S.clock+=dt;
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt*1.4}
  S.parts=S.parts.filter(p=>p.life>0);
  for(const q of S.toasts)q.t+=dt;S.toasts=S.toasts.filter(q=>q.t<1.8);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*30);
  for(const k of L.cones)if(k.hit){k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=Math.pow(.05,dt);k.vy*=Math.pow(.05,dt);k.rot+=k.spin*dt;k.spin*=Math.pow(.1,dt)}
  const t=S.t,live=S.phase==="play";
  AU.tick(dt,t.v,live);
  if(!live){t.v*=.85;return}

  const thr=(keys.up||touch.gas?1:0)-(keys.down||touch.rev?1:0);
  if(thr)S.gear=thr;
  const target=thr>0?RIG.vF:thr<0?-RIG.vR:0;
  const brake=target===0||(t.v!==0&&Math.sign(target)!==Math.sign(t.v));
  const acc=brake?320:170;
  t.v=t.v<target?Math.min(target,t.v+acc*dt):Math.max(target,t.v-acc*dt);
  const sIn=touch.on?touch.steer:(keys.right?1:0)-(keys.left?1:0);
  const revG=t.v<-1||thr<0,sT=sIn*RIG.maxSteer*(revG?.8:1),rate=sIn===0?(revG?1.6:2.4):(revG?.85:1.3);
  t.steer=t.steer<sT?Math.min(sT,t.steer+rate*dt):Math.max(sT,t.steer-rate*dt);

  let hit=false;const n=4,h=dt/n;
  for(let i=0;i<n;i++){const p={x:t.x,y:t.y,th:t.th,ph:t.ph};integrate(t,t.v,t.steer,h);if(collides(t)){Object.assign(t,p);hit=true;break}}
  if(hit){
    if(S.clock-S.lastHit>.6){S.scrapes++;S.shake=7;AU.thud();toast("Scrape","bad");
      const fp=t.v>0?frontPt(t):rearPt(t);for(let i=0;i<14;i++)S.parts.push({x:fp.x,y:fp.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:1,r:2+Math.random()*3})}
    S.lastHit=S.clock;t.v=0;
  }
  t.th=wrap(t.th);t.ph=wrap(t.ph);

  if(Math.abs(t.v)>8){const d=Math.sign(t.v);if(d!==S.lastDir){S.moves++;S.lastDir=d;S.started=true;if(S.moves>1)AU.blip(220,.08,"square",.05)}}
  if(S.started){S.time+=dt;S.recAcc+=dt;
    while(S.recAcc>=1/30){S.recAcc-=1/30;if(S.rec.length<4*5400)S.rec.push(Math.round(t.x*10)/10,Math.round(t.y*10)/10,Math.round(t.th*1000)/1000,Math.round(t.ph*1000)/1000)}}

  // tire marks + dust
  if(Math.abs(t.v)>15&&Math.abs(t.steer)>.18){
    mctx.fillStyle="rgba(70,52,30,.07)";const c=Math.cos(t.ph),s=Math.sin(t.ph),ta=trAxle(t),ax=ta.x,ay=ta.y;
    mctx.fillRect(ax-s*11-1.5,ay+c*11-1.5,3,3);mctx.fillRect(ax+s*11-1.5,ay-c*11-1.5,3,3);
  }
  if(Math.abs(t.v)>40&&Math.random()<.25){const r=rearPt(t);S.parts.push({x:r.x,y:r.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.7,r:2+Math.random()*2,dust:1})}

  // cones
  const ps=rigPolys(t);
  for(const k of L.cones){if(k.hit)continue;
    if(circPoly(k.x,k.y,7,ps[0])||circPoly(k.x,k.y,7,ps[1])){k.hit=true;S.cones++;
      const a=Math.atan2(k.y-t.y,k.x-t.x);const sp=60+Math.abs(t.v);k.vx=Math.cos(a)*sp;k.vy=Math.sin(a)*sp;k.spin=(Math.random()-.5)*14;
      AU.blip(520,.12,"triangle",.12,260);toast("Cone down","bad")}}

  // pressure plates
  for(const pd of L.pads){if(pd.on)continue;const x0=pd.c*T,y0=pd.r*T;
    const pts=[{x:t.x,y:t.y},trAxle(t),rearPt(t),frontPt(t),{x:t.x+Math.cos(t.th)*RIG.L1,y:t.y+Math.sin(t.th)*RIG.L1}];
    if(pts.some(p=>p.x>x0+3&&p.x<x0+T-3&&p.y>y0+3&&p.y<y0+T-3)){pd.on=true;S.open[pd.g]=true;AU.blip(330,.18,"square",.07,660);toast(`Shutter ${pd.g} lifted`,"good")}}

  // docking

    const d=L.docks[S.dockIdx],r=rearPt(t),x0=d.c*T,y0=d.r*T;
    const inTile=r.x>x0+1&&r.x<x0+T-1&&r.y>y0+1&&r.y<y0+T-1;
    const err=Math.abs(wrap(t.ph-ANG[d.dir]));
    S.align={near:Math.hypot(r.x-x0-T/2,r.y-y0-T/2)<T*1.6,inTile,err,ok:inTile&&err<ALIGN};
    if(inTile&&err<ALIGN&&Math.abs(t.v)<6){S.unload+=dt;
      if(S.unload>=UNLOAD){S.dockIdx++;S.unload=0;S.flash=1;AU.ding();
        if(S.dockIdx>=L.docks.length){S.exitOpen=true;toast("All dropped · gate open","good")}else toast(`Drop ${S.dockIdx} done · next bay ${S.dockIdx+1}`,"good")}}

  }else S.align=null;
  if(S.flash>0)S.flash=Math.max(0,S.flash-dt*1.5);

  // exit

}

  $("fail").hidden=false;$("fRetry").onclick=retry;$("fYards").onclick=openMenu;$("fRetry").focus();

function win(){
  S.phase="won";AU.win();

  const stars=1+(clean?1:0)+(parOk?1:0);

  const newTime=pr.time==null||S.time<pr.time,newMoves=pr.moves==null||S.moves<pr.moves;
  PROG[cur]={stars:Math.max(stars,pr.stars||0),moves:Math.min(S.moves,pr.moves??1e9),time:Math.min(S.time,pr.time??1e9),ghost:better?S.rec.slice():pr.ghost};
  save();
  const rank=["","Yard Hand","Stone Hauler","Dock Master"][stars];

   <li class="ok"><span>Delivered all ${L.docks.length} drop${L.docks.length>1?"s":""}</span><b>${fmt(S.time)}${nb(newTime)}</b></li>
   <li class="${clean?"ok":""}"><span>Clean run</span><b>${S.scrapes} scrape${S.scrapes===1?"":"s"} · ${S.cones} cone${S.cones===1?"":"s"}</b></li>
   <li class="${parOk?"ok":""}"><span>Moves within par</span><b>${S.moves} / ${lv.par}${nb(newMoves)}</b></li>
  </ul>
  <p class="best">${parOk?"":"A move is each change between forward and reverse. Fewer shuffles, more stars. "}${better?"Your ghost now replays this run.":"Your best run stays as the ghost."}</p>
  <div class="row"><button class="btn" id="wRetry">Retry · R</button><button class="btn go" id="wNext">${last?"Yards":"Next yard"} · Enter</button></div></div>`;
  $("win").hidden=false;
  const sp=$("win").querySelectorAll(".starsBig span");sp.forEach((s,i)=>{if(i<stars)setTimeout(()=>{s.classList.add("on");AU.blip(700+i*220,.2,"triangle",.1)},250+i*260)});
  $("wRetry").onclick=retry;$("wNext").onclick=next;$("wNext").focus();
}

/* ---------- guide ---------- */
function guide(){
  const t=S.t,dir=Math.abs(t.v)>5?Math.sign(t.v):S.gear,v=dir>0?80:-45;
  const st={x:t.x,y:t.y,th:t.th,ph:t.ph},pts=[];let bad=null;const steps=dir>0?40:66;
  for(let i=0;i<steps;i++){for(let k=0;k<3;k++)integrate(st,v,t.steer,1/90);pts.push(dir>0?frontPt(st):rearPt(st));
    if(Math.abs(wrap(st.th-st.ph))>RIG.jack){bad="jack";break}if(i%3===2&&collides(st)){bad="wall";break}}
  return {pts,bad,dir,st};
}

  else if(e.code==="KeyG")toggle("guide");else if(e.code==="KeyH")toggle("ghost");else if(e.code==="KeyM")toggle("sound");

});

hold("gas","gas");hold("rev","rev");
const wheel=$("wheel"),knob=$("knob");
function steerAt(e){const r=wheel.getBoundingClientRect();const v=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2-30)));touch.steer=v;knob.style.transform=`translateX(${v*(r.width/2-30)}px) rotate(${v*90}deg)`}
wheel.addEventListener("pointerdown",e=>{e.preventDefault();AU.init();touch.on=true;try{wheel.setPointerCapture(e.pointerId)}catch(_){}steerAt(e)});
wheel.addEventListener("pointermove",e=>{if(touch.on)steerAt(e)});
const wOff=()=>{touch.on=false;touch.steer=0;knob.style.transform=""};
wheel.addEventListener("pointerup",wOff);wheel.addEventListener("pointercancel",wOff);

/* ---------- boot ---------- */
syncTools();fit();
let startAt=LEVELS.findIndex((_,i)=>unlocked(i)&&!(PROG[i]||{}).stars);if(startAt<0)startAt=0;
load(startAt,true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildBg()});
requestAnimationFrame(frame);
})();
