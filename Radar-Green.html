<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#010a04">
<title>Radar Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#010a04; --ink:#62ff96; --ink-dim:#1f7a43; --ink-faint:#0f3d22; --alert:#ff4d3a; --panel:rgba(2,18,8,.94);
  --font:"VT323","Courier New",monospace; --fs:20px;
}
:root[data-mode="atc"]{
  --bg:#0b1116; --ink:#e4edf2; --ink-dim:#7e8f9c; --ink-faint:#25313b; --alert:#ff5a4a; --panel:rgba(12,19,25,.95);
  --font:"Share Tech Mono","Menlo","Consolas",monospace; --fs:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#scope{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#crt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
:root[data-mode="sweep"] #crt{opacity:1;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;font-size:var(--fs);line-height:1.15;
  text-shadow:0 0 6px color-mix(in srgb,var(--ink) 55%,transparent)}
:root[data-mode="atc"] #hud{text-shadow:none}
#hud .r{text-align:right}
#hud .big{font-size:calc(var(--fs) * 1.35)}
#hud .dim{color:var(--ink-dim)}
#feed.sim{color:var(--alert)}
#alert{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 92px);display:none;max-width:560px;margin:0 auto;
  border:1px solid var(--alert);color:var(--alert);background:var(--panel);padding:8px 12px;font:inherit;font-size:var(--fs);
  text-align:left;white-space:pre-line;cursor:pointer;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:transparent}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;gap:6px;justify-content:center;max-width:600px;margin:0 auto}
#barbg{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 80px);pointer-events:none;
  background:linear-gradient(to top,var(--bg) 45%,transparent)}
button,input{font:inherit;font-size:var(--fs);color:var(--ink)}
button{background:var(--panel);border:1px solid var(--ink-dim);min-height:44px;min-width:0;padding:0 6px;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden}
#bar button{flex:1 1 0;padding:0 2px;font-size:clamp(13px,4vw,var(--fs))}
#bar .seg{display:flex;flex:2.4 1 0;min-width:0}
#bar .seg button{border-radius:0}
#bar .seg button:first-child{border-right:none}
button:active{background:var(--ink-faint)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-width:540px;margin:0 auto;
  background:var(--panel);border:1px solid var(--ink-dim);padding:12px 14px;font-size:var(--fs);display:none;max-height:62vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:calc(var(--fs) * 1.45);font-weight:normal;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3{margin:12px 0 6px;font-size:var(--fs);font-weight:normal;color:var(--ink-dim)}
.sheet .x{min-height:36px;padding:0 10px}
#sh-body{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 12px;margin:0}
#sh-body dt{color:var(--ink-dim)} #sh-body dd{margin:0;overflow-wrap:anywhere}
.sheet a{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:1 1 auto}
#find-form{display:flex;gap:6px}
#find-q{flex:1;min-width:0;min-height:44px;background:transparent;border:1px solid var(--ink-dim);padding:0 10px;text-transform:uppercase;border-radius:2px;
  -webkit-user-select:text;user-select:text}
.hint{color:var(--ink-dim);margin:8px 0 0;font-size:calc(var(--fs) * .85)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}
.lg{display:flex;align-items:center;gap:8px;min-height:32px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);
  background:var(--panel);border:1px solid var(--ink-dim);padding:8px 14px;font-size:var(--fs);display:none;width:max-content;max-width:90vw;text-align:center;pointer-events:none}
@media (prefers-reduced-motion: reduce){ #alert{animation:none} }
</style>
</head>
<body>
<canvas id="scope" aria-label="Radar scope of live air traffic, worldwide"></canvas>
<div id="crt"></div>
<div id="hud">
  <div><div class="big" id="site">Spartanburg</div><div class="dim" id="range">—</div></div>
  <div class="r"><div class="big" id="clock">--:--:--</div><div id="utc" class="dim">--:-- UTC</div><div id="count" class="dim">0 aircraft</div><div id="feed" class="dim">Connecting…</div></div>
</div>
<button id="alert" aria-live="assertive"></button>
<div id="barbg"></div>

<section class="sheet" id="plane" aria-live="polite">
  <h2><span id="sh-title">—</span><button class="x" data-close="plane">Close</button></h2>
  <dl id="sh-body"></dl>
  <div class="actions"><button id="follow" aria-pressed="false">Follow</button><button id="history">Flight history</button></div>
</section>

<section class="sheet" id="places">
  <h2>Go to<button class="x" data-close="places">Close</button></h2>
  <div class="grid" id="presets"></div>
  <h3>Show</h3>
  <div class="grid">
    <button id="t-trails" aria-pressed="true">Trails</button>
    <button id="t-labels" aria-pressed="true">Labels</button>
    <button id="t-mil" aria-pressed="false">Military</button>
    <button id="t-sound" aria-pressed="false">Ping sound</button>
  </div>
  <h3>Aircraft</h3>
  <div class="legend" id="legend"></div>
  <h3>Radar site</h3>
  <div class="grid">
    <button id="site-here">Put site at center</button>
    <button id="site-home">Back to Spartanburg</button>
  </div>
</section>

<section class="sheet" id="find">
  <h2>Find a flight<button class="x" data-close="find">Close</button></h2>
  <form id="find-form" autocomplete="off">
    <input id="find-q" name="q" placeholder="DAL1234, N123AB, A1B2C3" aria-label="Callsign, tail number or hex code" enterkeyhint="search" spellcheck="false">
    <button type="submit">Find</button>
  </form>
  <p class="hint">Searches every plane on screen first, then the worldwide feed.</p>
</section>

<div id="toast" role="status"></div>
<nav id="bar">
  <div class="seg" role="group" aria-label="Display style">
    <button id="m-sweep" aria-pressed="true">Sweep</button><button id="m-atc" aria-pressed="false">ATC</button>
  </div>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="b-places">Go</button>
  <button id="b-find">Find</button>
  <button id="locate" aria-pressed="false">Me</button>
</nav>

  for (const p of visible) {
    const X = p.sx, Y = p.sy;
    const em = isEmergency(p), sel = p === selected, gnd = p.alt === "ground";
    const col = em ? (flash ? C.alert : "#ffffff") : sel ? "#7fe7ff" : p.mil ? "#ffd36e" : gnd ? "rgba(200,215,225,.45)" : "#e4edf2";
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1;
    if (small && !em && !sel) { ctx.fillRect(X - 1, Y - 1, 2, 2); continue; }
    if (showTrail) for (let i = 0; i < p.hist.length; i++) {
      const h = p.hist[i]; ctx.fillStyle = `rgba(110,170,220,${0.15 + 0.6 * (i + 1) / p.hist.length})`;
      ctx.fillRect(sx(wrapX(h[0])) - 1.5, sy(mY(h[1])) - 1.5, 3, 3);
    }
    ctx.fillStyle = col;
    if (p.gs > 40 && p.trk != null && !gnd) {
      const a = p.trk * D2R, d = Math.max(6, Math.min(60, p.gs / 60 * ppn));
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X + Math.sin(a) * d, Y - Math.cos(a) * d); ctx.stroke();
    }
    if (!p.heard) { p.heard = true; if (now - bootAt > 6000) ping(p, n); }
    if (n <= 700) drawCraft(ctx, kind(p), X, Y, p.trk, n > 300 ? 0.7 : n > 120 ? 0.85 : 1.05, col, now);
    else { const k = 2.5; ctx.beginPath(); ctx.moveTo(X, Y - k); ctx.lineTo(X + k, Y); ctx.lineTo(X, Y + k); ctx.lineTo(X - k, Y); ctx.closePath(); gnd ? ctx.stroke() : ctx.fill(); }
    if (em || sel || showLabels) {
      const l1 = label(p);
      const l2 = altText(p) + (vrArrow(p) || " ") + " " + (p.gs != null ? String(Math.round(p.gs / 10)).padStart(2, "0") : "--");
      const l3 = em ? "SQ " + p.sq : p.mil ? "MIL " + (p.type || "") : (p.type || "");
      const bw = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width, 40);
      if (em || sel || fits(X + 16, Y - 40, bw + 4, 42)) {
        ctx.beginPath(); ctx.moveTo(X + 8, Y - 8); ctx.lineTo(X + 16, Y - 16); ctx.stroke();
        ctx.fillText(l1, X + 18, Y - 28); ctx.fillText(l2, X + 18, Y - 15); if (l3) ctx.fillText(l3, X + 18, Y - 2);
      }
    }
    if (sel) ctx.strokeRect(X - 13, Y - 13, 26, 26);
  }
  const X0 = sx(wrapX(site.lon)), Y0 = sy(mY(site.lat));
  ctx.strokeStyle = "rgba(200,215,225,.7)"; ctx.beginPath(); ctx.moveTo(X0 - 5, Y0); ctx.lineTo(X0 + 5, Y0); ctx.moveTo(X0, Y0 - 5); ctx.lineTo(X0, Y0 + 5); ctx.stroke();
}
function drawMe() {
  if (!me) return;
  const X = sx(wrapX(me.lon)), Y = sy(mY(me.lat)), r = me.acc / 1852 * pxPerNm(me.lat);
  ctx.strokeStyle = prefs.mode === "sweep" ? "rgba(255,230,120,.9)" : "rgba(255,210,90,.95)"; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1.5;
  if (r > 6) { ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.beginPath(); ctx.arc(X, Y, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(X, Y, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.font = `${prefs.mode === "sweep" ? 16 : 11}px ${C.font}`; ctx.textBaseline = "middle"; ctx.fillText("You", X + 9, Y);
}

// ================= HUD, alerts, details =================
function distBrg(lat, lon) {
  const p1 = site.lat * D2R, p2 = lat * D2R, dl = (lon - site.lon) * D2R;
  const d = Math.acos(Math.min(1, Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl))) / D2R * 60;
  const b = (Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) / D2R + 360) % 360;
  return [d, b];
}
let lastAlertKey = "", alertTarget = null;
function updateAlerts() {
  const em = [...planes.values()].filter(isEmergency);
  const key = em.map(p => p.hex + p.sq).join();
  if (key === lastAlertKey) return; lastAlertKey = key;
  const box = $("alert");
  if (!em.length) { box.style.display = "none"; alertTarget = null; return; }
  const what = { "7700": "emergency", "7600": "radio failure", "7500": "hijack code" };
  em.sort((a, b) => distBrg(a.lat, a.lon)[0] - distBrg(b.lat, b.lon)[0]);
  alertTarget = em[0];
  const lines = em.slice(0, 3).map(p => {
    const [d, b] = distBrg(p.lat, p.lon);
    return `${label(p)} squawking ${p.sq || "emergency"} (${what[p.sq] || p.em || "emergency"}), ${Math.round(d).toLocaleString()} nm at ${String(Math.round(b)).padStart(3, "0")}°`;
  });
  if (em.length > 3) lines.push(`+${em.length - 3} more worldwide`);
  box.textContent = lines.join("\n");
  box.style.display = "block";
}
$("alert").onclick = () => { if (alertTarget && planes.has(alertTarget.hex)) select(alertTarget, true); };

const KIND_NAME = { light: "Small plane", jet: "Jet", heavy: "Heavy jet", fighter: "Military jet", heli: "Helicopter", balloon: "Balloon", drone: "Drone", ground: "Ground vehicle" };
function fmt(v, unit, dig = 0) { return v == null || v === "" ? "—" : (typeof v === "number" ? v.toFixed(dig) : v) + (unit || ""); }
function select(p, zoom) {
  selected = p; following = false; $("follow").setAttribute("aria-pressed", "false");
  if (p && zoom) goTo(p.wlat ?? p.lat, p.wlon ?? p.lon, Math.min(rangeNm(), 60));
  openSheet(p ? "plane" : null); renderDetails();
}
function renderDetails() {
  if (!selected) return;
  if (!planes.has(selected.hex)) { selected = null; following = false; openSheet(null); return; }
  const p = selected, [d, b] = distBrg(p.wlat ?? p.lat, p.wlon ?? p.lon);
  $("sh-title").textContent = label(p) + (p.mil ? "  MIL" : "");
  const rows = [
    ["Alt", p.alt === "ground" ? "On ground" : fmt(p.alt, " ft")], ["Speed", fmt(p.gs, " kt")],
    ["Climb", p.vr == null ? "—" : (p.vr > 0 ? "+" : "") + Math.round(p.vr) + " fpm"], ["Track", p.trk == null ? "—" : Math.round(p.trk) + "°"],
    ["Type", p.type || "—"], ["Reg", p.reg || "—"], ["Squawk", p.sq || "—"], ["Hex", p.hex.toUpperCase()],
    ["From site", `${d < 100 ? d.toFixed(1) : Math.round(d).toLocaleString()} nm at ${String(Math.round(b)).padStart(3, "0")}°`]
  ];
  rows.push(["Kind", KIND_NAME[kind(p)]]);
  if (p.country) rows.push(["Country", p.country]);
  if (p.desc) rows.push(["Aircraft", p.desc]);
  const dl = $("sh-body"); dl.textContent = "";
  for (const [k, v] of rows) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; if (v.length > 14) dd.style.gridColumn = "2 / -1"; dl.append(dt, dd); }
  $("history").style.display = sim ? "none" : "";
}
$("follow").onclick = e => { following = !following; e.currentTarget.setAttribute("aria-pressed", following); if (following && selected) goTo(selected.wlat, selected.wlon, Math.min(rangeNm(), 60)); };
$("history").onclick = () => { if (selected) window.open(`https://globe.adsb.lol/?icao=${selected.hex}`, "_blank", "noopener"); };

function openSheet(id) {
  for (const s of document.querySelectorAll(".sheet")) s.style.display = s.id === id ? "block" : "none";
  if (id !== "plane" && selected && id) { selected = null; following = false; }
}
for (const b of document.querySelectorAll("[data-close]")) b.onclick = () => { if (b.dataset.close === "plane") { selected = null; following = false; } openSheet(null); };

setInterval(() => {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour12: false });
  $("utc").textContent = d.toISOString().slice(11, 16) + " UTC";
  $("count").textContent = `${visible.length.toLocaleString()} in view`;
  if (!sim && wide.at && feedText.startsWith("Live: OpenSky")) {
    const age = Math.round((Date.now() - wide.at) / 1000);
    setFeed(`Live: OpenSky, ${age < 60 ? age + "s" : Math.round(age / 60) + "m"} old`, false);
  }
  updateAlerts();
  if (selected) renderDetails();
}, 1000);

let toastT = 0;
function toast(msg, ms = 3500) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", ms); }

// ================= places, layers, site =================
const PRESETS = [
  ["Spartanburg", HOME.lat, HOME.lon, 25], ["GSP airport", 34.8957, -82.2189, 12], ["Atlanta", 33.6407, -84.4277, 40],
  ["United States", 39, -96, 1500], ["Europe", 50, 10, 1100], ["East Asia", 33, 125, 1600],
  ["Middle East", 26, 50, 900], ["North Atlantic", 52, -35, 1300], ["Whole world", 25, -40, 9000]
];
for (const [n, la, lo, r] of PRESETS) {
  const b = document.createElement("button"); b.textContent = n;
  b.onclick = () => { following = false; goTo(la, lo, r); openSheet(null); };
  $("presets").append(b);
}
function syncToggles() {
  $("t-sound").setAttribute("aria-pressed", prefs.sound);
  $("t-trails").setAttribute("aria-pressed", prefs.trails); $("t-labels").setAttribute("aria-pressed", prefs.labels); $("t-mil").setAttribute("aria-pressed", prefs.mil);
}
$("t-sound").onclick = () => {
  prefs.sound = !prefs.sound; savePrefs(); syncToggles();
  if (prefs.sound) { ensureAudio(); if (audio) { tone(1100, audio.currentTime + 0.02, 0.45, 0.07, "sine", 0.82); toast("Pings on. Each plane pings as the sweep hits it, or as it appears in ATC view."); } else toast("This browser can't play sound."); }
};
// phones only allow sound after a tap, so wake it on the first touch if it was left on
addEventListener("pointerdown", () => { if (prefs.sound) ensureAudio(); }, { capture: true });
function drawLegend() {
  const box = $("legend"); box.textContent = "";
  const col = prefs.mode === "sweep" ? "rgb(120,255,165)" : "#e4edf2";
  for (const k of ["light", "jet", "heavy", "heli", "fighter", "balloon", "drone", "ground"]) {
    const item = document.createElement("div"); item.className = "lg";
    const c = document.createElement("canvas"); c.width = 56; c.height = 56; c.style.width = c.style.height = "28px";
    const g = c.getContext("2d"); g.scale(2, 2); drawCraft(g, k, 14, 14, k === "drone" || k === "balloon" ? 0 : 45, 1.1, col, 600);
    const t = document.createElement("span"); t.textContent = KIND_NAME[k];
    item.append(c, t); box.append(item);
  }
}
$("t-trails").onclick = () => { prefs.trails = !prefs.trails; savePrefs(); syncToggles(); };
$("t-labels").onclick = () => { prefs.labels = !prefs.labels; savePrefs(); syncToggles(); };
$("t-mil").onclick = () => {
  prefs.mil = !prefs.mil; savePrefs(); syncToggles(); lastMil = 0;
  if (!prefs.mil) for (const [k, p] of planes) if (p.mil && p.src === "local") p.ttl = 0;
  toast(prefs.mil ? "Military aircraft worldwide now show in gold." : "Military layer off.");
};
function setSite(lat, lon, name) { site = { lat, lon, name }; $("site").textContent = name; mapDirty = true; }
$("site-here").onclick = () => { setSite(centerLat(), wrapX(view.cx), "Custom site"); openSheet(null); };
$("site-home").onclick = () => { setSite(HOME.lat, HOME.lon, HOME.name); goTo(HOME.lat, HOME.lon, 25); openSheet(null); };
$("b-places").onclick = () => openSheet($("places").style.display === "block" ? null : "places");
$("b-find").onclick = () => { const open = $("find").style.display === "block"; openSheet(open ? null : "find"); if (!open) setTimeout(() => $("find-q").focus(), 50); };

// ================= find =================
$("find-form").onsubmit = async e => {
  e.preventDefault();
  const q = $("find-q").value.trim().toUpperCase().replace(/\s+/g, "");
  if (!q) return;
  const m = [...planes.values()].find(p => (p.flight || "").toUpperCase() === q || (p.reg || "").toUpperCase().replace("-", "") === q.replace("-", "") || p.hex.toUpperCase() === q)
         || [...planes.values()].find(p => (p.flight || "").toUpperCase().startsWith(q));
  if (m) { $("find-q").blur(); select(m, true); return; }
  if (sim) { toast(`No simulated flight called ${q}.`); return; }
  toast(`Searching for ${q}…`, 8000);
  const tries = /^[0-9A-F]{6}$/.test(q) ? ["hex", "cs", "reg"] : ["cs", "reg"];
  for (const k of tries) {
    const got = await community(k, k === "hex" ? q.toLowerCase() : q);
    if (got && got.list.length) {
      ingest(got.list, "local", 120000);
      const p = planes.get(got.list[0].hex);
      if (p) { $("find-q").blur(); p.wlat = p.lat; p.wlon = p.lon; select(p, true); toast(`Found ${label(p)}.`); return; }
    }
  }
  toast(`Nothing is broadcasting as ${q} right now.`, 5000);
};

// ================= location =================
function locate() {
  const btn = $("locate");
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; me = null; btn.setAttribute("aria-pressed", "false"); setSite(HOME.lat, HOME.lon, HOME.name); return; }
  if (!navigator.geolocation) { toast("This browser can't share location."); return; }
  toast("Finding you…");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    me = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy || 50 };
    btn.setAttribute("aria-pressed", "true"); setSite(me.lat, me.lon, "You");
    if (first) { first = false; goTo(me.lat, me.lon, 25); toast("Radar now centered on you."); }
  }, err => {
    watchId = null; btn.setAttribute("aria-pressed", "false");
    toast(err.code === 1 ? "Location is blocked. Allow it for this page in your browser settings, then tap Me again." : "Couldn't get a location fix. Try again with Wi-Fi on.", 6000);
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
$("locate").onclick = locate;

// ================= input =================
const ptrs = new Map(); let pinch = null, downAt = null, moved = 0;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { downAt = { t: performance.now() }; moved = 0; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
cv.addEventListener("pointermove", e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  if (ptrs.size === 1) {
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 8) { if (following) { following = false; $("follow").setAttribute("aria-pressed", "false"); }
      view.cx -= dx / view.s; view.cy += dy / view.s; clampView(); mapDirty = true; viewMoved(); }
  }
  ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch.d = d; moved = 99;
  }
});
function up(e) {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0 && downAt && moved < 10 && performance.now() - downAt.t < 450) pickAt(e.clientX, e.clientY);
  if (ptrs.size === 0) downAt = null;
}
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
function pickAt(x, y) {
  let best = null, bd = 28;
  for (const p of visible) { if (p.sx == null) continue; const d = Math.hypot(p.sx - x, p.sy - y); if (d < bd) { bd = d; best = p; } }
  if (best) select(best, false); else if (selected) { selected = null; following = false; openSheet(null); }
}
function setMode(m) {
  prefs.mode = m; savePrefs();
  document.documentElement.dataset.mode = m;
  $("m-sweep").setAttribute("aria-pressed", m === "sweep"); $("m-atc").setAttribute("aria-pressed", m === "atc");
  readColors(); mapDirty = true; drawLegend();
}
$("m-sweep").onclick = () => setMode("sweep");
$("m-atc").onclick = () => setMode("atc");
$("zin").onclick = () => zoomAt(1.8, W / 2, H / 2);
$("zout").onclick = () => zoomAt(1 / 1.8, W / 2, H / 2);
addEventListener("resize", () => { const r = rangeNm(); resize(); goTo(centerLat(), view.cx, r); });

// ================= boot =================
resize(); setMode(prefs.mode === "atc" ? "atc" : "sweep"); syncToggles();
goTo(HOME.lat, HOME.lon, 2400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); mapDirty = true; });
requestAnimationFrame(frame);
tick();

</script>
