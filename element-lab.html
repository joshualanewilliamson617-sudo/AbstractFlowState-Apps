<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Element Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --base:#12151A; --panel:#191D24; --panel2:#1F242C; --rule:#262D37; --rule2:#333C48;
  --tx:#D2D7DE; --tx2:#8A94A2; --tx3:#5E6774;
  --straw:#EBC96E; --bronze:#C97A3B; --violet:#8E5A9E; --heat:#4A79B5; --cyan:#57C9BC;
  --sans:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --cs:14px; --cz:9px; --cp:3px; --cg:2px; --tp:14px; --lg:12px; --heroS:clamp(46px,6.4vw,96px);
}
@media(max-height:900px){:root{--cs:12.5px;--cz:8px;--cp:2px;--cg:2px;--tp:10px;--lg:11px;--heroS:clamp(40px,5vw,72px)}}
@media(max-height:800px){:root{--cs:11.5px;--cz:7.5px;--cp:1px;--cg:1.5px;--tp:8px;--lg:10.5px;--heroS:clamp(34px,4.4vw,60px)}}
@media(max-height:700px){:root{--cs:10.5px;--cz:0px;--cp:1px;--cg:1.5px;--tp:6px;--lg:10px;--heroS:clamp(30px,4vw,50px)}
  .cell .z{display:none} #legend{padding-bottom:7px}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--base);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#errBar{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#2A1712;border:1px solid #7A4028;
  border-radius:8px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#F0C3A8;
  box-shadow:0 8px 28px rgba(0,0,0,.6)}
#errBar[hidden]{display:none}
#errMsg{flex:1;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:150px;overflow:auto}
#errBar button{border:1px solid #7A4028;border-radius:5px;padding:4px 10px;font-size:12px;color:#F0C3A8;flex:none}
#errBar button:hover{background:#3A2018}

#app{display:flex;flex-direction:column;height:100%}

/* ---- periodic table ---- */
#tableWrap{border-bottom:1px solid var(--rule);background:var(--panel);flex:none;transition:max-height .28s ease;overflow:hidden;max-height:min(430px,44vh)}
#tableWrap.closed{max-height:0;border-bottom-color:transparent}
#ptable{display:grid;grid-template-columns:repeat(18,1fr);gap:var(--cg);padding:var(--tp) 18px 6px;max-width:1500px;margin:0 auto}
.cell{border-radius:3px;padding:var(--cp) 0 calc(var(--cp) + 1px);text-align:center;line-height:1.05;cursor:pointer;border:1px solid transparent;transition:transform .1s}
.cell .z{font-size:var(--cz);font-family:var(--mono);opacity:.6;line-height:1.1}
.cell .sy{font-size:var(--cs);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.cell:hover{transform:scale(1.14);z-index:5;position:relative;border-color:var(--tx)}
.cell.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--base),0 0 0 3px var(--tx)}
.cell.dim{opacity:.15}
.gap{grid-column:3;display:flex;align-items:center;justify-content:center;font-size:max(8px,var(--cz));font-family:var(--mono);color:var(--tx3);border:1px dashed var(--rule2);border-radius:3px}
#legend{display:flex;flex-wrap:wrap;gap:2px 13px;padding:2px 18px 10px;max-width:1500px;margin:0 auto}
.lgi{display:flex;align-items:center;gap:5px;font-size:var(--lg);color:var(--tx2);padding:1px 0}
.lgi .sw{width:10px;height:10px;border-radius:2px}
.lgi.on{color:var(--tx)}

/* ---- header bar ---- */
#bar{display:flex;align-items:center;gap:10px;padding:7px 16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);flex:none;background:var(--panel)}
#bar .brand{font-weight:600;letter-spacing:-.02em;font-size:16px}
#bar .brand span{color:var(--tx3);font-weight:400}
#search{flex:1;max-width:260px;background:var(--panel2);border:1px solid var(--rule2);border-radius:5px;padding:5px 10px;color:var(--tx);font-family:inherit;font-size:13px}
#search::placeholder{color:var(--tx3)}
.tbtn{padding:5px 11px;border:1px solid var(--rule2);border-radius:5px;font-size:13px;color:var(--tx2)}
.tbtn:hover{color:var(--tx);border-color:var(--tx3)}
.tbtn.on{color:var(--base);background:var(--tx);border-color:var(--tx)}

/* ---- main split ---- */
#main{flex:1;display:flex;min-height:0}
#stage,#pane{min-height:230px}
#stage{width:52%;min-width:300px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 45%,#1A1F27 0%,#0D1014 70%);display:flex;flex-direction:column}
#canvasHost{flex:1;position:relative;min-height:140px}
#canvasHost canvas{display:block;width:100%;height:100%}
#hero{position:absolute;left:22px;top:14px;pointer-events:none;z-index:2}
#hero .sym{font-size:var(--heroS);font-weight:600;line-height:.86;letter-spacing:-.05em}
#hero .nm{font-size:19px;font-weight:500;margin-top:6px}
#hero .meta{font-family:var(--mono);font-size:12px;color:var(--tx2);margin-top:2px}
#modes{display:flex;gap:2px;padding:6px 10px;border-top:1px solid var(--rule);background:var(--panel);flex-wrap:wrap;flex:none}
.mode{padding:4px 11px;border-radius:5px;font-size:13px;color:var(--tx2);white-space:nowrap}
.mode:hover{color:var(--tx);background:var(--panel2)}
.mode.on{color:var(--base);background:var(--straw);font-weight:500}
#subMode{padding:0 10px 6px;background:var(--panel);flex:none}
.subRow{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:thin}
.subRow::-webkit-scrollbar{height:5px}
.subLab{font-size:11px;color:var(--tx3);align-self:center;flex:none;margin-right:4px;min-width:58px}
.sub{font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--rule2);border-radius:4px;color:var(--tx2);white-space:nowrap;flex:none}
.sub.on{background:var(--rule2);color:var(--tx)}
#stageNote{position:absolute;left:26px;right:14px;bottom:12px;font-size:11px;line-height:1.5;font-family:var(--mono);color:var(--tx3);text-align:left;pointer-events:none;white-space:pre-line;text-shadow:0 1px 3px #0B0E12,0 0 8px #0B0E12}

/* ---- right pane ---- */
#pane{flex:1;display:flex;flex-direction:column;border-left:1px solid var(--rule);min-width:0}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);flex:none;background:var(--panel);overflow-x:auto}
.tab{padding:9px 14px;font-size:14px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--straw)}
#paneBody{flex:1;overflow-y:auto;padding:20px 24px 56px}
.view{display:none}
.view.on{display:block}

h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px}
h3{font-size:15px;font-weight:600;margin:26px 0 8px}
h3:first-child{margin-top:0}
p{margin:0 0 13px;max-width:74ch;color:#C3C9D1}
.sec{margin-bottom:26px}
.dim{color:var(--tx2)}
.small{font-size:13px}

/* facts grid */
#facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:24px}
.fact{background:var(--panel);padding:9px 11px}
.fact .k{font-size:11px;color:var(--tx3);line-height:1.3}
.fact .v{font-family:var(--mono);font-size:14px;color:var(--tx);margin-top:2px}
.fact .v small{font-size:11px;color:var(--tx2)}

/* controls */
.ctl{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ctl label{font-size:13px;color:var(--tx2);flex:none;min-width:96px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--rule2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--tx);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--tx);cursor:pointer}
.rd{font-family:var(--mono);font-size:13px;min-width:78px;text-align:right;flex:none}
select,input[type=text]{background:var(--panel2);border:1px solid var(--rule2);border-radius:5px;padding:6px 9px;color:var(--tx);font-family:inherit;font-size:13px}
.btn{padding:7px 14px;border:1px solid var(--rule2);border-radius:5px;font-size:13px;color:var(--tx)}
.btn:hover{background:var(--panel2);border-color:var(--tx3)}
.btn.pri{background:var(--straw);color:#1A1206;border-color:var(--straw);font-weight:500}
.btn.pri:hover{background:#F2D583}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:15px 17px;margin-bottom:14px}
.card h4{font-size:14px;font-weight:600;margin:0 0 7px}
.err{color:#E0885F;font-size:13px}
.pill{display:inline-block;font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:3px;border:1px solid var(--rule2);color:var(--tx2)}

/* phase bar */
#phaseBar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--rule2);margin:6px 0 4px;position:relative}
#phaseBar>div{display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);min-width:0;overflow:hidden}
#phaseMark{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--tx);box-shadow:0 0 0 1.5px var(--base);border-radius:1px}
#spectrum,#thermoCv,#reactCv{width:100%;border-radius:6px;border:1px solid var(--rule);display:block;background:#07090C}

/* loading */
.load{display:inline-block;width:11px;height:11px;border:2px solid var(--rule2);border-top-color:var(--straw);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:11px;background:linear-gradient(90deg,var(--rule) 25%,var(--rule2) 50%,var(--rule) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:3px;margin:9px 0}
@keyframes sh{to{background-position:-200% 0}}

@media(max-width:1040px){
  #stage{width:45%;min-width:260px}
  #search{max-width:180px}
}
@media(max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{flex-direction:column}
  #stage{width:100%;height:auto;min-height:420px}
  #canvasHost{height:340px;flex:none}
  #pane{border-left:none;border-top:1px solid var(--rule);min-height:520px}
  #paneBody{padding:18px;overflow:visible}
  #tableWrap{max-height:none}
  :root{--cs:11px;--cz:0px}
  .cell .z{display:none}
  #search{max-width:none;flex:1 1 140px;order:5}
}
@media(max-height:620px) and (min-width:821px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh}
  #main{min-height:520px}
}
</style>
</head>

  <div id="pane">

    </div>
    <div id="paneBody">
      <div class="view on" id="v-read"></div>
      <div class="view" id="v-data"></div>
      <div class="view" id="v-thermal"></div>
      <div class="view" id="v-spectra"></div>
      <div class="view" id="v-combine"></div>
      <div class="view" id="v-react"></div>
      <div class="view" id="v-learn"></div>
    </div>
  </div>
</div>
</div>

function configOf(z){
  let rem=z,out=[];
  for(const [orb,cap] of AUFBAU){ if(rem<=0)break; const k=Math.min(cap,rem); out.push([orb,k]); rem-=k; }
  if(CFGEX[z]){
    const s=CFGEX[z].replace(/\[(\w+)\]\s*/,(m,sy)=>{
      const zc=NOBLE.find(n=>n[1]===sy)[0];
      return configOf(zc).map(o=>o[0]+o[1]).join(" ")+" ";
    });
    out=s.trim().split(/\s+/).map(t=>[t.slice(0,2),parseInt(t.slice(2))]);
  }
  return out;
}
const OKEY=o=>parseInt(o[0])*10+"spdf".indexOf(o[1]);
const sortOrb=a=>a.slice().sort((x,y)=>OKEY(x[0])-OKEY(y[0]));
function configStr(z,shortForm){
  const full=configOf(z);
  if(shortForm){
    let core=null;
    for(let i=NOBLE.length-1;i>=0;i--) if(NOBLE[i][0]<z){core=NOBLE[i];break;}
    if(core){
      const cm={}; configOf(core[0]).forEach(o=>cm[o[0]]=(cm[o[0]]||0)+o[1]);
      const rest=[];
      full.forEach(o=>{ const take=Math.min(cm[o[0]]||0,o[1]); cm[o[0]]=(cm[o[0]]||0)-take;
        if(o[1]-take>0) rest.push([o[0],o[1]-take]); });
      return "["+core[1]+"] "+sortOrb(rest).map(o=>o[0]+o[1]).join(" ");
    }
  }
  return sortOrb(full).map(o=>o[0]+o[1]).join(" ");
}
function shellsOf(z){
  const sh=[0,0,0,0,0,0,0];
  configOf(z).forEach(([orb,k])=>{ sh[parseInt(orb[0])-1]+=k; });
  return sh.filter(x=>x>0);
}
function valenceOf(z){
  const cfg=configOf(z), maxN=Math.max(...cfg.map(o=>parseInt(o[0][0])));
  return cfg.filter(o=>parseInt(o[0][0])===maxN||(o[0][1]==="d"&&parseInt(o[0][0])===maxN-1&&o[1]<10))
            .reduce((a,o)=>a+o[1],0);
}
function BLOCK(z){
  const e=EL[z-1];
  if(z===2) return "s";
  if(e.cat===9||e.cat===10) return "f";
  if(e.group<=2) return "s";
  if(e.group<=12) return "d";
  return "p";
}

/* valley-of-stability trend estimate */
function stabilityGuess(z,n){
  const target=z<=20? z*1.0 : z*(1+0.0072*Math.pow(z,0.86))*1.0;
  const d=n-target;
  const w=Math.max(1.6,z*0.075);
  if(z>82) return {label:"radioactive",note:"every isotope above bismuth decays"};
  if(Math.abs(d)<=w*0.55) return {label:"likely stable",note:"sits near the valley of stability"};
  if(Math.abs(d)<=w*1.4) return {label:"unstable",note:d>0?"neutron-rich — beta minus decay":"proton-rich — beta plus or electron capture"};
  return {label:"very unstable",note:d>0?"far neutron-rich — short half-life":"far proton-rich — short half-life"};
}

/* ============================================================
   REACTIVITY RULES
   ============================================================ */
function reactRule(e,medium){
  const c=e.cat, g=e.group;
  const V=(v,t,x)=>({vigor:v,title:t,text:x});
  if(medium==="water"){
    if(c===1) return V(e.z>=19?5:(e.z>=11?4:3),"Reacts vigorously",
      "Alkali metals displace hydrogen from water, producing the hydroxide and hydrogen gas. Reactivity climbs sharply down the group as the outer electron gets further from the nucleus and easier to lose — lithium fizzes, sodium melts into a ball and skitters, potassium ignites the hydrogen, caesium is explosive on contact.");
    if(c===2) return V(e.z>=38?3:(e.z>=20?2:1),"Slow to moderate",
      "Alkaline earth metals react with water but far less dramatically than group 1. Magnesium barely touches cold water and needs steam; calcium fizzes steadily; strontium and barium react briskly. All give the hydroxide plus hydrogen.");
    if(c===7) return V(3,"Dissolves and reacts","Halogens dissolve in water and partly react to give a mix of the hydrohalic acid and the hypohalous acid. Chlorine water is the classic disinfectant chemistry.");
    if(c===8) return V(0,"No reaction","Noble gases have full outer shells and do not react with water. They dissolve very slightly, and that is all.");
    if(c===3||c===4) return V(1,"Little to none","Most transition and post-transition metals are unreactive with water at room temperature. Iron will slowly corrode if oxygen is also present — rusting is a water-plus-oxygen process, not water alone.");
    return V(1,"Little to none","No significant reaction with water under ordinary conditions.");
  }
  if(medium==="acid"){
    if(c===1||c===2) return V(5,"Violent","Reactive metals attack acid faster than they attack water — the same displacement reaction with a much higher concentration of hydrogen ions. Do not do this deliberately with group 1.");
    if(c===8) return V(0,"No reaction","Noble gases are inert to acids.");
    if(["Au","Pt","Ir","Rh","Ru","Os"].includes(e.sym)) return V(0,"Resists",
      "Noble metals sit below hydrogen in the reactivity series and are not attacked by single acids. Gold and platinum need aqua regia — nitric plus hydrochloric — where the chloride ions stabilise the dissolved metal and let the reaction proceed.");
    if(c===3||c===4) return V(3,"Dissolves with hydrogen","Metals above hydrogen in the reactivity series displace it from acid, giving the salt and hydrogen gas. Rate depends on how far above hydrogen the metal sits.");
    return V(1,"Little effect","Nonmetals generally do not react with dilute acids this way.");
  }
  if(medium==="air"){
    if(c===1) return V(4,"Tarnishes instantly","Cut a piece of sodium or potassium and the bright surface clouds over in seconds. These metals are stored under oil precisely because air attacks them that fast.");
    if(c===8) return V(0,"Inert","No reaction with oxygen or nitrogen.");
    if(e.sym==="Al"||e.sym==="Cr"||e.sym==="Ti") return V(2,"Passivates",
      "Reacts immediately with oxygen but the oxide it forms is dense and tightly bonded, sealing the surface after a few nanometres. This self-limiting film is why these metals behave as if they were unreactive.");
    if(e.sym==="Fe") return V(3,"Corrodes progressively","With moisture present, iron oxidises to hydrated iron(III) oxide. Rust occupies more volume than the metal it came from, so it flakes off and exposes fresh surface — corrosion continues instead of stopping.");
    if(c===3||c===4) return V(2,"Slow oxidation","Forms an oxide layer over time. Whether that layer protects or flakes decides the metal's corrosion behaviour.");
    return V(1,"Varies","Behaviour in air depends on the specific element and conditions.");
  }
  if(medium==="flame"){
    const f=FLAME[e.sym];
    if(f) return V(3,"Distinct flame colour",
      "Heat drives outer electrons to higher orbitals; they fall back and release the energy difference as light at fixed wavelengths. For "+e.name+" the visible result is "+f[0].toLowerCase()+". This is the same physics as the emission spectrum, just seen by eye instead of through a grating.");
    if(c===8) return V(1,"Glows under discharge","Noble gases do not burn, but pass a current through them at low pressure and they glow with their characteristic colour.");
    return V(1,"No characteristic colour","No strong visible flame test — either the emission lines fall outside the visible band or they are too weak to see against the flame.");
  }
  return V(0,"","");
}

async function callAPI(body,extraHeaders){
  const h={"Content-Type":"application/json"};
  if(extraHeaders){ h["anthropic-version"]="2023-06-01"; h["anthropic-dangerous-direct-browser-access"]="true"; }
  let r;
  try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify(body)}); }
  catch(e){ const err=new Error("NETWORK"); err.detail=e.message; throw err; }
  if(!r.ok){
    let t=""; try{ t=(await r.text()).slice(0,300); }catch(e){}
    const err=new Error("HTTP "+r.status); err.detail=t; err.status=r.status; throw err;
  }
  return r.json();
}
async function askClaude(prompt,maxTok){
  if(AICACHE[prompt]) return AICACHE[prompt];
  const body={model:"claude-sonnet-4-6",max_tokens:maxTok||1000,messages:[{role:"user",content:prompt}]};
  let d;
  try{ d=await callAPI(body,false); }
  catch(e1){
    try{ d=await callAPI(body,true); }
    catch(e2){
      const why = e1.message==="NETWORK"
        ? "The page could not reach api.anthropic.com. This usually means the file is open outside Claude \u2014 the generated writeups only work while it runs inside a Claude artifact."
        : "The API returned "+e1.message+(e1.detail?" \u2014 "+e1.detail:"");
      setAIState("off",why);
      const err=new Error(why); err.offline=true; throw err;
    }
  }
  setAIState("ok","");
  const txt=d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
  AICACHE[prompt]=txt; return txt;
}

  return JSON.parse(st>=0?clean.slice(st,e2+1):clean);

/* Resize is coalesced into one animation frame so an observer callback can never
   trigger another synchronous layout pass. */
function applyResize(){
  try{
    if(!HAS3D||!renderer||!camera) return;
    const w=host.clientWidth,h=host.clientHeight;
    if(!w||!h||!isFinite(w)||!isFinite(h)) return;
    if(renderer.domElement.width===Math.floor(w*renderer.getPixelRatio())&&
       renderer.domElement.height===Math.floor(h*renderer.getPixelRatio())) return;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }catch(e){ showErr("Resize failed: "+e.message); }
}
/* cancel-and-reschedule, so a frame that never arrives cannot strand the handler */
let rzId=0;
function resize(){

}
if(typeof ResizeObserver!=="undefined"){

}

function clearRoot(){
  if(!root) return;
  while(root.children.length){
    const c=root.children.pop();
    c.traverse&&c.traverse(o=>{o.geometry&&o.geometry.dispose();
      if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m&&m.dispose&&m.dispose());}});
  }
}

  }
}

/* ---------- math for orbitals ---------- */
function laguerre(k,a,x){
  if(k===0)return 1; if(k===1)return 1+a-x;
  let l0=1,l1=1+a-x;
  for(let i=1;i<k;i++){ const l2=((2*i+1+a-x)*l1-(i+a)*l0)/(i+1); l0=l1; l1=l2; }
  return l1;
}
function radial(n,l,r){
  const rho=2*r/n;
  return Math.pow(rho,l)*Math.exp(-rho/2)*laguerre(n-l-1,2*l+1,rho);
}
const ANG={
  "s":[["s",(th,ph)=>1]],
  "p":[["pz",(t,p)=>Math.cos(t)],["px",(t,p)=>Math.sin(t)*Math.cos(p)],["py",(t,p)=>Math.sin(t)*Math.sin(p)]],
  "d":[["dz²",(t,p)=>3*Math.cos(t)**2-1],["dxz",(t,p)=>Math.sin(t)*Math.cos(t)*Math.cos(p)],
       ["dyz",(t,p)=>Math.sin(t)*Math.cos(t)*Math.sin(p)],["dx²-y²",(t,p)=>Math.sin(t)**2*Math.cos(2*p)],
       ["dxy",(t,p)=>Math.sin(t)**2*Math.sin(2*p)]],
  "f":[["fz³",(t,p)=>Math.cos(t)*(5*Math.cos(t)**2-3)],
       ["fxz²",(t,p)=>Math.sin(t)*Math.cos(p)*(5*Math.cos(t)**2-1)],
       ["fyz²",(t,p)=>Math.sin(t)*Math.sin(p)*(5*Math.cos(t)**2-1)],
       ["fz(x²-y²)",(t,p)=>Math.sin(t)**2*Math.cos(t)*Math.cos(2*p)],
       ["fxyz",(t,p)=>Math.sin(t)**2*Math.cos(t)*Math.sin(2*p)],
       ["fx(x²-3y²)",(t,p)=>Math.sin(t)**3*Math.cos(3*p)],
       ["fy(3x²-y²)",(t,p)=>Math.sin(t)**3*Math.sin(3*p)]]
};
const LNUM={s:0,p:1,d:2,f:3};

function buildOrbital(n,lch,which){
  const l=LNUM[lch], fn=ANG[lch][Math.min(which,ANG[lch].length-1)][1];
  const Rmax=n*n*3.2+6, N=17000, BINS=900;
  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const cA=new THREE.Color(0x8A6A22), cB=new THREE.Color(0x24466F);
  /* exact radial CDF: P(r) proportional to R(r)^2 r^2 */
  const cdf=new Float32Array(BINS+1); let acc=0;
  for(let i=0;i<BINS;i++){
    const r=(i+0.5)*Rmax/BINS, R=radial(n,l,r);
    acc+=R*R*r*r; cdf[i+1]=acc;
  }
  for(let i=0;i<=BINS;i++) cdf[i]/=acc;
  const sampleR=()=>{
    const u=Math.random(); let lo=0,hi=BINS;
    while(lo<hi){ const mid=(lo+hi)>>1; if(cdf[mid]<u) lo=mid+1; else hi=mid; }
    return (lo-Math.random())*Rmax/BINS;
  };
  /* angular rejection only: |Y|^2, peak found by scan */
  let aPeak=0;
  for(let i=0;i<3000;i++){
    const v=Math.abs(fn(Math.acos(2*Math.random()-1),Math.random()*6.283));
    if(v>aPeak)aPeak=v;
  }
  aPeak=aPeak*aPeak*1.02||1;
  let k=0,guard=0;
  while(k<N&&guard<N*80){
    guard++;
    const th=Math.acos(2*Math.random()-1), ph=Math.random()*6.283;
    const a=fn(th,ph);
    if(Math.random()*aPeak>a*a) continue;
    const r=sampleR(), st=Math.sin(th);
    pos[k*3]=r*st*Math.cos(ph); pos[k*3+1]=r*Math.cos(th); pos[k*3+2]=r*st*Math.sin(ph);
    const c=(radial(n,l,r)*a)>=0?cA:cB;
    col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b;
    k++;
  }
  const rs=[]; for(let i=0;i<k;i++) rs.push(Math.hypot(pos[i*3],pos[i*3+1],pos[i*3+2]));

  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos.slice(0,k*3),3));
  g.setAttribute("color",new THREE.BufferAttribute(col.slice(0,k*3),3));

    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});

    new THREE.MeshBasicMaterial({color:0xffffff}));
  root.add(nuc);

  root.add(nuc);
  const orbs=[];
  sh.forEach((cnt,i)=>{
    const R=3.4+i*2.7;
    const ring=new THREE.Mesh(new THREE.TorusGeometry(R,0.035,8,140),
      new THREE.MeshBasicMaterial({color:0x3E4854}));
    ring.rotation.x=Math.PI/2; root.add(ring);
    const grp=new THREE.Group(); root.add(grp);
    const tilt=(i%3)*0.42-0.42; grp.rotation.z=tilt; grp.rotation.x=(i%2)*0.3;
    for(let j=0;j<cnt;j++){

        new THREE.MeshStandardMaterial({color:0x57C9BC,emissive:0x1c5f58,emissiveIntensity:.8,roughness:.4}));

let nucState={extra:0};
function buildNucleus(e,A){
  const Z=e.z, N=Math.max(0,A-Z), tot=Z+N;
  const R=1.16*Math.pow(tot,1/3);
  const pM=new THREE.MeshStandardMaterial({color:0xC9553F,roughness:.42,metalness:.12});
  const nM=new THREE.MeshStandardMaterial({color:0x6E7A88,roughness:.5,metalness:.1});
  const geo=new THREE.SphereGeometry(0.62,18,14);
  const pI=new THREE.InstancedMesh(geo,pM,Z), nI=new THREE.InstancedMesh(geo,nM,N);
  const d=new THREE.Object3D();
  const pts=[];
  for(let i=0;i<tot;i++){
    const u=(i+0.5)/tot, r=R*Math.cbrt(u);
    const ga=Math.PI*(3-Math.sqrt(5))*i, z=1-2*u, s=Math.sqrt(Math.max(0,1-z*z));
    pts.push([r*s*Math.cos(ga)*1.02,r*z*1.02,r*s*Math.sin(ga)*1.02]);
  }
  for(let i=pts.length-1;i>0;i--){const j=(i*2654435761)%(i+1);[pts[i],pts[j]]=[pts[j],pts[i]];}
  let pi=0,ni=0;
  pts.forEach((p,i)=>{
    d.position.set(p[0],p[1],p[2]); d.updateMatrix();
    if(i%tot<Z && pi<Z){ pI.setMatrixAt(pi++,d.matrix);} else if(ni<N){ nI.setMatrixAt(ni++,d.matrix);} else if(pi<Z){pI.setMatrixAt(pi++,d.matrix);}
  });
  pI.count=pi; nI.count=ni;
  root.add(pI); root.add(nI);
  tDist=R*5.2+9;
}

/* ---------- crystal lattice ---------- */
const CELLS={
  SC:[[0,0,0]],
  BCC:[[0,0,0],[.5,.5,.5]],
  FCC:[[0,0,0],[.5,.5,0],[.5,0,.5],[0,.5,.5]],
  DC:[[0,0,0],[.5,.5,0],[.5,0,.5],[0,.5,.5],[.25,.25,.25],[.75,.75,.25],[.75,.25,.75],[.25,.75,.75]],
  HCP:[[0,0,0],[.5,.5,0],[.25,.1667,.5],[.75,.6667,.5]],
  HEX:[[0,0,0],[.5,.5,0]],
  TET:[[0,0,0],[.5,.5,.5]],
  ORT:[[0,0,0],[.5,.5,.5]],
  RHO:[[0,0,0],[.5,.5,.5]],
  MON:[[0,0,0],[.5,.5,.5]]
};
function buildLattice(e,reps){
  const type=CELLS[e.cry]?e.cry:"FCC";
  const base=CELLS[type];
  const a=4.2, n=reps||3;
  const R=type==="DC"?0.88:1.12;
  const col=new THREE.Color(e.hex);
  const metal=e.cat<=4||e.cat>=9?0.92:0.25;
  const mat=new THREE.MeshStandardMaterial({color:col,metalness:metal,roughness:e.cat===3?0.24:0.38,
    envMapIntensity:1.4});
  const pos=[];
  for(let x=0;x<n;x++)for(let y=0;y<n;y++)for(let z=0;z<n;z++)
    base.forEach(b=>pos.push([(x+b[0])*a,(y+b[1])*a,(z+b[2])*a]));
  const off=(n-1)*a/2+a*0.25;
  const geo=new THREE.SphereGeometry(R,26,20);
  const im=new THREE.InstancedMesh(geo,mat,pos.length);
  const d=new THREE.Object3D();
  pos.forEach((p,i)=>{ d.position.set(p[0]-off,p[1]-off,p[2]-off); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
  root.add(im);
  /* bonds */
  const link=[];
  const maxD=type==="DC"?a*0.46:(type==="BCC"?a*0.90:a*0.76);
  for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
    const dx=pos[i][0]-pos[j][0],dy=pos[i][1]-pos[j][1],dz=pos[i][2]-pos[j][2];
    const dd=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dd<maxD) link.push([pos[i],pos[j],dd]);
  }
  if(link.length&&link.length<3000){
    const bg=new THREE.CylinderGeometry(0.13,0.13,1,7);
    const bm=new THREE.MeshStandardMaterial({color:0x4A5462,metalness:.5,roughness:.5});
    const bi=new THREE.InstancedMesh(bg,bm,link.length);
    const o=new THREE.Object3D(), up=new THREE.Vector3(0,1,0);
    link.forEach((L,i)=>{
      const A=new THREE.Vector3(L[0][0]-off,L[0][1]-off,L[0][2]-off);
      const B=new THREE.Vector3(L[1][0]-off,L[1][1]-off,L[1][2]-off);
      o.position.copy(A).add(B).multiplyScalar(.5);
      o.quaternion.setFromUnitVectors(up,B.clone().sub(A).normalize());
      o.scale.set(1,L[2],1); o.updateMatrix(); bi.setMatrixAt(i,o.matrix);
    });
    root.add(bi);
  }
  tDist=n*a*2.3+8;
}

/* ---------- specimen: what it actually looks like ---------- */
function buildSpecimen(e,tempK){
  const T=tempK||293;
  const phase=T<(e.melt||1e9)?"solid":(T<(e.boil||1e9)?"liquid":"gas");
  const col=new THREE.Color(e.hex);
  if(phase==="gas"){
    const N=9000, pos=new Float32Array(N*3), c2=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      const r=7*Math.cbrt(Math.random()), th=Math.acos(2*Math.random()-1), ph=Math.random()*6.283;
      pos[i*3]=r*Math.sin(th)*Math.cos(ph); pos[i*3+1]=r*Math.cos(th)*0.8; pos[i*3+2]=r*Math.sin(th)*Math.sin(ph);
      const f=0.55+Math.random()*0.45;
      c2[i*3]=col.r*f; c2[i*3+1]=col.g*f; c2[i*3+2]=col.b*f;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.BufferAttribute(pos,3));
    g.setAttribute("color",new THREE.BufferAttribute(c2,3));
    const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.22,vertexColors:true,
      transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
    root.add(pts);
    tickers.push(t=>{pts.rotation.y=t*.12;pts.rotation.x=Math.sin(t*.2)*.1});
    tDist=26; return;
  }
  const geo=new THREE.IcosahedronGeometry(6,phase==="liquid"?5:6);
  const p=geo.attributes.position;
  const v=new THREE.Vector3();
  const amp=phase==="liquid"?0.18:1.0;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n1=Math.sin(v.x*0.9)*Math.cos(v.y*0.75)*Math.sin(v.z*0.62);
    const n2=0.45*Math.sin(v.x*2.3+1.1)*Math.cos(v.z*1.9)*Math.sin(v.y*2.1);
    const n3=0.18*Math.sin(v.x*5.7+2.4)*Math.cos(v.y*6.3)*Math.sin(v.z*5.1);
    const n4=0.07*Math.sin(v.x*13.1)*Math.cos(v.z*11.7)*Math.sin(v.y*12.3);
    v.multiplyScalar(1+(n1+n2+n3+n4)*amp*0.075);
    p.setXYZ(i,v.x,v.y,v.z);
  }
  geo.computeVertexNormals();
  const isMetal=e.cat<=4||e.cat===9||e.cat===10;
  const mat=new THREE.MeshStandardMaterial({
    color:col,
    metalness:isMetal?(phase==="liquid"?1.0:0.95):0.08,
    roughness:phase==="liquid"?0.05:(isMetal?0.31:0.64)
  });
  /* incandescent glow above ~800 K */
  if(T>800){
    const g2=blackbody(T);
    mat.emissive=new THREE.Color(g2[0]/255,g2[1]/255,g2[2]/255);
    mat.emissiveIntensity=Math.min(2.4,(T-800)/1400);
  }
  const m=new THREE.Mesh(geo,mat); root.add(m);
  tDist=20;
}

/* blackbody colour approximation (Tanner Helland) */
function blackbody(K){
  const t=Math.max(1000,Math.min(12000,K))/100;
  let r,g,b;
  if(t<=66){ r=255; g=99.47*Math.log(t)-161.12; }
  else { r=329.7*Math.pow(t-60,-0.1332); g=288.12*Math.pow(t-60,-0.0755); }
  if(t>=66) b=255; else if(t<=19) b=0; else b=138.52*Math.log(t-10)-305.04;
  const c=x=>Math.max(0,Math.min(255,Math.round(x)));
  return [c(r),c(g),c(b)];
}
/* wavelength (nm) -> rgb */
function wl2rgb(w){
  let r=0,g=0,b=0;
  if(w>=380&&w<440){r=-(w-440)/60;b=1}
  else if(w<490){g=(w-440)/50;b=1}
  else if(w<510){g=1;b=-(w-510)/20}
  else if(w<580){r=(w-510)/70;g=1}
  else if(w<645){r=1;g=-(w-645)/65}
  else if(w<=780){r=1}
  else if(w<380){b=1;r=.4}
  else {r=.5}
  let f=1;
  if(w>=380&&w<420)f=.3+.7*(w-380)/40;
  else if(w>700&&w<=780)f=.3+.7*(780-w)/80;
  else if(w<380||w>780)f=.35;
  const c=x=>Math.round(255*Math.pow(Math.max(0,x)*f,0.8));
  return [c(r),c(g),c(b)];
}

function buildSub(){

function offlineRead(e,part){
  const T=293, ph=e.melt===null?null:(T<e.melt?"solid":(e.boil&&T<e.boil?"liquid":"gas"));
  const meltRank=EL.filter(x=>x.melt&&e.melt&&x.melt>e.melt).length;
  const densCmp=e.dens===null?null:
    e.dens<0.01?"lighter than air":
    e.dens<1?"less dense than water — it would float":
    e.dens<3?"light for a solid, in the range of aluminium":
    e.dens<8?"around the density of iron":
    e.dens<12?"noticeably denser than iron":"one of the densest materials there is";
  const n=NOTE[e.sym]||[];
  const P=[];
  if(part===0){
    let a=[];
    if(n[0]) a.push(n[0]);
    a.push("It is a "+CATN[e.cat].toLowerCase()+
      (e.group?", sitting in group "+e.group+" of period "+e.period:" in period "+e.period)+
      ", which puts "+valenceOf(e.z)+" electron"+(valenceOf(e.z)===1?"":"s")+" in its outer region. That count is what governs how it bonds.");
    if(ph) a.push("At room temperature it is a "+ph+"."+
      (e.melt!==null?" It melts at "+e.melt.toFixed(0)+" K, or "+K2C(e.melt).toFixed(0)+" °C, which makes it higher-melting than "+
        (118-meltRank-1)+" of the other elements and lower than "+meltRank+".":""));
    if(densCmp) a.push("At "+e.dens+" g/cm³ it is "+densCmp+".");
    if(e.cry) a.push("Its atoms pack in a "+({BCC:"body-centred cubic",FCC:"face-centred cubic",HCP:"hexagonal close-packed",DC:"diamond cubic",SC:"simple cubic",HEX:"hexagonal",TET:"tetragonal",ORT:"orthorhombic",RHO:"rhombohedral",MON:"monoclinic"}[e.cry]||e.cry)+" arrangement.");
    P.push(a.join(" "));
    const b=[];
    b.push(e.year===0?"It has been known and worked since antiquity, long before anyone understood what an element was."
      :"It was identified in "+e.year+".");
    if(e.en!==null) b.push("Its electronegativity of "+e.en+(e.en>=3?" is among the highest in the table, so it pulls hard on shared electrons and tends to take them outright."
      :e.en<=1?" is very low, so it gives electrons up readily — the defining behaviour of a reactive metal.":" is middling, so it shares electrons rather than seizing or surrendering them."));
    b.push("Its electron configuration is "+configStr(e.z,true)+".");
    if(CFGEX[e.z]) b.push("It breaks the simple filling order, because a half-filled or filled subshell turns out to be more stable than the naive prediction.");
    P.push(b.join(" "));
  }
  if(part===1){
    const ab=abundText(e.sym);
    const a=[];
    if(ab){ a.push("In the earth's crust it runs at about "+(ab[0]>=1?ab[0].toLocaleString():ab[0].toExponential(1))+" parts per million, which makes it "+ab[1]+".");
      const rank=Object.keys(ABUND).filter(k=>ABUND[k]>ab[0]).length+1;
      a.push("That puts it roughly "+rank+(rank===1?"st":rank===2?"nd":rank===3?"rd":"th")+" among the elements with measurable crustal abundance."); }
    else a.push("It has no meaningful natural abundance. Every atom of it that exists has been made in a reactor or an accelerator, usually a few at a time.");
    if(e.cat===8) a.push("As a noble gas it is recovered from the atmosphere by fractional distillation of liquid air rather than mined from rock.");
    else if(e.cat===1||e.cat===2) a.push("Being this reactive, it is never found as the free metal. It occurs only as compounds, and getting the metal out takes electrolysis of a molten salt rather than simple smelting.");
    else if(e.cat===9) a.push("Lanthanides occur together in the same few minerals — monazite and bastnäsite mainly — and separating them from each other is the hard and expensive part, because chemically they behave almost identically.");
    else if(e.cat===10) a.push("Actinides are radioactive, and beyond uranium they are essentially all synthetic, made by bombarding lighter actinides with neutrons or ions.");
    else if(e.z>=104) a.push("It is produced by fusing lighter nuclei in an accelerator. Only a handful of atoms have ever existed, and they decayed within seconds or less.");
    P.push(a.join(" "));
    if(n[1]) P.push(n[1]);
    else if(ab&&ab[0]<1) P.push("At this level it is almost always recovered as a byproduct of refining something more common, rather than mined on its own account. That is the usual economics of scarce elements — the cost of processing the ore is already being paid for another metal.");
  }
  if(part===2){
    const comps=Object.keys(COMP).filter(k=>k.split(",").includes(e.sym));
    const a=[];
    if(comps.length){
      a.push("Compounds of it stored in this app: "+comps.map(k=>COMP[k].f+" ("+COMP[k].n.split(" — ")[0]+")").join(", ")+". Open the Combine tab to see how each one bonds and what it is used for.");
    }
    const r=reactRule(e,"water"), rf=reactRule(e,"flame");
    a.push("Put in water, the behaviour is: "+r.title.toLowerCase()+". "+r.text);
    P.push(a.join(" "));
    const b=[];
    if(FLAME[e.sym]) b.push("In a flame it burns "+FLAME[e.sym][0].toLowerCase()+", which is the visible form of its emission spectrum. "+rf.text);
    if(SPEC[e.sym]) b.push("Its principal visible emission lines are stored here — "+SPEC[e.sym].length+" of them — so the Spectrum tab will show the real pattern rather than an approximation.");
    if(b.length) P.push(b.join(" "));
    P.push("This description was assembled from the measured data stored in this file. The fuller written account — history, mining, industry, biology — is generated live and needs the app running inside Claude.");
  }
  return P.join("\n\n");
}

function fmt(v,d,u){ return v===null||v===undefined?'<span class="dim">unknown</span>':v.toFixed(d)+(u?' <small>'+u+'</small>':''); }
function renderData(){
  const e=CUR, sh=shellsOf(e.z);

    F("Density",fmt(e.dens,e.dens&&e.dens<0.01?5:3,"g/cm³"))+

    F("Common isotope",e.sym+"-"+massNum(e))+
    F("Neutrons",massNum(e)-e.z)+
    F("Valence electrons",valenceOf(e.z))+
    F("Block",BLOCK(e.z)+"-block")+
    F("Discovered",e.year===0?"antiquity":e.year)+
    F("Crustal abundance",ABUND[e.sym]===undefined?'<span class="dim">negligible</span>':
      (ABUND[e.sym]>=1?ABUND[e.sym].toLocaleString():ABUND[e.sym].toExponential(1))+' <small>ppm</small>')+
   '</div>'+
   '<h3>Electron configuration</h3>'+
   '<p style="font-family:var(--mono);font-size:14px">'+configStr(e.z,true)+'</p>'+
   '<p class="dim small" style="font-family:var(--mono)">'+configStr(e.z,false)+'</p>'+
   '<p class="small dim">Electrons per shell: '+sh.join(" · ")+
     (CFGEX[e.z]?'<br>This element breaks the simple filling order — a half-full or full subshell is more stable than the naive prediction.':'')+'</p>'+
   '<h3>Nucleus</h3>'+
   '<p class="small">'+e.z+' protons, '+(massNum(e)-e.z)+' neutrons in the most common isotope. '+
     'Trend estimate: <span class="pill">'+st.label+'</span> — '+st.note+'.</p>'+
   '<p class="small dim">Stability here is estimated from the valley-of-stability trend, not read from a nuclide table. Treat it as a rule of thumb.</p>'+
   '<h3>Position in the table</h3>'+
   '<p class="small">'+trendText(e)+'</p>';
}
function trendText(e){
  const bits=[];
  if(e.group) bits.push("Group "+e.group+" means "+valenceOf(e.z)+" electrons in the outer region, which is what sets its bonding behaviour.");
  bits.push("Period "+e.period+" means the outermost electrons sit in shell "+e.period+".");
  if(e.en!==null){
    if(e.en>=3.0) bits.push("An electronegativity of "+e.en+" is high — this element pulls hard on shared electrons and tends to take them outright.");
    else if(e.en<=1.0) bits.push("An electronegativity of "+e.en+" is very low — it gives electrons up readily, which is what makes it reactive as a metal.");
    else bits.push("An electronegativity of "+e.en+" is middling — it shares electrons rather than taking or surrendering them.");
  }
  return bits.join(" ");
}

let thermoRAF=null;
function renderThermal(){
  const e=CUR;
  if(e.melt===null){ $("v-thermal").innerHTML='<h2>Heat &amp; cool</h2><p>No measured melting or boiling point exists for '+e.name+'. For the heaviest synthetic elements only a handful of atoms have ever been made, and they decay in milliseconds — there is no bulk sample to melt.</p>'; return; }
  const maxT=Math.min(7000,Math.max(1200,(e.boil||1500)*1.35));
  $("v-thermal").innerHTML=
   '<h2>Heat &amp; cool</h2>'+
   '<p class="small dim">Drag the temperature. The simulation below shows how the atoms behave, and the sample colour is the real blackbody colour a body at that temperature glows.</p>'+
   '<div class="ctl"><label>Temperature</label><input type="range" id="tSl" min="1" max="'+Math.round(maxT)+'" value="293" step="1"><div class="rd" id="tRd">293 K</div></div>'+
   '<div id="phaseBar"></div>'+
   '<div class="row small dim" style="justify-content:space-between;margin-bottom:14px"><span>0 K</span><span>'+Math.round(maxT)+' K</span></div>'+
   '<canvas id="thermoCv" height="200"></canvas>'+
   '<div class="card" style="margin-top:14px"><h4 id="phTitle">Solid</h4><p class="small" id="phText"></p></div>'+
   '<h3>Fixed points</h3>'+
   '<p class="small">Melts at '+e.melt.toFixed(1)+' K ('+K2C(e.melt).toFixed(0)+' °C). '+
     (e.boil?'Boils at '+e.boil.toFixed(1)+' K ('+K2C(e.boil).toFixed(0)+' °C). ':'')+
     'That is a liquid range of '+(e.boil?Math.round(e.boil-e.melt)+' K':'unknown width')+'.</p>'+
   '<p class="small dim" id="cmp"></p>';

  const bar=$("phaseBar");
  const mp=e.melt/maxT*100, bp=Math.min(100,(e.boil||maxT)/maxT*100);
  bar.innerHTML='<div style="width:'+mp+'%;background:#2E3C50;color:#9FB4CC">solid</div>'+
    '<div style="width:'+(bp-mp)+'%;background:#7A4A2A;color:#F0C9A8">liquid</div>'+
    '<div style="width:'+(100-bp)+'%;background:#4A3560;color:#D0B4E8">gas</div><div id="phaseMark"></div>';

  const cv=$("thermoCv"), ctx=cv.getContext("2d");
  const N=170, P=[];
  for(let i=0;i<N;i++) P.push({x:Math.random(),y:Math.random(),vx:0,vy:0,hx:0,hy:0});
  const cols=Math.ceil(Math.sqrt(N));
  P.forEach((p,i)=>{ p.hx=(i%cols+.5)/cols; p.hy=(Math.floor(i/cols)+.5)/cols; p.x=p.hx; p.y=p.hy; });

  let T=293;
  const sl=$("tSl");
  function upd(){
    T=+sl.value; $("tRd").textContent=T+" K";
    $("phaseMark").style.left=(T/maxT*100)+"%";
    const ph=T<e.melt?"solid":(e.boil&&T<e.boil?"liquid":"gas");
    $("phTitle").textContent=ph==="solid"?"Solid":(ph==="liquid"?"Liquid":"Gas");
    $("phText").textContent=
      ph==="solid"?"Atoms are locked into lattice sites. They still vibrate — amplitude rises with temperature — but they cannot swap places. That fixed arrangement is what gives a solid its shape and stiffness."
      :ph==="liquid"?"Atoms still touch but no longer hold their positions. Bonds break and reform constantly, so the material flows while staying almost as dense as the solid. Melting takes energy without raising temperature — the latent heat goes into breaking the lattice, not into motion."
      :(e.boil?"Atoms have enough kinetic energy to escape each other entirely. Spacing goes up by roughly a factor of ten in each direction, so the volume increases about a thousandfold at atmospheric pressure.":"Above the melting point there is no measured boiling point for this element — only a handful of atoms have ever existed at once, so nobody has boiled a sample of it.");
    const c=$("cmp");
    const hotter=EL.filter(x=>x.melt&&x.melt>e.melt).length;
    c.textContent="Of the 118 elements, "+hotter+" melt at a higher temperature than "+e.name+" and "+
      EL.filter(x=>x.melt&&x.melt<e.melt).length+" melt lower.";
  }
  sl.oninput=upd; upd();

  if(thermoRAF) cancelAnimationFrame(thermoRAF);
  function draw(){
    const w=cv.width=cv.clientWidth, h=cv.height;
    const ph=T<e.melt?0:(e.boil&&T<e.boil?1:2);
    const heat=Math.min(1,T/(e.boil||e.melt*2));
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle="#07090C"; ctx.fillRect(0,0,w,h);
    const bb=blackbody(Math.max(1000,T));
    const glow=T>800?Math.min(1,(T-800)/1800):0;
    const base=e.hex;
    P.forEach(p=>{
      if(ph===0){
        const a=heat*0.055;
        p.x=p.hx+(Math.random()-.5)*a; p.y=p.hy+(Math.random()-.5)*a;
      } else if(ph===1){
        p.vx+=(Math.random()-.5)*0.004; p.vy+=(Math.random()-.5)*0.004;
        p.vx+=(0.5-p.x)*0.0016; p.vy+=(0.62-p.y)*0.004;
        p.vx*=0.97; p.vy*=0.97;
        p.x+=p.vx; p.y+=p.vy;
        if(p.y>0.97){p.y=0.97;p.vy*=-0.4} if(p.y<0.30){p.y=0.30;p.vy*=-0.4}
        if(p.x<0.02){p.x=0.02;p.vx*=-1} if(p.x>0.98){p.x=0.98;p.vx*=-1}
      } else {
        if(Math.abs(p.vx)<0.0005){p.vx=(Math.random()-.5)*0.02;p.vy=(Math.random()-.5)*0.02}
        p.x+=p.vx*(0.5+heat); p.y+=p.vy*(0.5+heat);
        if(p.x<0||p.x>1)p.vx*=-1; if(p.y<0||p.y>1)p.vy*=-1;
        p.x=Math.max(0,Math.min(1,p.x)); p.y=Math.max(0,Math.min(1,p.y));
      }
      const r=ph===2?1.8:3.1;
      ctx.beginPath(); ctx.arc(p.x*w,p.y*h,r,0,6.283);
      ctx.fillStyle=glow>0?'rgb('+bb[0]+','+bb[1]+','+bb[2]+')':base;
      ctx.globalAlpha=ph===2?0.55:0.92;
      ctx.fill();
    });
    ctx.globalAlpha=1;
    thermoRAF=requestAnimationFrame(draw);
  }
  draw();
}

function drawSpectrum(lines,label){
  const cv=$("spectrum"); if(!cv)return;
  const w=cv.width=cv.clientWidth, h=cv.height=150;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#050608"; ctx.fillRect(0,0,w,h);
  const lo=380,hi=750;
  /* faint continuous reference strip */
  for(let x=0;x<w;x++){
    const wl=lo+(hi-lo)*x/w, c=wl2rgb(wl);
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',0.15)';
    ctx.fillRect(x,h-24,1,16);
  }
  lines.filter(l=>l>=lo&&l<=hi).forEach(l=>{
    const x=(l-lo)/(hi-lo)*w, c=wl2rgb(l);
    const grd=ctx.createLinearGradient(x-3,0,x+3,0);
    grd.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    grd.addColorStop(.5,'rgb('+c[0]+','+c[1]+','+c[2]+')');
    grd.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    ctx.fillStyle=grd; ctx.fillRect(x-2,16,4,h-42);
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')'; ctx.fillRect(x-0.5,16,1,h-42);
  });
  ctx.font="10px 'IBM Plex Mono',monospace"; ctx.fillStyle="#6B7480"; ctx.textAlign="center";
  [400,450,500,550,600,650,700].forEach(t=>{
    const x=(t-lo)/(hi-lo)*w; ctx.fillText(t,x,h-3);
  });
  ctx.textAlign="left"; ctx.fillStyle="#99A3B0"; ctx.fillText(label||"",6,11);
}
function renderSpectra(){

      (e.sym==="H"?'<p class="small">Hydrogen is the clean case: these four are the Balmer series, electrons falling to shell 2 from shells 3, 4, 5 and 6. Every other element is a messier version of the same idea.</p>':'')+
      (e.sym==="Na"?'<p class="small">The two lines at 589.0 and 589.6 nm are the sodium D doublet — the yellow of a street lamp. They are split because the electron\'s spin can align with or against its orbital motion, and those two states differ very slightly in energy.</p>':'');

        if(d.lines&&d.lines.length){ drawSpectrum(d.lines,e.sym+" — principal visible lines");

/* ============================================================
   MOLECULE RENDERING (used by Combine)
   ============================================================ */
const GEOM={
  linear:[[0,0,0],[1,0,0],[-1,0,0]],
  bent:[[0,0,0],[0.94,0.34,0],[-0.94,0.34,0]],
  pyramidal:[[0,0,0],[0.94,-0.33,0],[-0.47,-0.33,0.82],[-0.47,-0.33,-0.82]],
  tetrahedral:[[0,0,0],[0.58,0.58,0.58],[-0.58,-0.58,0.58],[-0.58,0.58,-0.58],[0.58,-0.58,-0.58]],
  planar:[[0,0,0],[1,0,0],[-0.5,0.87,0],[-0.5,-0.87,0]]
};
function buildMolecule(centre,outer,count,geo){
  if(!HAS3D) return;
  clearRoot(); tickers=[]; autoSpin=true; showingCompound=true;
  const g=GEOM[geo]||GEOM.tetrahedral;
  const scale=4.4;
  const rad=e=>Math.max(1.0,Math.min(2.3,0.55+ (e.z<=2?0.6:(e.z<=10?1.0:(e.z<=18?1.35:1.6)))));
  const mk=(e,p,r)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,40,30),
      new THREE.MeshStandardMaterial({color:new THREE.Color(e.hex),
        metalness:e.cat<=4?0.8:0.15,roughness:e.cat<=4?0.3:0.45}));
    m.position.set(p[0]*scale,p[1]*scale,p[2]*scale); root.add(m); return m;
  };
  const c0=mk(centre,g[0],rad(centre)*1.15);
  const bm=new THREE.MeshStandardMaterial({color:0x5A6472,metalness:.4,roughness:.5});
  for(let i=1;i<=Math.min(count,g.length-1);i++){
    const p=g[i]; mk(outer,p,rad(outer));
    const A=new THREE.Vector3(0,0,0), B=new THREE.Vector3(p[0]*scale,p[1]*scale,p[2]*scale);
    const len=A.distanceTo(B);
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,len,14),bm);
    cyl.position.copy(A).add(B).multiplyScalar(.5);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());
    root.add(cyl);
  }
  tDist=20; snapCam(); resize();
}

function renderCombine(){
  const e=CUR;
  const opts=EL.map(x=>'<option value="'+x.sym+'">'+x.z+" · "+x.name+'</option>').join("");
  $("v-combine").innerHTML=
   '<h2>Combine</h2>'+
   '<p class="small dim">Put '+e.name+' together with a second element and see what forms, how the bond works, and what the shape of the result is.</p>'+
   '<div class="row" style="margin-bottom:16px">'+
     '<span class="pill" style="font-size:14px;padding:6px 12px;border-color:'+CATC[e.cat]+';color:'+CATC[e.cat]+'">'+e.sym+'</span>'+
     '<span class="dim">+</span><select id="cSel">'+opts+'</select>'+
     '<button class="btn pri" id="cGo">Combine</button></div>'+
   '<div id="cOut"></div>';
  $("cGo").onclick=()=>doCombine(e,BYSYM[$("cSel").value]);
  const def=e.sym==="O"?"H":"O"; $("cSel").value=def; doCombine(e,BYSYM[def]);
}
async function doCombine(a,b){
  const out=$("cOut");
  if(a.sym===b.sym){ out.innerHTML='<p class="small dim">Pick a different second element.</p>'; return; }
  const k=[a.sym,b.sym].sort().join(",");
  const local=COMP[k];
  const show=(d,src)=>{
    const dEN=(a.en!==null&&b.en!==null)?Math.abs(a.en-b.en).toFixed(2):null;
    out.innerHTML=
     '<div class="card"><h4 style="font-size:24px;letter-spacing:-.02em">'+d.f+'</h4>'+
     '<p style="margin:0 0 10px"><span style="font-weight:500">'+d.n+'</span> <span class="pill">'+d.b+'</span></p>'+
     '<p class="small">'+d.d+'</p></div>'+
     (dEN!==null?'<div class="card"><h4>Why that bond type</h4><p class="small">The electronegativity gap between '+
       a.sym+' ('+a.en+') and '+b.sym+' ('+b.en+') is '+dEN+'. Below about 0.4 the electrons are shared evenly and the bond is nonpolar covalent; between 0.4 and 1.7 it is polar covalent, shared but lopsided; above 1.7 one atom takes the electron outright and you get ions. This is a rule of thumb, not a law, but it predicts most binary compounds correctly.</p></div>':'')+
     '<p class="small dim">'+src+'</p>';
    const sub={"₂":2,"₃":3,"₄":4,"₅":5,"₆":6};
    const countOf=sy=>{ const m2=d.f.match(new RegExp(sy+"([₂-₆]?)")); return m2?(sub[m2[1]]||1):0; };
    const na=countOf(a.sym), nb=countOf(b.sym);
    const centre=(na<=nb&&na>0)?a:b, outer=(centre===a)?b:a;
    const cnt=Math.max(1,Math.min(4,centre===a?nb:na));
    showingCompound=true;
    if(d.g&&d.g!=="lattice"){ buildMolecule(centre,outer,cnt,d.g);
      $("stageNote").textContent=d.f+"  ·  "+d.g+" geometry\nBond lengths and angles are indicative, not to scale.";
    } else { buildLatticeMixed(a,b);
      $("stageNote").textContent=d.f+"  ·  "+a.sym+" and "+b.sym+" alternating in a lattice\nIonic and network solids have no discrete molecules — the whole crystal is the unit."; }
  };
  if(local){ show(local,"From the built-in compound set."); return; }
  out.innerHTML='<span class="load"></span> <span class="dim small">Working out what '+a.sym+' and '+b.sym+' do together…</span>';
  try{
    const d=await askClaudeJSON('Return ONLY JSON, no markdown. Two elements: '+a.name+' ('+a.sym+') and '+b.name+' ('+b.sym+'). Give the most important or most common binary compound they form. Shape: {"f":"formula with unicode subscripts","n":"compound name","b":"bond type, e.g. Ionic / Polar covalent / Covalent network / Metallic alloy / Intermetallic","g":"one of: linear, bent, pyramidal, tetrahedral, planar, lattice","d":"3 to 5 sentences of plain direct prose for a curious adult with a metal fabrication background - what it is, how the bonding works, what it is actually used for, and one specific or surprising detail. No markdown, no lists."}. If these two elements do not form any stable compound, still use the same shape and say so clearly in d, with f set to the word None.');
    show(d,"Generated for this pair.");
  }catch(err){ out.innerHTML='<div class="err">'+err.message+'</div>'+
    '<p class="small dim">40 common compounds are stored in this file and work offline. '+
    (a.en!==null&&b.en!==null?'For this pair the electronegativity gap is '+Math.abs(a.en-b.en).toFixed(2)+
      ', which predicts a '+(Math.abs(a.en-b.en)>1.7?'largely ionic':(Math.abs(a.en-b.en)>0.4?'polar covalent':'nonpolar covalent or metallic'))+' bond.':'')+'</p>'; }
}
function buildLatticeMixed(a,b){
  if(!HAS3D) return;
  clearRoot(); tickers=[]; autoSpin=true; showingCompound=true;
  const n=3,sp=4.2;
  const mA=new THREE.MeshStandardMaterial({color:new THREE.Color(a.hex),metalness:a.cat<=4?.85:.1,roughness:.35});
  const mB=new THREE.MeshStandardMaterial({color:new THREE.Color(b.hex),metalness:b.cat<=4?.85:.1,roughness:.35});
  const gA=new THREE.SphereGeometry(1.5,26,20), gB=new THREE.SphereGeometry(1.05,26,20);
  const pa=[],pb=[];
  for(let x=0;x<n;x++)for(let y=0;y<n;y++)for(let z=0;z<n;z++)
    ((x+y+z)%2?pb:pa).push([x*sp,y*sp,z*sp]);
  const off=(n-1)*sp/2;
  [[pa,gA,mA],[pb,gB,mB]].forEach(([ps,g,m])=>{
    const im=new THREE.InstancedMesh(g,m,ps.length), d=new THREE.Object3D();
    ps.forEach((p,i)=>{d.position.set(p[0]-off,p[1]-off,p[2]-off);d.updateMatrix();im.setMatrixAt(i,d.matrix)});
    root.add(im);
  });
  tDist=n*sp*2.4+8; snapCam(); resize();
}

   REACTIONS
   ============================================================ */
let reactRAF=null, reactVigor=0, reactMedium="water";
function renderReact(){
  const e=CUR;
  $("v-react").innerHTML=
   '<h2>Reactions</h2>'+
   '<p class="small dim">Drop '+e.name+' into each environment and see what happens. Behaviour comes from its group and its position in the reactivity series.</p>'+
   '<div class="row" style="margin-bottom:14px">'+
     ['water','acid','air','flame'].map(m=>'<button class="btn'+(m===reactMedium?' pri':'')+'" data-md="'+m+'">'+
       ({water:"Water",acid:"Dilute acid",air:"Air",flame:"Flame"}[m])+'</button>').join("")+
   '</div>'+
   '<canvas id="reactCv" height="180"></canvas>'+
   '<div class="card" style="margin-top:14px"><h4 id="rT"></h4><p class="small" id="rX"></p>'+
     '<div class="row" style="align-items:center;margin-top:8px"><span class="small dim">Vigour</span>'+
     '<div style="flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden">'+
     '<div id="rBar" style="height:100%;width:0%;background:linear-gradient(90deg,#4A79B5,#EBC96E,#C25B5B)"></div></div>'+
     '<span class="small" id="rN" style="font-family:var(--mono)"></span></div></div>'+
   '<div class="row" style="margin-top:12px"><button class="btn" id="rMore">Explain the chemistry in detail</button></div>'+
   '<div id="rAI" style="margin-top:12px"></div>';
  $("v-react").querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{reactMedium=b.dataset.md;renderReact()});
  const r=reactRule(e,reactMedium);
  reactVigor=r.vigor;
  $("rT").textContent=r.title; $("rX").textContent=r.text;
  $("rBar").style.width=(r.vigor/5*100)+"%"; $("rN").textContent=r.vigor+"/5";
  $("rMore").onclick=async()=>{
    $("rAI").innerHTML='<span class="load"></span> <span class="dim small">Working through it…</span>';
    try{
      const t=await askClaude(VOICE+'\n\nExplain in at most 3 short paragraphs exactly what happens chemically when '+e.name+' ('+e.sym+') meets '+
        ({water:"water",acid:"dilute hydrochloric acid",air:"air at room temperature",flame:"a hot flame"}[reactMedium])+
        '. Give the balanced equation in plain text on its own line if there is a real reaction. Say what you would actually observe. If nothing happens, say why in terms of electron structure.');
      $("rAI").innerHTML=mdToHtml(t);
    }catch(err){ $("rAI").innerHTML='<div class="err">'+err.message+'</div>'+
      '<p class="small dim">The summary above it comes from stored reactivity rules and does not need a connection.</p>'; }
  };
  const cv=$("reactCv"), ctx=cv.getContext("2d");
  const bub=[];
  if(reactRAF) cancelAnimationFrame(reactRAF);
  function draw(){
    const w=cv.width=cv.clientWidth,h=cv.height;
    ctx.clearRect(0,0,w,h);
    const med=reactMedium;
    ctx.fillStyle=med==="flame"?"#0B0705":"#07090C"; ctx.fillRect(0,0,w,h);
    if(med==="water"||med==="acid"){
      ctx.fillStyle=med==="water"?"rgba(74,121,181,0.18)":"rgba(201,154,59,0.16)";
      ctx.fillRect(0,h*0.28,w,h*0.72);
      ctx.fillStyle=med==="water"?"rgba(74,121,181,0.5)":"rgba(201,154,59,0.5)";
      ctx.fillRect(0,h*0.28,w,2);
    }
    /* sample */
    const cx=w/2, cy=h*0.66, rr=13;
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.283);
    ctx.fillStyle=e.hex; ctx.fill();
    if(med==="flame"&&FLAME[e.sym]){
      const gr=ctx.createRadialGradient(cx,cy-20,2,cx,cy-20,70);
      gr.addColorStop(0,FLAME[e.sym][1]); gr.addColorStop(1,"rgba(0,0,0,0)");
      ctx.globalAlpha=0.5+0.25*Math.sin(Date.now()*0.006);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(cx,cy-20,70,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    }
    const rate=reactVigor*reactVigor*0.5;
    for(let i=0;i<rate;i++) if(Math.random()<0.45)
      bub.push({x:cx+(Math.random()-.5)*rr*2,y:cy,r:1+Math.random()*3,v:0.5+Math.random()*1.6*reactVigor/3,
                c:med==="flame"?(FLAME[e.sym]?FLAME[e.sym][1]:"#E0A050"):"#AFC6DD"});
    for(let i=bub.length-1;i>=0;i--){
      const b2=bub[i]; b2.y-=b2.v; b2.x+=Math.sin(b2.y*0.06)*0.4;
      ctx.globalAlpha=Math.max(0,b2.y/h);
      ctx.beginPath(); ctx.arc(b2.x,b2.y,b2.r,0,6.283); ctx.fillStyle=b2.c; ctx.fill();
      if(b2.y<-6) bub.splice(i,1);
    }
    ctx.globalAlpha=1;
    if(reactVigor===0){
      ctx.fillStyle="#5E6774"; ctx.font="12px Archivo,sans-serif"; ctx.textAlign="center";
      ctx.fillText("no reaction",cx,h-14);
    }
    reactRAF=requestAnimationFrame(draw);
  }
  draw();
}

   LEARN
   ============================================================ */
const TRENDS=[
 ["Atomic radius","Shrinks left to right, grows down. Across a period you add protons without adding a shell, so the nucleus pulls the same electrons in tighter. Down a group you add whole shells, so size jumps."],
 ["Ionisation energy","Rises left to right, falls down. It is the energy to strip one electron off. A tightly held electron close to a strong nucleus is hard to remove; a distant one shielded by inner shells is easy."],
 ["Electronegativity","Rises left to right, falls down — same logic, but about pulling on shared electrons rather than losing your own. Fluorine is the maximum at 3.98. Caesium and francium are the minimum."],
 ["Metallic character","Falls left to right, rises down. Metals give electrons up; nonmetals take them. The staircase of metalloids running from boron to astatine is the boundary between the two behaviours."]
];
function renderLearn(){
  $("v-learn").innerHTML=
   '<h2>Learn</h2>'+
   '<div class="card"><h4>Predict before you look</h4>'+
   '<p class="small">The fastest way to build real intuition is to commit to a guess first, then find out. Generate a question about '+CUR.name+', answer it, and read why.</p>'+
   '<button class="btn pri" id="qz">Give me a question</button><div id="qzOut" style="margin-top:14px"></div></div>'+
   '<h3>The four trends worth knowing first</h3>'+
   '<p class="small dim">Learn these and most element behaviour becomes something you can reason out rather than memorise.</p>'+
   TRENDS.map(t=>'<div class="card"><h4>'+t[0]+'</h4><p class="small" style="margin:0">'+t[1]+'</p></div>').join("")+
   '<h3>A route through the table</h3>'+
   '<p class="small">Start with the eight elements that make up almost all of everyday matter: hydrogen, carbon, nitrogen, oxygen, sodium, silicon, sulfur, iron. Then the alloying metals — chromium, manganese, nickel, molybdenum, vanadium, tungsten — where the chemistry is about what a small percentage does to a lattice. Then the noble gases, which teach you what a full shell means by showing you what happens when nothing wants to react. After that the rest of the table is variations on patterns you already have.</p>'+
   '<p class="small dim">Try the same element across all six tabs before moving on. Reading the spectrum after you have seen the shells makes both of them land harder than either does alone.</p>';
  $("qz").onclick=async()=>{
    const o=$("qzOut");
    o.innerHTML='<span class="load"></span> <span class="dim small">Writing a question…</span>';
    try{
      const d=await askClaudeJSON('Return ONLY JSON, no markdown. Write one multiple-choice question about the element '+CUR.name+' ('+CUR.sym+', atomic number '+CUR.z+') that can be reasoned out from periodic trends, electron configuration or position in the table rather than recalled as trivia. Shape: {"q":"the question","opts":["a","b","c","d"],"correct":0,"why":"3 to 4 sentences explaining the reasoning that gets you there, plain prose, no markdown"}. correct is the index of the right option.');
      o.innerHTML='<p style="font-weight:500;margin-bottom:10px">'+d.q+'</p>'+
        '<div id="qzOpts">'+d.opts.map((t,i)=>'<button class="btn" data-i="'+i+'" style="display:block;width:100%;text-align:left;margin-bottom:6px">'+t+'</button>').join("")+'</div>'+
        '<div id="qzWhy"></div>';
      o.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, ok=i===d.correct;
        o.querySelectorAll("[data-i]").forEach(x=>{
          const xi=+x.dataset.i; x.disabled=true;
          if(xi===d.correct) x.style.borderColor="#5FA870",x.style.color="#8FD49F";
          else if(xi===i) x.style.borderColor="#C25B5B",x.style.color="#E08A8A";
        });
        $("qzWhy").innerHTML='<p style="font-weight:500;margin:12px 0 6px;color:'+(ok?"#8FD49F":"#E0A56A")+'">'+
          (ok?"Right.":"Not this time.")+'</p><p class="small">'+d.why+'</p>';
      });
    }catch(err){ o.innerHTML='<div class="err">'+err.message+'</div>'; }
  };
}
